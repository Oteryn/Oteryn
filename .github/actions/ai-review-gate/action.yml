name: Oteryn AI review gate
description: Classify exact PR risk and require authenticated external AI review only for Ready R1/R2 changes.
inputs:
  base-sha:
    description: Expected pull request base SHA; must match GitHub event context.
    required: true
  head-sha:
    description: Expected pull request head SHA; must match GitHub event context.
    required: true
  draft:
    description: Expected Draft state; must match GitHub event context.
    required: true
  repository:
    description: Expected owner/repo; must match GitHub context.
    required: true
  pr-number:
    description: Expected pull request number; must match GitHub event context.
    required: true
  pr-id:
    description: Expected immutable pull request object ID; must match GitHub event context.
    required: true
  github-token:
    description: GITHUB_TOKEN with pull-requests:read and issues:read.
    required: true
outputs:
  tier:
    description: R0, R1 or R2.
    value: ${{ steps.classify.outputs.tier }}
  fingerprint:
    description: Stable risk-bearing review fingerprint.
    value: ${{ steps.classify.outputs.fingerprint }}
  reviewer-class:
    description: none, fast or deep.
    value: ${{ steps.classify.outputs.reviewer_class }}
  envelope-path:
    description: Canonical trusted review-evidence envelope, ready to attest.
    value: ${{ steps.issue.outputs.envelope-path }}
  envelope-sha256:
    description: SHA-256 binding identifier for the exact envelope bytes.
    value: ${{ steps.issue.outputs.envelope-sha256 }}
runs:
  using: composite
  steps:
    - id: bind
      name: Bind caller inputs to immutable GitHub PR context
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base-sha }}
        INPUT_HEAD: ${{ inputs.head-sha }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PR_ID: ${{ inputs.pr-id }}
        INPUT_PR: ${{ inputs.pr-number }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        EVENT_DRAFT: ${{ github.event.pull_request.draft }}
        EVENT_REPOSITORY: ${{ github.repository }}
        EVENT_PR_ID: ${{ github.event.pull_request.id }}
        EVENT_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        python3 - "$GITHUB_OUTPUT" <<'PY'
        import os, re, sys
        expected={'base':os.environ['EVENT_BASE'],'head':os.environ['EVENT_HEAD'],'draft':os.environ['EVENT_DRAFT'].lower(),'repository':os.environ['EVENT_REPOSITORY'],'pr_id':os.environ['EVENT_PR_ID'],'pr':os.environ['EVENT_PR']}
        actual={'base':os.environ['INPUT_BASE'],'head':os.environ['INPUT_HEAD'],'draft':os.environ['INPUT_DRAFT'].lower(),'repository':os.environ['INPUT_REPOSITORY'],'pr_id':os.environ['INPUT_PR_ID'],'pr':os.environ['INPUT_PR']}
        if os.environ['EVENT_NAME'] != 'pull_request_target':
            raise SystemExit('AI review gate requires trusted pull_request_target context')
        if not re.fullmatch(r'[0-9a-f]{40}',expected['base']) or not re.fullmatch(r'[0-9a-f]{40}',expected['head']):
            raise SystemExit('GitHub PR event is missing exact base/head SHA')
        if expected != actual:
            raise SystemExit(f'caller inputs do not match trusted GitHub PR context: expected={expected!r}')
        with open(sys.argv[1],'a',encoding='utf-8') as out:
            for key,value in expected.items(): out.write(f'{key}={value}\n')
        PY
    - name: Re-read and bind exact same-repository PR facts from GitHub
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ steps.bind.outputs.repository }}
        REPOSITORY_ID: ${{ github.event.repository.id }}
        PR_ID: ${{ steps.bind.outputs.pr_id }}
        PR_NUMBER: ${{ steps.bind.outputs.pr }}
        BASE_SHA: ${{ steps.bind.outputs.base }}
        HEAD_SHA: ${{ steps.bind.outputs.head }}
        DRAFT: ${{ steps.bind.outputs.draft }}
      run: |
        set -euo pipefail
        POLICY_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        python3 "$POLICY_ROOT/tools/governance/trusted_review_attestation.py" preflight \
          --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID" --pr-id "$PR_ID" --pr-number "$PR_NUMBER" \
          --base "$BASE_SHA" --head "$HEAD_SHA" --draft "$DRAFT" --token "$GH_TOKEN"
    - name: Fetch candidate as inert bare Git objects
      shell: bash
      env:
        REPOSITORY: ${{ steps.bind.outputs.repository }}
        BASE_SHA: ${{ steps.bind.outputs.base }}
        HEAD_SHA: ${{ steps.bind.outputs.head }}
      run: |
        set -euo pipefail
        BARE_GIT_DIR="$RUNNER_TEMP/oteryn-candidate.git"
        git init --bare "$BARE_GIT_DIR"
        git -C "$BARE_GIT_DIR" -c protocol.file.allow=never fetch --no-tags --quiet \
          "https://github.com/${REPOSITORY}.git" "$BASE_SHA" "$HEAD_SHA"
        git -C "$BARE_GIT_DIR" cat-file -e "${BASE_SHA}^{commit}"
        git -C "$BARE_GIT_DIR" cat-file -e "${HEAD_SHA}^{commit}"
    - id: issue
      name: Classify, validate and issue canonical review envelope
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ steps.bind.outputs.repository }}
        REPOSITORY_ID: ${{ github.event.repository.id }}
        PR_ID: ${{ steps.bind.outputs.pr_id }}
        PR_NUMBER: ${{ steps.bind.outputs.pr }}
        BASE_SHA: ${{ steps.bind.outputs.base }}
        HEAD_SHA: ${{ steps.bind.outputs.head }}
        DRAFT: ${{ steps.bind.outputs.draft }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        WORKFLOW_EXECUTION_SHA: ${{ github.sha }}
        WORKFLOW_RUN_ID: ${{ github.run_id }}
        WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        WORKFLOW_JOB: ${{ github.job }}
        BARE_GIT_DIR: ${{ runner.temp }}/oteryn-candidate.git
        ENVELOPE_PATH: ${{ runner.temp }}/oteryn-trusted-review-envelope.json
      run: |
        set -euo pipefail
        POLICY_ROOT="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        python3 "$POLICY_ROOT/tools/governance/trusted_review_attestation.py" issue \
          --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID" --pr-id "$PR_ID" --pr-number "$PR_NUMBER" \
          --base "$BASE_SHA" --head "$HEAD_SHA" --draft "$DRAFT" --token "$GH_TOKEN" \
          --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
          --workflow-execution-sha "$WORKFLOW_EXECUTION_SHA" \
          --workflow-run-id "$WORKFLOW_RUN_ID" --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
          --workflow-job "$WORKFLOW_JOB" \
          --bare-git-dir "$BARE_GIT_DIR" --policy-file "$POLICY_ROOT/ecosystem/ai-review-policy.json" \
          --classifier-file "$POLICY_ROOT/tools/governance/ai_review_policy.py" \
          --output "$ENVELOPE_PATH" --github-output "$GITHUB_OUTPUT"
    - id: classify
      name: Publish trusted classification outputs
      shell: bash
      env:
        TIER: ${{ steps.issue.outputs.tier }}
        FINGERPRINT: ${{ steps.issue.outputs.fingerprint }}
        REVIEWER_CLASS: ${{ steps.issue.outputs.reviewer-class }}
      run: |
        set -euo pipefail
        test "$TIER" = R0 || test "$TIER" = R1 || test "$TIER" = R2
        test "${#FINGERPRINT}" = 64
        printf 'tier=%s\nfingerprint=%s\n' "$TIER" "$FINGERPRINT" >> "$GITHUB_OUTPUT"
        test "$REVIEWER_CLASS" = none || test "$REVIEWER_CLASS" = fast || test "$REVIEWER_CLASS" = deep
        printf 'reviewer_class=%s\n' "$REVIEWER_CLASS" >> "$GITHUB_OUTPUT"
    - name: Accept R0 without external AI
      if: ${{ steps.classify.outputs.tier == 'R0' }}
      shell: bash
      run: |
        echo 'R0: deterministic validation only; external AI review is intentionally not required.'
    - name: Defer external review while Draft
      if: ${{ steps.classify.outputs.tier != 'R0' && steps.bind.outputs.draft == 'true' }}
      shell: bash
      run: |
        echo 'Draft/WIP: external review is deferred until the risk-bearing diff is stable.'
    - name: Verify authenticated external review evidence
      if: ${{ steps.classify.outputs.tier != 'R0' && steps.bind.outputs.draft != 'true' }}
      shell: bash
      env:
        REVIEW_TIER: ${{ steps.classify.outputs.tier }}
        REVIEW_FINGERPRINT: ${{ steps.classify.outputs.fingerprint }}
        HEAD_SHA: ${{ steps.bind.outputs.head }}
        BASE_SHA: ${{ steps.bind.outputs.base }}
        REPOSITORY: ${{ steps.bind.outputs.repository }}
        PR_NUMBER: ${{ steps.bind.outputs.pr }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        echo 'External evidence was verified before issuance from trusted base against inert bare Git objects.'

name: Organization audit Platform GameAuth qualification (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-gameauth-qualification.yml
      - docs/evidence/organization-audit-20260907/r3-platform-gameauth-candidate.json
      - tools/audit/verify_platform_gameauth_group.py
      - tools/audit/test_verify_platform_gameauth_group.py

permissions:
  contents: read

concurrency:
  group: audit-185-platform-gameauth-qualification
  cancel-in-progress: false

jobs:
  qualify-platform-gameauth:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false

      - name: Checkout frozen Platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Platform audit publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: 3fe7df5330deb9ed38cc17ae1710f0cb4159019b
          path: platform-audit-evidence
          persist-credentials: false

      - name: Verify exact coordinates and clean worktrees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C platform rev-parse HEAD)" = de917b3477a1de0667531380de3660e8b2ab59aa
          test "$(git -C platform rev-parse HEAD^{tree})" = ffdf2a286d3a39f2344cf2ff53b28e4ef7369a8e
          test "$(git -C platform-audit-evidence rev-parse HEAD)" = 3fe7df5330deb9ed38cc17ae1710f0cb4159019b
          test "$(git -C platform-audit-evidence rev-parse HEAD^{tree})" = c6ac8cb7cbff069d7ac7303b3472d992da254774
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C platform diff --exit-code
          git -C platform-audit-evidence diff --exit-code

      - name: Run GameAuth carry-forward verifier tests
        working-directory: audit/tools/audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_verify_platform_gameauth_group.py

      - name: Revalidate exact historical direct-read and frozen source identity
        working-directory: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_platform_gameauth_group.py \
            --audit-root . \
            --platform-root ../platform \
            --evidence-root ../platform-audit-evidence \
            | tee "$RUNNER_TEMP/gameauth-revalidation.json"
          python3 - "$RUNNER_TEMP/gameauth-revalidation.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['result']=='GAMEAUTH_IDENTITY_AND_HISTORICAL_DIRECT_EVIDENCE_REVALIDATED_TESTS_STILL_REQUIRED'
          assert d['paths']==27 and d['path_blob_identity'] is True
          assert d['historical_direct_read_statement_bound'] is True
          assert d['dependent_blobs_verified']==11 and d['focused_test_files_bound']==14
          assert d['coverage_adopted'] is False
          print('GameAuth identity/history gate PASS; semantic adoption still blocked on focused tests.')
          PY

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_mysql, pcntl, gd
          tools: composer:v2

      - name: Install frozen Platform dependencies
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          : > .env
          php artisan config:clear --ansi

      - name: Run focused frozen-current GameAuth qualification tests
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gameauth-tests"
          php artisan test \
            tests/Feature/GameAuth/EnsureGameWorldCommandTest.php \
            tests/Feature/GameAuth/GameAuthRevocationTest.php \
            tests/Feature/GameAuth/GameLoginContextApiTest.php \
            tests/Feature/GameAuth/GameLoginTicketApiTest.php \
            tests/Feature/GameAuth/GameLoginTicketLifecycleTest.php \
            tests/Feature/GameAuth/GameLoginTicketRedeemApiTest.php \
            tests/Feature/GameAuth/NativeProtocolIdentityMigrationTest.php \
            tests/Feature/GameAuth/OAuth/NativeOAuthClientManagerTest.php \
            tests/Feature/GameAuth/OAuth/NativeOAuthGrantPolicyTest.php \
            tests/Feature/GameAuth/OAuth/NativeOAuthPkceTest.php \
            tests/Feature/GameAuth/OAuth/NativeOAuthRevocationGenerationTest.php \
            tests/Feature/GameAuth/OAuth/PublicClientPkcePolicyTest.php \
            tests/Feature/GameAuth/WorldRegistryTest.php \
            tests/Unit/Http/Middleware/PreventSensitiveGameAuthResponseCachingTest.php \
            --log-junit="$RUNNER_TEMP/gameauth-tests/junit.xml"
          python3 - "$RUNNER_TEMP/gameauth-tests/junit.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          cases=root.findall('.//testcase')
          failures=root.findall('.//failure')
          errors=root.findall('.//error')
          skipped=root.findall('.//skipped')
          if not cases or failures or errors or skipped:
              raise SystemExit(f'focused GameAuth qualification not all-green: cases={len(cases)} failures={len(failures)} errors={len(errors)} skipped={len(skipped)}')
          print(f'Focused GameAuth tests PASS: {len(cases)} cases, 0 failures/errors/skips.')
          PY

      - name: Final read-only cleanliness check
        shell: bash
        run: |
          set -euo pipefail
          git -C audit diff --exit-code
          git -C platform-audit-evidence diff --exit-code
          # Platform checkout is allowed ephemeral test/install outputs only; tracked source must remain unchanged.
          git -C platform diff --exit-code

name: Organization audit Platform Announcements qualification (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-announcements-qualification.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/organization-audit-20260907/collection-plan.json
      - docs/evidence/organization-audit-20260907/coverage-review.tsv
      - docs/evidence/organization-audit-20260907/coverage-review-additions.tsv
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/coverage-summary.json
      - docs/evidence/organization-audit-20260907/unknowns.json
      - docs/evidence/organization-audit-20260907/r3-platform-announcements-direct-candidate.json
      - tools/audit/organization_audit.py
      - tools/audit/verify_report.py
      - tools/audit/test_verify_report.py
      - tools/audit/verify_platform_announcements_direct.py
      - tools/audit/test_verify_platform_announcements_direct.py

permissions:
  contents: read

concurrency:
  group: audit-185-platform-announcements-primary-qualification
  cancel-in-progress: false

jobs:
  qualify-announcements:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: oteryn-announcements-root
          MARIADB_DATABASE: oteryn_announcements
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_announcements
      DB_USERNAME: root
      DB_PASSWORD: oteryn-announcements-root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout exact audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
      - name: Checkout frozen Platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform
          persist-credentials: false
      - name: Verify exact pre-adoption candidate and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C platform rev-parse HEAD)" = de917b3477a1de0667531380de3660e8b2ab59aa
          test "$(git -C platform rev-parse HEAD^{tree})" = ffdf2a286d3a39f2344cf2ff53b28e4ef7369a8e
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C platform diff --exit-code
          (cd audit/tools/audit && python3 -m unittest -v \
            test_verify_platform_announcements_direct.py \
            test_verify_report.py)
          python3 audit/tools/audit/verify_platform_announcements_direct.py \
            --audit-root audit --platform-root platform | tee "$RUNNER_TEMP/announcements-candidate-state.json"
      - name: Rebuild immutable audit inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 audit/tools/audit/organization_audit.py \
            --plan audit/docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/audit-inventory"
      - name: Prove canonical ledger remains unchanged and candidate remains UNVERIFIED
        shell: bash
        run: |
          set -euo pipefail
          python3 audit/tools/audit/verify_report.py \
            --report audit/docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/pre-adoption-ledger.csv" | tee "$RUNNER_TEMP/ledger-verifier.json"
          python3 - "$RUNNER_TEMP/pre-adoption-ledger.csv" "$RUNNER_TEMP/pre-adoption-ledger-proof.json" <<'PY'
          import csv,hashlib,json,sys
          from collections import Counter
          raw=open(sys.argv[1],'rb').read(); rows=list(csv.DictReader(raw.decode('utf-8').splitlines())); counts=Counter(r['disposition'] for r in rows); digest=hashlib.sha256(raw).hexdigest()
          expected={'DIRECT':223,'GROUPED':113,'UNVERIFIED':3989}
          if len(rows)!=4325 or dict(counts)!=expected: raise SystemExit(f'canonical pre-adoption count drift: rows={len(rows)} counts={dict(counts)}')
          if digest!='2d823435f76f0c08b118ccb5dc1c9ccf9ef4acc41bffdd447b260e82ea404b0f': raise SystemExit('canonical pre-adoption digest drift: '+digest)
          candidate={
            'app/Announcements/Actions/SaveAnnouncement.php',
            'app/Announcements/Factories/SiteAnnouncementFactory.php',
            'app/Announcements/Http/AdminAnnouncementController.php',
            'app/Announcements/Http/AnnouncementRequest.php',
            'app/Announcements/Links/AnnouncementActionLink.php',
            'app/Announcements/Models/SiteAnnouncement.php',
            'app/Announcements/Queries/ActiveAnnouncementQuery.php',
            'app/Announcements/Queries/AnnouncementTickerProvider.php',
            'app/Announcements/ViewModels/AnnouncementTicker.php',
            'app/Announcements/ViewModels/AnnouncementTickerState.php',
          }
          states={r['path']:r['disposition'] for r in rows if r['repository_id']=='platform' and r['path'] in candidate}
          if set(states)!=candidate or any(value!='UNVERIFIED' for value in states.values()): raise SystemExit('Announcements candidate was unexpectedly promoted: '+json.dumps(states,sort_keys=True))
          proof={'audit_head':'${{ github.event.pull_request.head.sha }}','source_rows':4325,'direct_paths':223,'grouped_paths':113,'unverified_paths':3989,'semantically_classified_paths':336,'ledger_sha256':digest,'announcements_candidate_paths':10,'announcements_disposition':'UNVERIFIED','coverage_adopted':False}
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,sort_keys=True))
          PY
      - name: Setup PHP 8.5.10
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, pcntl, gd
          tools: composer:v2
      - name: Install frozen Platform dependencies
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          : > .env
          php artisan config:clear --ansi
      - name: Execute exact Announcements module test on MariaDB
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test \
            tests/Feature/Announcements/AnnouncementsModuleTest.php \
            --log-junit="$RUNNER_TEMP/announcements-junit.xml"
      - name: Enforce primary case/result contract and bind observed assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/announcements-junit.xml" "$RUNNER_TEMP/announcements-test-summary.json" <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          cases=ET.parse(sys.argv[1]).getroot().findall('.//testcase'); identities=set(); result={'test_files':1,'cases':len(cases),'assertions':0,'failures':0,'errors':0,'skipped':0}
          for case in cases:
              ident=(case.attrib.get('classname'),case.attrib.get('name'))
              if not all(ident) or ident in identities: raise SystemExit(f'duplicate/missing JUnit identity: {ident}')
              identities.add(ident); result['assertions']+=int(case.attrib.get('assertions','0')); result['failures']+=len(case.findall('failure')); result['errors']+=len(case.findall('error')); result['skipped']+=len(case.findall('skipped'))
          expected_non_assertion={'test_files':1,'cases':4,'failures':0,'errors':0,'skipped':0}
          observed={key:result[key] for key in expected_non_assertion}
          if observed!=expected_non_assertion: raise SystemExit('primary Announcements result drift: '+json.dumps(result,sort_keys=True))
          if result['assertions'] < 1: raise SystemExit('primary Announcements run reported no assertions')
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps(result,indent=2,sort_keys=True)+'\n'); print('OBSERVED_PRIMARY='+json.dumps(result,sort_keys=True))
          PY
      - name: Upload bounded pre-adoption qualification proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit185-platform-announcements-primary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/announcements-candidate-state.json
            ${{ runner.temp }}/ledger-verifier.json
            ${{ runner.temp }}/pre-adoption-ledger-proof.json
            ${{ runner.temp }}/pre-adoption-ledger.csv
            ${{ runner.temp }}/announcements-test-summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git -C audit diff --exit-code
          git -C platform diff --exit-code

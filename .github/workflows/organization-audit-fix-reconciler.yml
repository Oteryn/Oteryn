name: Organization audit fix reconciler (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-fix-reconciler.yml
      - .github/workflows/organization-audit-reconcile-atlas-review3.yml
permissions:
  contents: write
concurrency:
  group: audit-185-fix-reconciler
  cancel-in-progress: false
jobs:
  fix-once:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Correct only the generated-test indentation
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -Fq 'ci(audit): fix reconciler generated-test indentation (#186)'; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/organization-audit-reconcile-atlas-review3.yml')
          t=p.read_text(encoding='utf-8')
          old="""          replacement=\"\"\"    def test_rejected_group_is_not_promoted_by_summary(self):
              self.mutate(self.base/'coverage-summary.json',lambda d:d['per_repository']['atlas'].update(grouped=508,unverified_semantics=637))
              self.reject()
              
              def test_rejected_candidate_is_preserved_but_not_counted(self):
                  data=audit.read_json(self.base/'coverage-groups.json')
                  self.assertEqual(data['groups'],[])
                  self.assertEqual(len(data['rejected_candidates']),1)
                  self.assertEqual(data['rejected_candidates'][0]['evaluation']['outcome'],'REJECTED_NOT_COUNTED_AS_GROUPED')
              
          \"\"\"
          """
          new="""          replacement=\"\"\"    def test_rejected_group_is_not_promoted_by_summary(self):
                  self.mutate(self.base/'coverage-summary.json',lambda d:d['per_repository']['atlas'].update(grouped=508,unverified_semantics=637))
                  self.reject()

              def test_rejected_candidate_is_preserved_but_not_counted(self):
                  data=audit.read_json(self.base/'coverage-groups.json')
                  self.assertEqual(data['groups'],[])
                  self.assertEqual(len(data['rejected_candidates']),1)
                  self.assertEqual(data['rejected_candidates'][0]['evaluation']['outcome'],'REJECTED_NOT_COUNTED_AS_GROUPED')

          \"\"\"
          """
          if t.count(old)!=1:
              raise SystemExit('reconciler indentation target not found exactly once')
          p.write_text(t.replace(old,new),encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/organization-audit-reconcile-atlas-review3.yml
          git commit -m 'ci(audit): fix reconciler generated-test indentation (#186)'
          git push origin HEAD:refs/heads/docs/20260907-org-comprehensive-audit

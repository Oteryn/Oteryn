name: Organization audit native evidence (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-qualification.yml
      - tools/audit/collect_ci_cohort.py
      - tools/audit/test_collect_ci_cohort.py
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-185-native-evidence
  cancel-in-progress: false
jobs:
  ci-metadata:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate read-only collection boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/audit -p test_collect_ci_cohort.py -v
      - name: Collect bounded canonical workflow timing metadata
        env:
          OTERYN_AUDIT185_CI_COHORT: '1'
          GH_TOKEN: ${{ github.token }}
          AUDIT_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDIT_HEAD"
          git diff --exit-code
          python3 tools/audit/collect_ci_cohort.py --output "$RUNNER_TEMP/audit-185-ci/cohort.json"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-185-ci-metadata-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/audit-185-ci
          if-no-files-found: error
          retention-days: 7

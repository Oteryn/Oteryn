name: Organization audit native evidence (temporary)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/organization-audit-qualification.yml]
permissions:
  contents: read
concurrency:
  group: audit-185-native-evidence
  cancel-in-progress: false
jobs:
  recovery:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1204831962d9f6ff88ca8984028f6721f63889eb
          fetch-depth: 0
          persist-credentials: false
      - name: Recover two exact audit trees without executing their code
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONOPTIMIZE: '0'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1204831962d9f6ff88ca8984028f6721f63889eb
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path, PurePosixPath
          TREES = {'published': '2e6c566c5b93cfbb4d951e514ee5035492af3014', 'prepared': '88727513aafd457fd8909e3498e1e7251b26eaca'}
          PREFIX = 'https://api.github.com/repos/Oteryn/Oteryn/git/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('redirect denied')
          def safe_entry(entry):
              path = PurePosixPath(entry['path'])
              assert str(path) == entry['path'] and not path.is_absolute() and '..' not in path.parts
              assert entry['type'] == 'blob' and entry['mode'] in ('100644', '100755')
              assert re.fullmatch('[0-9a-f]{40}', entry['sha'])
              assert 0 <= entry['size'] <= 2000000
          out = Path(os.environ['RUNNER_TEMP']) / 'audit185-recovery'
          out.mkdir(exist_ok=False)
          (out/'objects').mkdir()
          opener = urllib.request.build_opener(NoRedirect)
          calls = 0
          def get(kind, sha):
              global calls
              assert kind in ('trees', 'blobs') and re.fullmatch('[0-9a-f]{40}', sha)
              calls += 1
              assert calls <= 100
              url = PREFIX + kind + '/' + sha + ('?recursive=1' if kind == 'trees' else '')
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with opener.open(request, timeout=25) as response:
                  raw = response.read(4000001)
              assert len(raw) <= 4000000
              return json.loads(raw)
          seen = set()
          total = 0
          for name, sha in TREES.items():
              tree = get('trees', sha)
              assert tree['sha'] == sha and tree['truncated'] is False
              leaves = [e for e in tree['tree'] if e['type'] != 'tree']
              assert len(leaves) <= 250
              for entry in leaves:
                  safe_entry(entry)
                  oid = entry['sha']
                  if oid in seen: continue
                  proc = subprocess.run(['git','cat-file','blob',oid], capture_output=True, check=False)
                  if proc.returncode == 0:
                      data = proc.stdout
                  else:
                      obj = get('blobs', oid)
                      assert obj['sha'] == oid and obj['encoding'] == 'base64'
                      data = base64.b64decode(''.join(obj['content'].split()), validate=True)
                  assert len(data) == entry['size']
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == oid
                  total += len(data)
                  assert total <= 20000000
                  (out/'objects'/oid).write_bytes(data)
                  seen.add(oid)
              (out/(name+'.json')).write_text(json.dumps(tree, sort_keys=True)+'\n')
          (out/'summary.json').write_text(json.dumps({'trees':TREES,'unique_blobs':len(seen),'bytes':total,'api_calls':calls})+'\n')
          print('Recovered immutable audit objects:',len(seen),'blobs;',calls,'read-only API calls')
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-185-r3-recovery-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/audit185-recovery
          if-no-files-found: error
          retention-days: 7

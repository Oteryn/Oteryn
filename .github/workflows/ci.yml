name: META CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta-gate:
    name: meta-gate
    runs-on: ubuntu-latest
    steps:
      - name: Validate merge-group candidate identity
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref || '' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$MERGE_GROUP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$MERGE_GROUP_HEAD_SHA" ]]
          [[ "$MERGE_GROUP_BASE_REF" == "refs/heads/main" ]]

      - name: Verify live Merge Queue configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: main
          CANDIDATE_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          observed_at="$(date +%s)"
          queue_file="${RUNNER_TEMP}/merge-queue.json"
          owner="${TARGET_REPOSITORY%%/*}"
          name="${TARGET_REPOSITORY#*/}"
          python3 - "${owner}" "${name}" > "${RUNNER_TEMP}/merge-queue-query.json" <<'PY'
          import json
          import sys

          owner, name = sys.argv[1:]
          query = """
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              mergeQueue {
                id
                resourcePath
                url
                configuration {
                  mergeMethod
                  maximumEntriesToBuild
                  maximumEntriesToMerge
                  minimumEntriesToMerge
                }
              }
            }
          }
          """
          print(json.dumps({"query": query, "variables": {"owner": owner, "name": name}}))
          PY
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@${RUNNER_TEMP}/merge-queue-query.json" \
            "https://api.github.com/graphql" \
            > "${queue_file}"
          python3 - "${queue_file}" "${TARGET_REPOSITORY}" "${TARGET_BRANCH}" "${CANDIDATE_SHA}" "${observed_at}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" <<'PY'
          import json
          import re
          import sys

          path, repository, branch, candidate_sha, observed_at, run_id, run_attempt = sys.argv[1:]
          if repository != "Oteryn/Oteryn" or branch != "main":
              raise SystemExit("live merge-queue observation targeted an unexpected repository or branch")
          if re.fullmatch(r"[0-9a-f]{40}", candidate_sha) is None:
              raise SystemExit("candidate SHA is invalid")
          payload = json.loads(open(path, encoding="utf-8").read())
          errors = payload.get("errors") if isinstance(payload, dict) else None
          if errors:
              raise SystemExit(f"GraphQL merge-queue query failed: {errors}")
          repository_data = payload.get("data", {}).get("repository") if isinstance(payload, dict) else None
          queue = repository_data.get("mergeQueue") if isinstance(repository_data, dict) else None
          if not isinstance(queue, dict):
              raise SystemExit("repository does not currently expose a Merge Queue")
          queue_id = queue.get("id")
          resource_path = queue.get("resourcePath")
          url = queue.get("url")
          configuration = queue.get("configuration")
          if not isinstance(queue_id, str) or not queue_id.startswith("MQ_"):
              raise SystemExit("Merge Queue id is missing or invalid")
          if not isinstance(resource_path, str) or not resource_path:
              raise SystemExit("Merge Queue resourcePath is missing")
          if not isinstance(url, str) or not url:
              raise SystemExit("Merge Queue URL is missing")
          if not isinstance(configuration, dict) or not isinstance(configuration.get("mergeMethod"), str):
              raise SystemExit("Merge Queue configuration is missing")
          observation = {
              "repository": repository,
              "base_ref": branch,
              "candidate_sha": candidate_sha,
              "merge_queue_required": True,
              "observed_at_epoch_seconds": int(observed_at),
              "source": "graphql_queue_config",
              "workflow_run_id": int(run_id),
              "workflow_run_attempt": int(run_attempt),
              "queue_id": queue_id,
              "resource_path": resource_path,
              "url": url,
              "configuration": configuration,
          }
          print("LIVE_MQ_QUEUE_OBSERVATION=" + json.dumps(observation, sort_keys=True, separators=(",", ":")))
          PY

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check candidate whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff-tree --check --root "$HEAD_SHA"
          fi

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/governance/requirements-validation.txt

      - name: Validate release manifest schema
        run: python3 tools/governance/validate_release_manifests.py

      - name: Validate META repository contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('README.md'),
              Path('AGENTS.md'),
              Path('CONTRIBUTING.md'),
              Path('SECURITY.md'),
              Path('.github/CODEOWNERS'),
              Path('.github/dependabot.yml'),
              Path('docs/architecture/adr/0001-ecosystem-topology-authority.md'),
              Path('docs/architecture/adr/0005-solo-maintainer-governance-v2-simplification-reset.md'),
              Path('docs/ci/CI_CONTRACT.md'),
              Path('docs/testing/ECOSYSTEM_TEST_STRATEGY.md'),
              Path('docs/release/RELEASE_COORDINATION.md'),
              Path('docs/governance/AI_REVIEW_POLICY.md'),
              Path('docs/agents/contracts/BOUNDED_AUTONOMOUS_EXECUTION_POLICY.md'),
              Path('docs/agents/contracts/PERSISTENT_AUTONOMOUS_CONTINUATION_POLICY.md'),
              Path('docs/agents/policy/ORGANIZATION_AGENT_POLICY.md'),
              Path('docs/agents/policy/PROMPTING_STANDARD.md'),
              Path('docs/agents/policy/PROMPT_EVAL_STANDARD.md'),
              Path('ecosystem/repositories.json'),
              Path('ecosystem/governance-desired-state.json'),
              Path('ecosystem/compatibility.schema.json'),
              Path('tools/governance/validate_release_manifests.py'),
              Path('tools/governance/requirements-validation.txt'),
              Path('ecosystem/agent-execution-routing-policy.json'),
              Path('ecosystem/bounded-autonomous-execution-policy.json'),
              Path('ecosystem/agent-continuation-policy.json'),
              Path('ecosystem/organization-agent-policy.json'),
              Path('tools/governance/agent_execution_routing.py'),
              Path('tools/governance/bounded_execution_guard.py'),
              Path('tools/governance/agent_continuation_policy.py'),
              Path('tools/governance/central_agent_policy.py'),
              Path('tools/governance/merge_queue_submission_routing.py'),
              Path('tools/governance/test_agent_execution_routing.py'),
              Path('tools/governance/test_bounded_execution_guard.py'),
              Path('tools/governance/test_agent_continuation_policy.py'),
              Path('tools/governance/test_agent_continuation_review_repairs.py'),
              Path('tools/governance/test_central_agent_policy.py'),
              Path('tools/governance/test_remote_desktop_action_gate.py'),
              Path('tools/governance/test_merge_queue_workflow_contract.py'),
              Path('tools/governance/test_merge_queue_submission_routing.py'),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f'missing or empty required META files: {missing}')

          json_files = sorted(Path('.').rglob('*.json'))
          for path in json_files:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)

          manifest = json.loads(Path('ecosystem/repositories.json').read_text(encoding='utf-8'))
          if manifest.get('schema_version') != 1:
              raise SystemExit('ecosystem/repositories.json schema_version must be 1')
          authority = manifest.get('authority', {})
          if authority.get('repository') != 'Oteryn/Oteryn':
              raise SystemExit('META authority repository must be Oteryn/Oteryn')

          repositories = manifest.get('repositories')
          if not isinstance(repositories, list):
              raise SystemExit('repositories must be an array')
          coordinates = [entry.get('target_coordinate') for entry in repositories]
          expected = {
              'Oteryn/Oteryn',
              'Oteryn/Oteryn-Game',
              'Oteryn/Oteryn-Platform',
              'Oteryn/Oteryn-Atlas',
          }
          if set(coordinates) != expected or len(coordinates) != len(expected):
              raise SystemExit(f'unexpected or duplicate target repository set: {coordinates}')
          for entry in repositories:
              for key in ('product', 'target_coordinate', 'current_coordinate', 'migration_state', 'authority_owner'):
                  if not isinstance(entry.get(key), str) or not entry[key].strip():
                      raise SystemExit(f'missing {key!r} in repository entry: {entry}')

          forbidden_names = {'.env'}
          forbidden_suffixes = {'.otbm', '.otb', '.spr', '.dat', '.sql', '.sqlite', '.db'}
          violations = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.name in forbidden_names or path.suffix.lower() in forbidden_suffixes:
                  violations.append(str(path))
          if violations:
              raise SystemExit(f'raw runtime, database or sensitive files are forbidden in META: {violations}')

          print(f'Validated {len(json_files)} JSON files and {len(repositories)} repository entries.')
          PY

      - name: Validate simplified governance desired state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          from tools.governance.governance_drift_audit import validate_desired_state

          state = json.loads(Path('ecosystem/governance-desired-state.json').read_text(encoding='utf-8'))
          validate_desired_state(state)
          if state.get('authority') != 'docs/architecture/adr/0005-solo-maintainer-governance-v2-simplification-reset.md':
              raise SystemExit('governance desired-state authority must be ADR 0005')

          expected = {
              'Oteryn/Oteryn': ('META', 'meta-gate', 'COMPLETE'),
              'Oteryn/Oteryn-Game': ('GAME', 'game-gate', 'COMPLETE'),
              'Oteryn/Oteryn-Platform': ('PLATFORM', 'platform-gate', 'COMPLETE'),
              'Oteryn/Oteryn-Atlas': ('ATLAS', 'atlas-gate', 'PENDING'),
          }
          rows = state.get('permanent_repositories')
          if not isinstance(rows, list) or len(rows) != len(expected):
              raise SystemExit('governance desired-state must contain exactly four repositories')
          by_repo = {row.get('repository'): row for row in rows if isinstance(row, dict)}
          if set(by_repo) != set(expected) or len(by_repo) != len(rows):
              raise SystemExit('governance desired-state repository set is invalid or duplicated')

          for repository, (role, gate, rollout) in expected.items():
              row = by_repo[repository]
              if (row.get('role'), row.get('required_gate'), row.get('rollout_state')) != (role, gate, rollout):
                  raise SystemExit(f'{repository}: role/gate/rollout mismatch')
              required_values = {
                  'merge_queue': True,
                  'allow_auto_merge': True,
                  'strict_required_status_checks': False,
                  'required_approvals': 0,
                  'codeowner_review_required': False,
                  'conversation_resolution': True,
                  'linear_history': True,
                  'force_pushes': False,
                  'deletions': False,
                  'broad_bypass': False,
              }
              for key, value in required_values.items():
                  if row.get(key) != value:
                      raise SystemExit(f'{repository}: {key} target must be {value!r}')
          print('Simplified governance desired-state PASS')
          PY

      - name: Validate agent execution routing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/governance/test_agent_execution_routing.py
          python3 tools/governance/test_remote_desktop_action_gate.py
          python3 tools/governance/test_merge_queue_workflow_contract.py
          python3 tools/governance/test_merge_queue_submission_routing.py
          python3 tools/governance/test_bounded_execution_guard.py
          python3 tools/governance/test_agent_continuation_policy.py
          python3 tools/governance/test_agent_continuation_review_repairs.py
          python3 tools/governance/test_central_agent_policy.py
          python3 tools/governance/central_agent_policy.py

name: META CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta-gate:
    name: meta-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check candidate whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff-tree --check --root "$HEAD_SHA"
          fi

      - name: Validate META repository contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          required = [
              Path('README.md'),
              Path('AGENTS.md'),
              Path('CONTRIBUTING.md'),
              Path('SECURITY.md'),
              Path('.github/CODEOWNERS'),
              Path('.github/dependabot.yml'),
              Path('docs/architecture/adr/0001-ecosystem-topology-authority.md'),
              Path('docs/ci/CI_CONTRACT.md'),
              Path('docs/testing/ECOSYSTEM_TEST_STRATEGY.md'),
              Path('docs/release/RELEASE_COORDINATION.md'),
              Path('ecosystem/repositories.json'),
              Path('ecosystem/governance-desired-state.json'),
              Path('ecosystem/compatibility.schema.json'),
              Path('ecosystem/agent-execution-routing-policy.json'),
              Path('tools/governance/audit_github_readonly.py'),
              Path('tools/governance/audit_github_readonly_core.py'),
              Path('tools/governance/test_audit_github_readonly.py'),
              Path('tools/governance/test_audit_github_readonly_terminal.py'),
              Path('tools/governance/agent_execution_routing.py'),
              Path('tools/governance/test_agent_execution_routing.py'),
              Path('tools/governance/test_remote_desktop_action_gate.py'),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f'missing or empty required META files: {missing}')

          json_files = sorted(Path('.').rglob('*.json'))
          for path in json_files:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)

          manifest = json.loads(Path('ecosystem/repositories.json').read_text(encoding='utf-8'))
          if manifest.get('schema_version') != 1:
              raise SystemExit('ecosystem/repositories.json schema_version must be 1')
          authority = manifest.get('authority', {})
          if authority.get('repository') != 'Oteryn/Oteryn':
              raise SystemExit('META authority repository must be Oteryn/Oteryn')

          repositories = manifest.get('repositories')
          if not isinstance(repositories, list):
              raise SystemExit('repositories must be an array')
          coordinates = [entry.get('target_coordinate') for entry in repositories]
          expected = {
              'Oteryn/Oteryn',
              'Oteryn/Oteryn-Game',
              'Oteryn/Oteryn-Platform',
              'Oteryn/Oteryn-Atlas',
          }
          if set(coordinates) != expected or len(coordinates) != len(expected):
              raise SystemExit(f'unexpected or duplicate target repository set: {coordinates}')
          for entry in repositories:
              for key in ('product', 'target_coordinate', 'current_coordinate', 'migration_state', 'authority_owner'):
                  if not isinstance(entry.get(key), str) or not entry[key].strip():
                      raise SystemExit(f'missing {key!r} in repository entry: {entry}')

          schema = json.loads(Path('ecosystem/compatibility.schema.json').read_text(encoding='utf-8'))
          if schema.get('$schema') != 'https://json-schema.org/draft/2020-12/schema':
              raise SystemExit('compatibility schema must use JSON Schema draft 2020-12')
          if schema.get('type') != 'object':
              raise SystemExit('compatibility schema root must be an object')

          forbidden_names = {'.env'}
          forbidden_suffixes = {'.otbm', '.otb', '.spr', '.dat', '.sql', '.sqlite', '.db'}
          violations = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.name in forbidden_names or path.suffix.lower() in forbidden_suffixes:
                  violations.append(str(path))
          if violations:
              raise SystemExit(f'raw runtime, database or sensitive files are forbidden in META: {violations}')

          component_repositories = {
              'game': 'Oteryn/Oteryn-Game',
              'platform': 'Oteryn/Oteryn-Platform',
              'atlas': 'Oteryn/Oteryn-Atlas',
          }
          sha_re = re.compile(r'^[0-9a-f]{40}$')
          digest_re = re.compile(r'^sha256:[0-9a-f]{64}$')
          allowed_parties = set(component_repositories)

          release_dir = Path('ecosystem/releases')
          release_files = sorted(release_dir.glob('*.json')) if release_dir.is_dir() else []
          for path in release_files:
              release = json.loads(path.read_text(encoding='utf-8'))
              if release.get('schema_version') != 1:
                  raise SystemExit(f'{path}: schema_version must be 1')
              release_id = release.get('release_id')
              if not isinstance(release_id, str) or not release_id.strip() or path.stem != release_id:
                  raise SystemExit(f'{path}: release_id must be non-empty and equal the filename stem')
              components = release.get('components')
              if not isinstance(components, dict) or set(components) != allowed_parties:
                  raise SystemExit(f'{path}: components must be exactly game/platform/atlas')
              for name, expected_repository in component_repositories.items():
                  component = components.get(name)
                  if not isinstance(component, dict):
                      raise SystemExit(f'{path}: component {name} must be an object')
                  if component.get('repository') != expected_repository:
                      raise SystemExit(f'{path}: component {name} must use {expected_repository}')
                  if not isinstance(component.get('commit_sha'), str) or not sha_re.fullmatch(component['commit_sha']):
                      raise SystemExit(f'{path}: component {name} commit_sha must be a lowercase 40-hex SHA')
                  for digest in component.get('artifact_digests', []):
                      if not isinstance(digest, str) or not digest_re.fullmatch(digest):
                          raise SystemExit(f'{path}: invalid artifact digest for {name}: {digest!r}')
              contracts = release.get('contracts')
              if not isinstance(contracts, list):
                  raise SystemExit(f'{path}: contracts must be an array')
              for contract in contracts:
                  if not isinstance(contract, dict):
                      raise SystemExit(f'{path}: contract entry must be an object')
                  for key in ('name', 'version'):
                      if not isinstance(contract.get(key), str) or not contract[key].strip():
                          raise SystemExit(f'{path}: contract {key} must be non-empty')
                  if contract.get('provider') not in allowed_parties or contract.get('consumer') not in allowed_parties:
                      raise SystemExit(f'{path}: contract provider/consumer must be game/platform/atlas')
                  if contract.get('status') != 'compatible':
                      raise SystemExit(f'{path}: merged release contracts must have status compatible')

          print(
              f'Validated {len(json_files)} JSON files, '
              f'{len(repositories)} repository entries and {len(release_files)} release manifests.'
          )
          PY

      - name: Validate governance desired state offline
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/governance/audit_github_readonly.py --offline
          python3 tools/governance/test_audit_github_readonly.py
          python3 tools/governance/test_audit_github_readonly_terminal.py

      - name: Validate agent execution routing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/governance/test_agent_execution_routing.py
          python3 tools/governance/test_remote_desktop_action_gate.py

      - name: Validate AI review risk policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/governance/test_ai_review_policy.py
          python3 tools/governance/test_ai_review_git_metadata.py
          python3 tools/governance/test_verify_ai_review_evidence.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('ecosystem/ai-review-policy.json').read_text(encoding='utf-8'))
          if policy.get('schema_version') != 1:
              raise SystemExit('AI review policy schema_version must be 1')
          if set(policy.get('review_tiers', {})) != {'R0', 'R1', 'R2'}:
              raise SystemExit('AI review tiers must be exactly R0/R1/R2')
          if policy['review_tiers']['R0']['external_review'] != 'none':
              raise SystemExit('R0 must not consume external AI review')
          if policy['review_tiers']['R2']['reviewer_class'] != 'deep':
              raise SystemExit('R2 must require the deep reviewer class')
          print('AI review policy contract PASS')
          PY

      - name: Emit exact pull-request AI review classification
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 tools/governance/ai_review_policy.py \
            --repo-root . \
            --policy-file ecosystem/ai-review-policy.json \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Verify META boundary markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'thin ecosystem' AGENTS.md
          grep -q 'META / coordination plane' README.md
          grep -q 'meta-gate' docs/ci/CI_CONTRACT.md
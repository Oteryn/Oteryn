name: Organization audit Platform Announcements projection (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-announcements-projection.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/organization-audit-20260907/collection-plan.json
      - docs/evidence/organization-audit-20260907/coverage-review.tsv
      - docs/evidence/organization-audit-20260907/coverage-review-additions.tsv
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/r3-platform-announcements-direct-candidate.json
      - tools/audit/organization_audit.py
      - tools/audit/verify_report.py
      - tools/audit/verify_platform_announcements_direct.py
      - tools/audit/test_verify_platform_announcements_direct.py
      - tools/audit/project_platform_announcements_direct.py
      - tools/audit/test_project_platform_announcements_direct.py

permissions:
  contents: read

concurrency:
  group: audit-185-platform-announcements-projection
  cancel-in-progress: false

jobs:
  project-announcements:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit projection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
      - name: Checkout frozen Platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform
          persist-credentials: false
      - name: Verify candidate, frozen source and projection transform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C platform rev-parse HEAD)" = de917b3477a1de0667531380de3660e8b2ab59aa
          test "$(git -C platform rev-parse HEAD^{tree})" = ffdf2a286d3a39f2344cf2ff53b28e4ef7369a8e
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C platform diff --exit-code
          (cd audit/tools/audit && python3 -m unittest -v \
            test_verify_platform_announcements_direct.py \
            test_project_platform_announcements_direct.py \
            test_verify_report.py)
          python3 audit/tools/audit/verify_platform_announcements_direct.py \
            --audit-root audit --platform-root platform | tee "$RUNNER_TEMP/candidate-state.json"
      - name: Rebuild canonical inventory and ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 audit/tools/audit/organization_audit.py \
            --plan audit/docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/audit-inventory"
          python3 audit/tools/audit/verify_report.py \
            --report audit/docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/canonical-ledger.csv" | tee "$RUNNER_TEMP/canonical-ledger-verifier.json"
      - name: Project exactly ten Announcements paths without adoption
        shell: bash
        run: |
          set -euo pipefail
          python3 audit/tools/audit/project_platform_announcements_direct.py \
            --audit-root audit \
            --platform-root platform \
            --canonical-ledger "$RUNNER_TEMP/canonical-ledger.csv" \
            --projected-ledger-output "$RUNNER_TEMP/projected-ledger.csv" \
            --overlay-output "$RUNNER_TEMP/announcements-direct-overlay.tsv" | tee "$RUNNER_TEMP/projection-result.json"
          python3 - "$RUNNER_TEMP/projection-result.json" <<'PY'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding='utf-8'))
          expected={'projected_rows':4325,'projected_direct_paths':233,'projected_grouped_paths':113,'projected_unverified_paths':3979,'projected_semantically_classified_paths':346,'changed_path_count':10,'coverage_adopted':False}
          for key,value in expected.items():
              if doc.get(key)!=value: raise SystemExit(f'projection result drift: {key}={doc.get(key)!r}, expected {value!r}')
          if doc.get('result')!='ANNOUNCEMENTS_DIRECT_PROJECTION_VALID_NOT_ADOPTED': raise SystemExit('projection result status drift')
          if doc.get('canonical_ledger_sha256')!='2d823435f76f0c08b118ccb5dc1c9ccf9ef4acc41bffdd447b260e82ea404b0f': raise SystemExit('canonical digest drift')
          if doc.get('product_readiness_claimed') is not False or doc.get('audit_completion_claimed') is not False: raise SystemExit('forbidden readiness/completion claim')
          print('PROJECTED_LEDGER_SHA256='+doc['projected_ledger_sha256'])
          print('GENERATED_OVERLAY_SHA256='+doc['generated_overlay_sha256'])
          PY
      - name: Upload projection-only proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit185-platform-announcements-projection-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate-state.json
            ${{ runner.temp }}/canonical-ledger-verifier.json
            ${{ runner.temp }}/canonical-ledger.csv
            ${{ runner.temp }}/projection-result.json
            ${{ runner.temp }}/projected-ledger.csv
            ${{ runner.temp }}/announcements-direct-overlay.tsv
          if-no-files-found: error
          retention-days: 1
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git -C audit diff --exit-code
          git -C platform diff --exit-code

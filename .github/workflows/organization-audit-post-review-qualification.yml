name: Organization audit post-review qualification (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-post-review-qualification.yml
      - tools/audit/**
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md
      - docs/evidence/organization-audit-20260907/**
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-185-post-review-qualification
  cancel-in-progress: false
jobs:
  exact-head-audit:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify candidate identity and static cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          git diff --exit-code
          python3 --version
          node --version
      - name: Run audit unit and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          node --test \
            tools/audit/test-public-surface-contract.mjs \
            tools/audit/test-public-surface-evidence-hardening.mjs
          python3 tools/audit/verify_report.py \
            --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - name: Download exact public native archives read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit185-archives"
          while IFS=' ' read -r id file; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/audit185-archives/$file"
            test -s "$RUNNER_TEMP/audit185-archives/$file"
          done <<'EOF'
          10035282589 audit185-r3-platform-php.zip
          10035263247 audit185-r3-platform-gateway.zip
          10035749457 audit185-r3-concurrency.zip
          10035760115 audit185-r3-public-ui.zip
          10043048175 audit185-r3-public-ui-corrected.zip
          10043441892 audit185-r3-ci-metadata.zip
          EOF
      - name: Recount all six public R3 archives against committed evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_r3_evidence.py \
            --manifest docs/evidence/organization-audit-20260907/r3-native-manifest.json \
            --archive-dir "$RUNNER_TEMP/audit185-archives" \
            > "$RUNNER_TEMP/r3-recount.json"
          python3 - "$RUNNER_TEMP/r3-recount.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data['schema_version']==1
          assert data['source_sha']=='de917b3477a1de0667531380de3660e8b2ab59aa'
          assert data['ui_cases']==48 and data['ui_expected_404_cases']==8
          assert data['ci']['runs']==84 and data['ci']['jobs']==418
          print('Exact-head six-archive recount matches committed R3 result map.')
          PY
          git diff --exit-code

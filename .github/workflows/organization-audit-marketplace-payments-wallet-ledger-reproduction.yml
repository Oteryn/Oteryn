name: Organization audit Marketplace-Payments-Wallet adopted ledger reproduction (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-marketplace-payments-wallet-ledger-reproduction.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/coverage-review.tsv
      - docs/evidence/organization-audit-20260907/coverage-summary.json
      - docs/evidence/organization-audit-20260907/r3-platform-marketplace-payments-wallet-candidate.json
      - docs/evidence/organization-audit-20260907/verification-index.json
      - tools/audit/organization_audit.py
      - tools/audit/verify_report.py
      - tools/audit/verify_platform_marketplace_payments_wallet_group.py

permissions:
  contents: read

concurrency:
  group: audit-185-marketplace-payments-wallet-adopted-ledger-reproduction
  cancel-in-progress: false

jobs:
  reproduce-adopted-ledger:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact adopted audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact adopted candidate and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          git diff --exit-code
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/audit')
          import verify_platform_marketplace_payments_wallet_group as v
          c=v.read_json(v.CANDIDATE)
          assert v.validate_candidate_shape(c) is True
          v.validate_group_state(c,v.read_json(v.GROUPS),True)
          v.validate_verification_index(v.read_json(v.INDEX))
          q=c['qualification']
          assert q['qualification_head']=='13f6933c543db98848450e063e61f8c0dd2fa3d3'
          assert q['workflow_run']==34283717767 and q['job']==102254287765
          assert q['focused_current_tests']['cases']==45 and q['focused_current_tests']['assertions']==444
          print('ADOPTED_EXACT_PRIMARY_AND_INDEX_PROOF_PASS')
          PY
      - name: Rebuild immutable source inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/organization_audit.py \
            --plan docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/audit-inventory"
      - name: Reproduce exact adopted 4,325-row ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_report.py \
            --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/adopted-ledger.csv"
          python3 - "$RUNNER_TEMP/adopted-ledger.csv" "$RUNNER_TEMP/adopted-proof.json" <<'PY'
          import csv,hashlib,json,sys
          from collections import Counter
          raw=open(sys.argv[1],'rb').read()
          rows=list(csv.DictReader(raw.decode().splitlines()))
          counts=Counter(r['disposition'] for r in rows)
          digest=hashlib.sha256(raw).hexdigest()
          expected={'DIRECT':221,'GROUPED':107,'UNVERIFIED':3997}
          if len(rows)!=4325 or dict(counts)!=expected:
              raise SystemExit(f'adopted ledger count drift: rows={len(rows)} counts={dict(counts)}')
          if digest!='742443fbcc7fba9a45e1c71bf4395e3b2fe4ced7ae527a38de6ef2c74cb49406':
              raise SystemExit('adopted ledger digest drift: '+digest)
          proof={
              'schema_version':1,
              'audit_head':'${{ github.event.pull_request.head.sha }}',
              'source_rows':4325,'direct_paths':221,'grouped_paths':107,'unverified_paths':3997,
              'ledger_sha256':digest,
              'candidate_primary':{'head':'13f6933c543db98848450e063e61f8c0dd2fa3d3','run':34283717767,'job':102254287765,'cases':45,'assertions':444},
          }
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
      - name: Upload bounded adopted ledger proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit185-mpw-adopted-ledger-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/adopted-proof.json
            ${{ runner.temp }}/adopted-ledger.csv
          if-no-files-found: error
          retention-days: 1
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code

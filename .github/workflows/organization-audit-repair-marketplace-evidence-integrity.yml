name: Organization audit repair Marketplace evidence-integrity review findings (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-repair-marketplace-evidence-integrity.yml

permissions:
  contents: write

concurrency:
  group: audit-185-repair-marketplace-evidence-integrity
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 61c02df748c482c48b86ed7ec931ec69c54be2bf
    steps:
      - name: Checkout exact review-repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require exact one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-repair-marketplace-evidence-integrity.yml'

      - name: Harden candidate and verification-index validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode())"
          (cd tools/audit && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_verify_platform_marketplace_payments_wallet_group.py)
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile tools/audit/verify_platform_marketplace_payments_wallet_group.py tools/audit/test_verify_platform_marketplace_payments_wallet_group.py
          PYTHONDONTWRITEBYTECODE=1 python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            'tools/audit/test_verify_platform_marketplace_payments_wallet_group.py'
            'tools/audit/verify_platform_marketplace_payments_wallet_group.py'
          )
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")

      - name: Publish one fast-forward review-repair commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/audit/test_verify_platform_marketplace_payments_wallet_group.py \
            tools/audit/verify_platform_marketplace_payments_wallet_group.py
          git commit -m 'fix(audit): harden Marketplace evidence integrity (#186)'
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"

name: META R4 Windows verification

# Verification-only branch, never proposed for integration.
on:
  push:
    branches: [verify/meta-r4-windows-20260907]
    paths: [.github/workflows/meta-r4-windows-verification.yml]
permissions:
  contents: read
jobs:
  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 414d115695b56f6d79078a7e19cc1b3590e0edd2
          persist-credentials: false
      - name: Verify exact reviewed source tree
        shell: pwsh
        run: |
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $tree -ne '14db51a8a66f01455c05879bb4ffc285de045f98') { throw 'Unexpected source tree' }
      - name: Run bounded harness with PATH-independent child interpreter
        run: python tools/governance/test_bounded_execution_guard.py

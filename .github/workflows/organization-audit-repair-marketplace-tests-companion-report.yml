name: Organization audit repair Marketplace test companion report binding (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-repair-marketplace-tests-companion-report.yml

permissions:
  contents: write

concurrency:
  group: audit-185-repair-marketplace-tests-companion-report
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 1f6576055a549b12cb4b51d3e5b440b1701b6e95
      BRANCH: docs/20260907-org-comprehensive-audit
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require exact one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-repair-marketplace-tests-companion-report.yml'

      - name: Repair and bind companion Markdown gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          markdown_path = Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md')
          verifier_path = Path('tools/audit/verify_platform_marketplace_tests_group.py')
          tests_path = Path('tools/audit/test_verify_platform_marketplace_tests_group.py')

          stale = 'Post-adoption exact-head proof and fresh independent review are still required.'
          gate = (
              'Post-adoption exact-head proof is complete and bound. The remaining gate for this six-path batch is fresh independent '
              'exact-head review of the current stable audit head; temporary qualifier and ledger workflows remain until that review completes.'
          )

          markdown = markdown_path.read_text(encoding='utf-8')
          if markdown.count(stale) != 1 or gate in markdown:
              raise SystemExit('companion Markdown stale-gate anchor drift')
          markdown_path.write_text(markdown.replace(stale, gate, 1), encoding='utf-8')

          verifier = verifier_path.read_text(encoding='utf-8')
          old = "REPORT = Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json')\n"
          new = old + "MARKDOWN_REPORT = Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md')\n"
          if verifier.count(old) != 1 or 'MARKDOWN_REPORT = Path(' in verifier:
              raise SystemExit('Markdown path constant anchor drift')
          verifier = verifier.replace(old, new, 1)

          old = "LEDGER_SHA = '25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617'\n"
          new = old + "COMPANION_GATE = (\n    'Post-adoption exact-head proof is complete and bound. The remaining gate for this six-path batch is fresh independent '\n    'exact-head review of the current stable audit head; temporary qualifier and ledger workflows remain until that review completes.'\n)\nSTALE_COMPANION_GATE = 'Post-adoption exact-head proof and fresh independent review are still required.'\n"
          if verifier.count(old) != 1 or 'COMPANION_GATE = (' in verifier:
              raise SystemExit('companion gate constant anchor drift')
          verifier = verifier.replace(old, new, 1)

          anchor = "\ndef validate_accounting(audit_root: Path) -> None:\n"
          helper = "\ndef validate_companion_report_text(text: str) -> None:\n    require(text.count(COMPANION_GATE) == 1, 'Marketplace-test companion Markdown gate missing/duplicated/drifted')\n    require(STALE_COMPANION_GATE not in text, 'Marketplace-test companion Markdown retains completed post-adoption gate')\n\n"
          if verifier.count(anchor) != 1 or 'def validate_companion_report_text' in verifier:
              raise SystemExit('companion validator anchor drift')
          verifier = verifier.replace(anchor, helper + anchor, 1)

          old = "def validate_accounting(audit_root: Path) -> None:\n    summary = read_json(audit_root / SUMMARY)\n"
          new = "def validate_accounting(audit_root: Path) -> None:\n    validate_companion_report_text((audit_root / MARKDOWN_REPORT).read_text(encoding='utf-8'))\n    summary = read_json(audit_root / SUMMARY)\n"
          if verifier.count(old) != 1:
              raise SystemExit('validate_accounting companion anchor drift')
          verifier_path.write_text(verifier.replace(old, new, 1), encoding='utf-8')

          tests = tests_path.read_text(encoding='utf-8')
          old = "REPORT = ROOT / verifier.REPORT\n"
          new = old + "MARKDOWN_REPORT = ROOT / verifier.MARKDOWN_REPORT\n"
          if tests.count(old) != 1 or 'MARKDOWN_REPORT = ROOT' in tests:
              raise SystemExit('unit Markdown path anchor drift')
          tests = tests.replace(old, new, 1)

          anchor = "\n    def test_verification_index_row_is_exact(self):\n"
          test = "\n    def test_companion_markdown_gate_is_exact_and_fail_closed(self):\n        text = MARKDOWN_REPORT.read_text(encoding='utf-8')\n        verifier.validate_companion_report_text(text)\n        mutations = [\n            text.replace(verifier.COMPANION_GATE, verifier.STALE_COMPANION_GATE, 1),\n            text.replace(verifier.COMPANION_GATE, 'This batch establishes production readiness.', 1),\n            text + '\\n' + verifier.COMPANION_GATE + '\\n',\n        ]\n        for mutated in mutations:\n            with self.assertRaisesRegex(ValueError, 'companion Markdown'):\n                verifier.validate_companion_report_text(mutated)\n"
          if tests.count(anchor) != 1 or 'test_companion_markdown_gate_is_exact_and_fail_closed' in tests:
              raise SystemExit('companion unit-test anchor drift')
          tests_path.write_text(tests.replace(anchor, test + anchor, 1), encoding='utf-8')
          PY

          python3 -m py_compile tools/audit/verify_platform_marketplace_tests_group.py tools/audit/test_verify_platform_marketplace_tests_group.py
          (cd tools/audit && python3 -m unittest -v test_verify_platform_marketplace_tests_group.py)
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            'docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md'
            'tools/audit/test_verify_platform_marketplace_tests_group.py'
            'tools/audit/verify_platform_marketplace_tests_group.py'
          )
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")

      - name: Publish one fast-forward repair commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md \
            tools/audit/test_verify_platform_marketplace_tests_group.py \
            tools/audit/verify_platform_marketplace_tests_group.py
          git commit -m 'test(audit): bind Marketplace companion report gate (#186)'
          git push origin "HEAD:refs/heads/$BRANCH"

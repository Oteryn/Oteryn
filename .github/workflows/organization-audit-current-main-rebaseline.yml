name: Organization Audit Current-Main Rebaseline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/organization-audit-current-main-rebaseline.yml'
      - 'tools/audit/organization_audit.py'
      - 'docs/evidence/organization-audit-20260907/collection-plan.json'

permissions:
  contents: read

jobs:
  rebaseline:
    name: Rebaseline immutable source identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build bounded old/current snapshot plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('docs/evidence/organization-audit-20260907/collection-plan.json')
          canonical = json.loads(source.read_text(encoding='utf-8'))
          wanted = {'meta', 'game', 'platform', 'atlas', 'migration_archive'}
          rows = [row for row in canonical['snapshots'] if row['id'] in wanted]
          if {row['id'] for row in rows} != wanted:
              raise SystemExit('canonical source snapshot set is incomplete')

          out = []
          for row in rows:
              row = dict(row)
              if row['id'] == 'meta':
                  row['id'] = 'meta_old'
              out.append(row)
          out.append({
              'id': 'meta_current',
              'repository': 'Oteryn/Oteryn',
              'commit_sha': '23b21e9b1b2d4b6c3a5cac3d4c7a18747804c090',
              'expected_tree_sha': 'b8ebb8e50bce14a736fa65590ac121655c52fd12',
              'role': 'audited_source',
          })
          plan = {'schema_version': 1, 'snapshots': out}
          Path('/tmp/current-main-plan.json').write_text(
              json.dumps(plan, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Collect immutable identities only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tools/audit/organization_audit.py \
            --plan /tmp/current-main-plan.json \
            --output /tmp/current-main-rebaseline

      - name: Compare exact META leaf identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/current-main-rebaseline/inventories')
          old = json.loads((root / 'meta_old.json').read_text(encoding='utf-8'))
          current = json.loads((root / 'meta_current.json').read_text(encoding='utf-8'))
          providers = {
              name: json.loads((root / f'{name}.json').read_text(encoding='utf-8'))
              for name in ('game', 'platform', 'atlas', 'migration_archive')
          }

          if old['commit_sha'] != '1a01c5b3e08666a82245b1cac78da3736c65e785':
              raise SystemExit('old META identity drift')
          if old['tree_sha'] != 'f084e824ec5e14d5909c9750d906d91d51425fd5':
              raise SystemExit('old META tree drift')
          if current['commit_sha'] != '23b21e9b1b2d4b6c3a5cac3d4c7a18747804c090':
              raise SystemExit('current META identity drift')
          if current['tree_sha'] != 'b8ebb8e50bce14a736fa65590ac121655c52fd12':
              raise SystemExit('current META tree drift')

          old_by_path = {row['path']: row for row in old['entries']}
          current_by_path = {row['path']: row for row in current['entries']}
          old_paths = set(old_by_path)
          current_paths = set(current_by_path)

          added_paths = sorted(current_paths - old_paths)
          removed_paths = sorted(old_paths - current_paths)
          shared = old_paths & current_paths
          modified_paths = sorted(
              path for path in shared
              if (old_by_path[path]['mode'], old_by_path[path]['type'], old_by_path[path]['object_sha']) !=
                 (current_by_path[path]['mode'], current_by_path[path]['type'], current_by_path[path]['object_sha'])
          )

          added = [
              {
                  'path': path,
                  'mode': current_by_path[path]['mode'],
                  'type': current_by_path[path]['type'],
                  'object_sha': current_by_path[path]['object_sha'],
              }
              for path in added_paths
          ]
          modified = [
              {
                  'path': path,
                  'old_mode': old_by_path[path]['mode'],
                  'old_type': old_by_path[path]['type'],
                  'old_object_sha': old_by_path[path]['object_sha'],
                  'new_mode': current_by_path[path]['mode'],
                  'new_type': current_by_path[path]['type'],
                  'new_object_sha': current_by_path[path]['object_sha'],
              }
              for path in modified_paths
          ]
          removed = [
              {
                  'path': path,
                  'mode': old_by_path[path]['mode'],
                  'type': old_by_path[path]['type'],
                  'object_sha': old_by_path[path]['object_sha'],
              }
              for path in removed_paths
          ]

          provider_total = sum(item['leaf_count'] for item in providers.values())
          result = {
              'schema_version': 1,
              'result': 'CURRENT_MAIN_IDENTITY_REBASELINE_NOT_SEMANTIC_PASS',
              'old_meta': {
                  'commit_sha': old['commit_sha'],
                  'tree_sha': old['tree_sha'],
                  'leaf_count': old['leaf_count'],
              },
              'current_meta': {
                  'commit_sha': current['commit_sha'],
                  'tree_sha': current['tree_sha'],
                  'leaf_count': current['leaf_count'],
              },
              'pinned_non_meta_source_and_archive_leaf_count': provider_total,
              'old_organization_source_and_archive_leaf_count': old['leaf_count'] + provider_total,
              'current_organization_source_and_archive_leaf_count': current['leaf_count'] + provider_total,
              'added_count': len(added),
              'modified_count': len(modified),
              'removed_count': len(removed),
              'added': added,
              'modified': modified,
              'removed': removed,
              'semantic_coverage': 'NOT_INFERRED',
          }

          if old['leaf_count'] != 174:
              raise SystemExit(f"unexpected old META leaf count: {old['leaf_count']}")
          if len(added) != 36 or len(modified) != 9 or removed:
              raise SystemExit(
                  f"unexpected META delta: added={len(added)} modified={len(modified)} removed={len(removed)}"
              )
          if result['old_organization_source_and_archive_leaf_count'] != 4325:
              raise SystemExit('old organization leaf count no longer reproduces 4325')

          raw = (json.dumps(result, indent=2, sort_keys=True) + '\n').encode()
          digest = hashlib.sha256(raw).hexdigest()
          print(raw.decode(), end='')
          print('REBASELINE_RESULT_SHA256=' + digest)
          Path('/tmp/current-main-rebaseline-result.json').write_bytes(raw)
          PY

name: Organization audit Platform coverage reconciliation (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-gameauth-reconcile.yml
      - tools/audit/apply_platform_gameauth_coverage.py
      - tools/audit/test_verify_report.py
      - docs/evidence/organization-audit-20260907/r3-platform-gameauth-candidate.json

permissions:
  contents: write
  actions: read

concurrency:
  group: audit-185-platform-coverage-reconciliation
  cancel-in-progress: false

jobs:
  reconcile-once:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1
      - name: Guard exact branch and one-shot state
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = docs/20260907-org-comprehensive-audit
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p='docs/evidence/organization-audit-20260907/r3-platform-gameauth-candidate.json'
          d=json.load(open(p,encoding='utf-8'))
          if d.get('state')=='QUALIFIED_ADOPTED_AS_GROUPED' and d.get('coverage_adopted') is True:
              print('skip=true')
          elif d.get('state')=='CANDIDATE_PENDING_QUALIFICATION' and d.get('coverage_adopted') is False:
              print('skip=false')
          else:
              raise SystemExit('unexpected GameAuth candidate state')
          PY
      - name: Download immutable source inventory artifact
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-artifact"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10033995995/zip" > "$RUNNER_TEMP/source-artifact.zip"
          unzip -q "$RUNNER_TEMP/source-artifact.zip" -d "$RUNNER_TEMP/source-artifact"
      - name: Reconcile and validate full ledger
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          INV="$(python3 - "$RUNNER_TEMP/source-artifact" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); names={'meta.json','game.json','platform.json','atlas.json','migration_archive.json'}
          hits=[p.parent for p in root.rglob('meta.json') if all((p.parent/n).is_file() for n in names)]
          if len(hits)!=1: raise SystemExit(f'expected one inventory directory, got {hits}')
          print(hits[0])
          PY
          )"
          python3 tools/audit/apply_platform_gameauth_coverage.py --root . --inventory-dir "$INV" | tee "$RUNNER_TEMP/reconcile.json"
          python3 - "$RUNNER_TEMP/reconcile.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['result']=='ACCOUNTING_VALID_NOT_SEMANTIC_PASS'
          assert d['scoped_review_paths']==221 and d['grouped_revalidated_paths']==27
          assert d['semantically_classified_paths']==248 and d['unverified_semantics']==4077
          assert d['tree_and_ledger_verified'] is True
          PY
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          node --test tools/audit/test-public-surface-contract.mjs tools/audit/test-public-surface-evidence-hardening.mjs
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json --inventory-dir "$INV" --ledger-output "$RUNNER_TEMP/final-ledger.csv"
          git diff --check
      - name: Commit only durable audit evidence
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git status --short
          if git status --porcelain | awk '{print $2}' | grep -v '^docs/evidence/' | grep -q .; then
            echo 'reconciler modified a non-docs/evidence path' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence
          git diff --cached --check
          git commit -m 'docs(audit): adopt qualified Platform routes and GameAuth coverage (#186)'
          git push origin HEAD:refs/heads/docs/20260907-org-comprehensive-audit

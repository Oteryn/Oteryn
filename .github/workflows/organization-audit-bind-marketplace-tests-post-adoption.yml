name: Organization audit bind Marketplace test post-adoption proof (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-bind-marketplace-tests-post-adoption.yml

permissions:
  contents: write

concurrency:
  group: audit-185-bind-marketplace-tests-post-adoption
  cancel-in-progress: false

jobs:
  bind:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: f1d53b90e3ad23cf88c41f0da1f465ea3f26c53a
      BRANCH: docs/20260907-org-comprehensive-audit
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact binder trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require exact one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-bind-marketplace-tests-post-adoption.yml'

      - name: Bind exact post-adoption proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          candidate_path = Path('docs/evidence/organization-audit-20260907/r3-platform-marketplace-tests-candidate.json')
          groups_path = Path('docs/evidence/organization-audit-20260907/coverage-groups.json')
          index_path = Path('docs/evidence/organization-audit-20260907/verification-index.json')
          verifier_path = Path('tools/audit/verify_platform_marketplace_tests_group.py')
          tests_path = Path('tools/audit/test_verify_platform_marketplace_tests_group.py')

          post = {
              'audit_head': 'c67c1e9d7622612affdd431b2af9fae05d0d11ef',
              'workflow_run': 34333058684,
              'job': 102405922454,
              'result': 'PASS',
              'canonical_group_state': 'MARKETPLACE_TESTS_GROUPED_ADOPTION_PRIMARY_PROOF_REVALIDATED_NOT_PRODUCT_PASS',
              'verifier_unit_tests': 14,
              'focused_current_tests': {
                  'test_files': 6, 'junit_files': 3, 'cases': 17, 'assertions': 179,
                  'failures': 0, 'errors': 0, 'skipped': 0,
                  'junit': [
                      {'file': 'ordinary.xml', 'cases': 14, 'assertions': 110, 'failures': 0, 'errors': 0, 'skipped': 0},
                      {'file': 'transfer-concurrency.xml', 'cases': 1, 'assertions': 54, 'failures': 0, 'errors': 0, 'skipped': 0},
                      {'file': 'transfer.xml', 'cases': 2, 'assertions': 15, 'failures': 0, 'errors': 0, 'skipped': 0},
                  ],
              },
              'php': '8.5.10', 'mariadb': '11.8.9',
              'meta_ci_run': 34333058582, 'meta_ci_result': 'SUCCESS',
              'ledger_reproduction_run': 34333058620,
              'ledger_reproduction_job': 102405921741,
              'ledger_reproduction_artifact': 10096546256,
              'ledger_sha256': '25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617',
              'ledger_counts': {'source_rows': 4325, 'direct_paths': 221, 'grouped_paths': 113, 'unverified_paths': 3991},
          }

          candidate = json.loads(candidate_path.read_text(encoding='utf-8'))
          if candidate.get('state') != 'QUALIFIED_ADOPTED_AS_GROUPED_PENDING_POST_ADOPTION_REVALIDATION':
              raise SystemExit('candidate state drift before binding')
          if 'post_adoption_revalidation' in candidate:
              raise SystemExit('candidate already carries post-adoption evidence')
          candidate['state'] = 'QUALIFIED_ADOPTED_AS_GROUPED'
          candidate['limitations'] = (
              'Adopted only as bounded GROUPED carry-forward after immutable historical direct-read evidence explicitly names all six files, '
              'exact historical/frozen tree/path/blob identity, the exact bound 17-case/179-assertion all-green qualification including both real-MariaDB tests, '
              'and projected-ledger reproduction proving only these six rows transition UNVERIFIED to GROUPED. This does not establish production readiness, '
              'complete Marketplace/payment correctness, later-current-main status, provider remediation, or organization-wide audit completion. '
              'Fresh independent exact-head review remains required.'
          )
          candidate['post_adoption_revalidation'] = post
          candidate_path.write_text(json.dumps(candidate, indent=2) + '\n', encoding='utf-8')

          groups_doc = json.loads(groups_path.read_text(encoding='utf-8'))
          rows = [g for g in groups_doc.get('groups', []) if g.get('id') == 'PLATFORM-MARKETPLACE-TESTS-HISTORICAL-DIRECT-CARRYFORWARD']
          if len(rows) != 1:
              raise SystemExit('canonical group missing/duplicated before binding')
          group = rows[0]
          if group.get('evaluation', {}).get('outcome') != 'ADOPTED_GROUPED_CARRY_FORWARD_PENDING_POST_ADOPTION_REVALIDATION':
              raise SystemExit('canonical group outcome drift before binding')
          if 'post_adoption_revalidation' in group['evaluation']:
              raise SystemExit('canonical group already carries post-adoption evidence')
          group['limitations'] = (
              'Adopted only as bounded GROUPED carry-forward. This does not establish production readiness, complete Marketplace/payment correctness, '
              'later-current-main status, provider remediation, or organization-wide audit completion. Fresh independent exact-head review remains required.'
          )
          group['evaluation']['post_adoption_revalidation'] = post
          group['evaluation']['outcome'] = 'ADOPTED_GROUPED_CARRY_FORWARD'
          groups_path.write_text(json.dumps(groups_doc, indent=2) + '\n', encoding='utf-8')

          index = json.loads(index_path.read_text(encoding='utf-8'))
          row = index.get('r3_platform_marketplace_tests_qualification')
          if not isinstance(row, dict) or row.get('post_adoption_status') != 'PENDING':
              raise SystemExit('verification-index post-adoption status drift before binding')
          row.pop('post_adoption_status')
          row.update({
              'post_adoption_head': post['audit_head'],
              'post_adoption_run': post['workflow_run'],
              'post_adoption_job': post['job'],
              'post_adoption_verifier_unit_tests': post['verifier_unit_tests'],
              'post_adoption_meta_ci_run': post['meta_ci_run'],
              'post_adoption_ledger_run': post['ledger_reproduction_run'],
              'post_adoption_ledger_job': post['ledger_reproduction_job'],
              'post_adoption_ledger_artifact': post['ledger_reproduction_artifact'],
              'post_adoption_ledger_sha256': post['ledger_sha256'],
              'post_adoption_grouped_paths': post['ledger_counts']['grouped_paths'],
              'post_adoption_unverified_paths': post['ledger_counts']['unverified_paths'],
              'post_adoption_result': post['canonical_group_state'],
          })
          index_path.write_text(json.dumps(index, indent=2) + '\n', encoding='utf-8')

          verifier = verifier_path.read_text(encoding='utf-8')
          def replace_once(old: str, new: str, label: str) -> None:
              nonlocal_verifier[0] = nonlocal_verifier[0].replace(old, new, 1) if nonlocal_verifier[0].count(old) == 1 else (_ for _ in ()).throw(SystemExit(label + ' anchor drift'))
          nonlocal_verifier = [verifier]
          replace_once("ADOPTED_PENDING = 'QUALIFIED_ADOPTED_AS_GROUPED_PENDING_POST_ADOPTION_REVALIDATION'", "ADOPTED = 'QUALIFIED_ADOPTED_AS_GROUPED'", 'state')
          insert_anchor = "CANDIDATE_LIMITATIONS = (\n"
          post_source = "POST_ADOPTION = " + repr(post) + "\n"
          if nonlocal_verifier[0].count(insert_anchor) != 1 or 'POST_ADOPTION = ' in nonlocal_verifier[0]:
              raise SystemExit('POST_ADOPTION insertion anchor drift')
          nonlocal_verifier[0] = nonlocal_verifier[0].replace(insert_anchor, post_source + insert_anchor, 1)
          replace_once("'Post-adoption exact-head qualifier/ledger/META proof and fresh independent review are still required.'", "'Fresh independent exact-head review remains required.'", 'candidate limitations')
          replace_once("'later-current-main status, provider remediation, or organization-wide audit completion. Post-adoption exact-head proof and fresh independent review remain required.'", "'later-current-main status, provider remediation, or organization-wide audit completion. Fresh independent exact-head review remains required.'", 'group limitations')
          replace_once("'state': ADOPTED_PENDING,", "'state': ADOPTED,", 'expected candidate state')
          replace_once("        'projected_ledger': PROJECTED_LEDGER,\n    }\n\ndef expected_group", "        'projected_ledger': PROJECTED_LEDGER,\n        'post_adoption_revalidation': POST_ADOPTION,\n    }\n\ndef expected_group", 'expected candidate post proof')
          replace_once("            'projected_ledger': PROJECTED_LEDGER,\n            'outcome': 'ADOPTED_GROUPED_CARRY_FORWARD_PENDING_POST_ADOPTION_REVALIDATION',", "            'projected_ledger': PROJECTED_LEDGER,\n            'post_adoption_revalidation': POST_ADOPTION,\n            'outcome': 'ADOPTED_GROUPED_CARRY_FORWARD',", 'expected group post proof')
          replace_once("        'qualification': 'BOUNDED_GROUPED_CARRY_FORWARD_NOT_PRODUCT_PASS',\n        'post_adoption_status': 'PENDING',", "        'qualification': 'BOUNDED_GROUPED_CARRY_FORWARD_NOT_PRODUCT_PASS',\n        'post_adoption_head': POST_ADOPTION['audit_head'],\n        'post_adoption_run': POST_ADOPTION['workflow_run'],\n        'post_adoption_job': POST_ADOPTION['job'],\n        'post_adoption_verifier_unit_tests': POST_ADOPTION['verifier_unit_tests'],\n        'post_adoption_meta_ci_run': POST_ADOPTION['meta_ci_run'],\n        'post_adoption_ledger_run': POST_ADOPTION['ledger_reproduction_run'],\n        'post_adoption_ledger_job': POST_ADOPTION['ledger_reproduction_job'],\n        'post_adoption_ledger_artifact': POST_ADOPTION['ledger_reproduction_artifact'],\n        'post_adoption_ledger_sha256': POST_ADOPTION['ledger_sha256'],\n        'post_adoption_grouped_paths': POST_ADOPTION['ledger_counts']['grouped_paths'],\n        'post_adoption_unverified_paths': POST_ADOPTION['ledger_counts']['unverified_paths'],\n        'post_adoption_result': POST_ADOPTION['canonical_group_state'],", 'expected index post proof')
          replace_once("'result': 'MARKETPLACE_TESTS_GROUPED_ADOPTION_PENDING_POST_ADOPTION_PROOF_NOT_PRODUCT_PASS',", "'result': 'MARKETPLACE_TESTS_GROUPED_ADOPTION_PRIMARY_PROOF_REVALIDATED_NOT_PRODUCT_PASS',", 'result')
          replace_once("        'projected_ledger': PROJECTED_LEDGER,\n        'coverage_adopted': True,", "        'projected_ledger': PROJECTED_LEDGER,\n        'post_adoption_revalidation': POST_ADOPTION,\n        'coverage_adopted': True,", 'return post proof')
          replace_once("'next_gate': 'fresh exact-head qualifier + immutable 4,325-row ledger reproduction + META CI; bind those proof coordinates before independent review',", "'next_gate': 'fresh independent exact-head review; retain temporary qualifier and ledger workflows until review completes',", 'next gate')
          verifier_path.write_text(nonlocal_verifier[0], encoding='utf-8')

          tests = tests_path.read_text(encoding='utf-8')
          outcome_anchor = "row['evaluation']['outcome']='ADOPTED_GROUPED_CARRY_FORWARD'"
          if tests.count(outcome_anchor) != 1:
              raise SystemExit('group outcome negative-control anchor drift')
          tests = tests.replace(outcome_anchor, "row['evaluation']['outcome']='BROKEN'", 1)
          old_test = """    def test_post_adoption_preclaim_fails_closed(self):\n        d=self.candidate(); d['post_adoption_revalidation']={'result':'PASS'}\n        with self.assertRaisesRegex(ValueError,'candidate canonical'):\n            verifier.validate_candidate_shape(d)\n"""
          new_test = """    def test_post_adoption_evidence_drift_fails_closed(self):\n        for key, value in (('audit_head','0'*40),('workflow_run',1),('job',1),('verifier_unit_tests',13),('meta_ci_result','FAILURE'),('ledger_reproduction_artifact',1),('ledger_sha256','0'*64)):\n            d=self.candidate(); d['post_adoption_revalidation'][key]=value\n            with self.assertRaisesRegex(ValueError,'candidate canonical'):\n                verifier.validate_candidate_shape(d)\n        d=self.candidate(); d['post_adoption_revalidation']['ledger_counts']['grouped_paths']=112\n        with self.assertRaisesRegex(ValueError,'candidate canonical'):\n            verifier.validate_candidate_shape(d)\n"""
          if tests.count(old_test) != 1:
              raise SystemExit('post-adoption unit-test anchor drift')
          tests = tests.replace(old_test, new_test, 1)
          old_group = """        g=self.groups(); row=next(x for x in g['groups'] if x.get('id')==verifier.GROUP_ID); row['evaluation']['projected_ledger']['artifact']+=1\n        with self.assertRaisesRegex(ValueError,'canonical group drift'):\n            verifier.validate_group_state(g)\n"""
          new_group = old_group + """        g=self.groups(); row=next(x for x in g['groups'] if x.get('id')==verifier.GROUP_ID); row['evaluation']['post_adoption_revalidation']['workflow_run']+=1\n        with self.assertRaisesRegex(ValueError,'canonical group drift'):\n            verifier.validate_group_state(g)\n"""
          if tests.count(old_group) != 1:
              raise SystemExit('group post-adoption unit-test anchor drift')
          tests = tests.replace(old_group, new_group, 1)
          old_index = """        i['r3_platform_marketplace_tests_qualification']['projected_ledger_sha256']='0'*64\n        self.assertFalse(verifier.json_exact(i['r3_platform_marketplace_tests_qualification'],verifier.expected_index_row()))\n"""
          new_index = old_index + """        i=self.index(); i['r3_platform_marketplace_tests_qualification']['post_adoption_ledger_artifact']+=1\n        self.assertFalse(verifier.json_exact(i['r3_platform_marketplace_tests_qualification'],verifier.expected_index_row()))\n"""
          if tests.count(old_index) != 1:
              raise SystemExit('index post-adoption unit-test anchor drift')
          tests_path.write_text(tests.replace(old_index, new_index, 1), encoding='utf-8')
          PY

          python3 -m py_compile tools/audit/verify_platform_marketplace_tests_group.py tools/audit/test_verify_platform_marketplace_tests_group.py
          (cd tools/audit && python3 -m unittest -v test_verify_platform_marketplace_tests_group.py)
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            'docs/evidence/organization-audit-20260907/coverage-groups.json'
            'docs/evidence/organization-audit-20260907/r3-platform-marketplace-tests-candidate.json'
            'docs/evidence/organization-audit-20260907/verification-index.json'
            'tools/audit/test_verify_platform_marketplace_tests_group.py'
            'tools/audit/verify_platform_marketplace_tests_group.py'
          )
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")

      - name: Publish one fast-forward evidence-binding commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/evidence/organization-audit-20260907/coverage-groups.json \
            docs/evidence/organization-audit-20260907/r3-platform-marketplace-tests-candidate.json \
            docs/evidence/organization-audit-20260907/verification-index.json \
            tools/audit/test_verify_platform_marketplace_tests_group.py \
            tools/audit/verify_platform_marketplace_tests_group.py
          git commit -m 'test(audit): bind Marketplace test post-adoption evidence (#186)'
          git push origin "HEAD:refs/heads/$BRANCH"

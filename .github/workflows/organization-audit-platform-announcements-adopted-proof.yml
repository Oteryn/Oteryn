name: Organization audit Platform Announcements adopted proof (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-announcements-adopted-proof.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md
      - docs/evidence/organization-audit-20260907/README.md
      - docs/evidence/organization-audit-20260907/collection-plan.json
      - docs/evidence/organization-audit-20260907/coverage-review.tsv
      - docs/evidence/organization-audit-20260907/coverage-review-additions.tsv
      - docs/evidence/organization-audit-20260907/coverage-review-announcements-additions.tsv
      - docs/evidence/organization-audit-20260907/coverage-review-canonical-additions.tsv
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/coverage-summary.json
      - docs/evidence/organization-audit-20260907/unknowns.json
      - docs/evidence/organization-audit-20260907/r3-platform-audit-recorders-direct-candidate.json
      - docs/evidence/organization-audit-20260907/r3-platform-announcements-direct-candidate.json
      - tools/audit/organization_audit.py
      - tools/audit/verify_report.py
      - tools/audit/test_verify_report.py
      - tools/audit/verify_readme_current_state.py
      - tools/audit/test_verify_readme_current_state.py
      - tools/audit/verify_platform_audit_recorders_direct.py
      - tools/audit/test_verify_platform_audit_recorders_direct.py
      - tools/audit/verify_platform_marketplace_tests_group.py
      - tools/audit/test_verify_platform_marketplace_tests_group.py
      - tools/audit/verify_platform_announcements_direct.py
      - tools/audit/test_verify_platform_announcements_direct.py
      - tools/audit/project_platform_announcements_direct.py
      - tools/audit/test_project_platform_announcements_direct.py
      - tools/audit/verify_platform_announcements_adopted.py
      - tools/audit/test_verify_platform_announcements_adopted.py

permissions:
  contents: read

concurrency:
  group: audit-185-platform-announcements-adopted-proof
  cancel-in-progress: false

jobs:
  prove-announcements-adopted:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: oteryn-announcements-adopted-root
          MARIADB_DATABASE: oteryn_announcements_adopted
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_announcements_adopted
      DB_USERNAME: root
      DB_PASSWORD: oteryn-announcements-adopted-root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout exact adopted audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
      - name: Checkout frozen Platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform
          persist-credentials: false
      - name: Verify canonical adoption contracts and all audit unit regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C platform rev-parse HEAD)" = de917b3477a1de0667531380de3660e8b2ab59aa
          test "$(git -C platform rev-parse HEAD^{tree})" = ffdf2a286d3a39f2344cf2ff53b28e4ef7369a8e
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C platform diff --exit-code
          (cd audit && python3 -m unittest discover -s tools/audit -p 'test_*.py' -v)
          python3 audit/tools/audit/verify_readme_current_state.py --readme audit/docs/evidence/organization-audit-20260907/README.md | tee "$RUNNER_TEMP/readme-state.json"
          python3 audit/tools/audit/verify_platform_audit_recorders_direct.py --audit-root audit --platform-root platform | tee "$RUNNER_TEMP/recorder-state.json"
          python3 audit/tools/audit/verify_platform_announcements_direct.py --audit-root audit --platform-root platform | tee "$RUNNER_TEMP/announcements-pre-state.json"
          python3 audit/tools/audit/verify_platform_announcements_adopted.py --audit-root audit --platform-root platform | tee "$RUNNER_TEMP/announcements-adopted-state.json"
      - name: Rebuild immutable audit inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 audit/tools/audit/organization_audit.py \
            --plan audit/docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/audit-inventory"
      - name: Reproduce exact adopted canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 audit/tools/audit/verify_report.py \
            --report audit/docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/adopted-ledger.csv" | tee "$RUNNER_TEMP/ledger-verifier.json"
          python3 - "$RUNNER_TEMP/adopted-ledger.csv" "$RUNNER_TEMP/adopted-ledger-proof.json" <<'PY'
          import csv,hashlib,json,sys
          from collections import Counter
          raw=open(sys.argv[1],'rb').read(); rows=list(csv.DictReader(raw.decode('utf-8').splitlines())); counts=Counter(r['disposition'] for r in rows); digest=hashlib.sha256(raw).hexdigest()
          expected={'DIRECT':233,'GROUPED':113,'UNVERIFIED':3979}
          if len(rows)!=4325 or dict(counts)!=expected: raise SystemExit(f'adopted canonical count drift: rows={len(rows)} counts={dict(counts)}')
          if digest!='73c458b8e1b2a6a5cf02bedbefec8fe3a11d4f883413ef65f6d8dd56952338f9': raise SystemExit('adopted canonical digest drift: '+digest)
          ann={
            'app/Announcements/Actions/SaveAnnouncement.php','app/Announcements/Factories/SiteAnnouncementFactory.php',
            'app/Announcements/Http/AdminAnnouncementController.php','app/Announcements/Http/AnnouncementRequest.php',
            'app/Announcements/Links/AnnouncementActionLink.php','app/Announcements/Models/SiteAnnouncement.php',
            'app/Announcements/Queries/ActiveAnnouncementQuery.php','app/Announcements/Queries/AnnouncementTickerProvider.php',
            'app/Announcements/ViewModels/AnnouncementTicker.php','app/Announcements/ViewModels/AnnouncementTickerState.php',
          }
          rec={'app/Audit/AdminAuditRecorder.php','app/Audit/SecurityEventRecorder.php'}
          states={r['path']:r['disposition'] for r in rows if r['repository_id']=='platform' and r['path'] in ann|rec}
          if set(states)!=ann|rec or any(value!='DIRECT' for value in states.values()): raise SystemExit('adopted DIRECT slice drift: '+json.dumps(states,sort_keys=True))
          proof={'audit_head':'${{ github.event.pull_request.head.sha }}','source_rows':4325,'direct_paths':233,'grouped_paths':113,'unverified_paths':3979,'semantically_classified_paths':346,'ledger_sha256':digest,'announcements_direct_paths':10,'recorder_direct_paths':2,'independent_review_required':True,'product_readiness_claimed':False,'audit_completion_claimed':False}
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps(proof,indent=2,sort_keys=True)+'\n'); print(json.dumps(proof,sort_keys=True))
          PY
      - name: Setup PHP 8.5.10
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, pcntl, gd
          tools: composer:v2
      - name: Install frozen Platform dependencies
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          : > .env
          php artisan config:clear --ansi
      - name: Execute exact Announcements qualification on adopted head
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test tests/Feature/Announcements/AnnouncementsModuleTest.php --log-junit="$RUNNER_TEMP/announcements-junit.xml"
      - name: Execute exact recorder consumers on adopted head
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test \
            tests/Feature/Admin/AdminRoleManagementTest.php \
            tests/Feature/Identity/RegistrationTest.php \
            tests/Feature/GameAuth/GameLoginTicketLifecycleTest.php \
            --log-junit="$RUNNER_TEMP/recorder-junit.xml"
      - name: Enforce exact execution totals
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/announcements-junit.xml" "$RUNNER_TEMP/recorder-junit.xml" "$RUNNER_TEMP/execution-summary.json" <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          def summarize(path):
              cases=ET.parse(path).getroot().findall('.//testcase'); ids=set(); out={'cases':len(cases),'assertions':0,'failures':0,'errors':0,'skipped':0}
              for case in cases:
                  ident=(case.attrib.get('classname'),case.attrib.get('name'))
                  if not all(ident) or ident in ids: raise SystemExit(f'duplicate/missing JUnit identity: {ident}')
                  ids.add(ident); out['assertions']+=int(case.attrib.get('assertions','0')); out['failures']+=len(case.findall('failure')); out['errors']+=len(case.findall('error')); out['skipped']+=len(case.findall('skipped'))
              return out
          ann=summarize(sys.argv[1]); rec=summarize(sys.argv[2])
          if ann!={'cases':4,'assertions':20,'failures':0,'errors':0,'skipped':0}: raise SystemExit('Announcements execution drift: '+json.dumps(ann,sort_keys=True))
          if rec!={'cases':25,'assertions':89,'failures':0,'errors':0,'skipped':0}: raise SystemExit('recorder execution drift: '+json.dumps(rec,sort_keys=True))
          out={'announcements':ann,'recorders':rec}; open(sys.argv[3],'w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - name: Upload bounded adopted proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit185-platform-announcements-adopted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readme-state.json
            ${{ runner.temp }}/recorder-state.json
            ${{ runner.temp }}/announcements-pre-state.json
            ${{ runner.temp }}/announcements-adopted-state.json
            ${{ runner.temp }}/ledger-verifier.json
            ${{ runner.temp }}/adopted-ledger-proof.json
            ${{ runner.temp }}/adopted-ledger.csv
            ${{ runner.temp }}/execution-summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git -C audit diff --exit-code
          git -C platform diff --exit-code

name: Organization audit full ledger reproduction (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-ledger-reproduction.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/coverage-review.tsv
      - docs/evidence/organization-audit-20260907/coverage-summary.json
      - docs/evidence/organization-audit-20260907/r3-platform-account-character-candidate.json
      - tools/audit/organization_audit.py
      - tools/audit/verify_report.py
      - tools/audit/verify_platform_account_character_group.py

permissions:
  contents: read

concurrency:
  group: audit-185-full-ledger-reproduction
  cancel-in-progress: false

jobs:
  reproduce-adopted-ledger:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact adopted audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact candidate and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          git diff --exit-code
      - name: Rebuild immutable source inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/organization_audit.py \
            --plan docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/audit-inventory"
      - name: Reproduce exact adopted 4,325-row ledger
        shell: bash
        env:
          EXPECTED_LEDGER_SHA256: b61566ad825adf528b177a5ab4a2ee533680bd948e44a60df6289255c5747459
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ledger-proof"
          python3 tools/audit/verify_report.py \
            --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/ledger-proof/ledger.csv" \
            | tee "$RUNNER_TEMP/ledger-proof/verify-report.json"
          python3 - "$RUNNER_TEMP/ledger-proof/ledger.csv" "$RUNNER_TEMP/ledger-proof/digests.json" <<'PY'
          import csv,hashlib,json,sys
          from collections import Counter
          from pathlib import Path
          ledger=Path(sys.argv[1]); output=Path(sys.argv[2])
          raw=ledger.read_bytes(); digest=hashlib.sha256(raw).hexdigest()
          rows=list(csv.DictReader(raw.decode('utf-8').splitlines()))
          dispositions=Counter(row['disposition'] for row in rows)
          if len(rows)!=4325:
              raise SystemExit(f'expected 4325 ledger rows, got {len(rows)}')
          expected={'DIRECT':221,'GROUPED':58,'UNVERIFIED':4046}
          if dict(dispositions)!=expected:
              raise SystemExit('adopted disposition drift: '+json.dumps(dict(dispositions),sort_keys=True))
          if digest != 'b61566ad825adf528b177a5ab4a2ee533680bd948e44a60df6289255c5747459':
              raise SystemExit('adopted ledger digest drift: '+digest)
          proof={
              'schema_version':1,
              'audit_head':'${{ github.event.pull_request.head.sha }}',
              'source_rows':4325,
              'direct_paths':221,
              'grouped_paths':58,
              'unverified_paths':4046,
              'ledger_sha256':digest,
              'result':'ADOPTED_LEDGER_REPRODUCED_ACCOUNTING_VALID_NOT_SEMANTIC_PASS',
          }
          output.write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(proof,sort_keys=True))
          PY
      - name: Upload bounded adopted ledger proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit185-adopted-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/ledger-proof
          if-no-files-found: error
          retention-days: 1
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code

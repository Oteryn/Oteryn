name: META trusted AI review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: meta-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review-gate:
    name: ai-review-gate
    runs-on: ubuntu-latest
    steps:
      - name: Reject cross-repository pull requests
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
      - name: Checkout trusted governance from exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate as inert Git data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify exact candidate objects
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -C candidate cat-file -e "${BASE_SHA}^{commit}"
          git -C candidate cat-file -e "${HEAD_SHA}^{commit}"
      - name: Run trusted base review gate against candidate data
        uses: ./trusted/.github/actions/ai-review-gate
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          draft: ${{ github.event.pull_request.draft }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          repo-root: candidate

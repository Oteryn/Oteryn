name: META trusted AI review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: meta-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review-gate:
    name: ai-review-gate
    runs-on: ubuntu-latest
    steps:
      - name: Reject cross-repository pull requests
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
      - name: Checkout trusted governance from exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - id: review-gate
        name: Run trusted base review gate against inert candidate objects
        uses: ./trusted/.github/actions/ai-review-gate
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          draft: ${{ github.event.pull_request.draft }}
          repository: ${{ github.repository }}
          pr-id: ${{ github.event.pull_request.id }}
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}

      - id: attest-review-envelope
        name: Attest canonical trusted review envelope
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.review-gate.outputs.envelope-path }}
          predicate-type: https://oteryn.dev/bounded-execution-evidence/v1
          predicate-path: ${{ steps.review-gate.outputs.envelope-path }}

      - name: Verify GitHub attestation, exact predicate and live coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          PR_ID: ${{ github.event.pull_request.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_EXECUTION_SHA: ${{ github.sha }}
          WORKFLOW_JOB: ${{ github.job }}
          ENVELOPE_PATH: ${{ steps.review-gate.outputs.envelope-path }}
          ENVELOPE_SHA256: ${{ steps.review-gate.outputs.envelope-sha256 }}
          ATTESTATION_RESULT: ${{ runner.temp }}/oteryn-trusted-review-attestation-verify.json
          BARE_GIT_DIR: ${{ runner.temp }}/oteryn-candidate.git
          POLICY_FILE: trusted/ecosystem/ai-review-policy.json
          CLASSIFIER_FILE: trusted/tools/governance/ai_review_policy.py
        run: |
          set -euo pipefail
          test "sha256:$(sha256sum "$ENVELOPE_PATH" | awk '{print $1}')" = "$ENVELOPE_SHA256"
          gh attestation verify "$ENVELOPE_PATH" \
            --repo "$REPOSITORY" \
            --predicate-type https://oteryn.dev/bounded-execution-evidence/v1 \
            --signer-workflow "$REPOSITORY/.github/workflows/governance-ai-review.yml" \
            --signer-digest "$BASE_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$BASE_SHA" \
            --deny-self-hosted-runners \
            --format json > "$ATTESTATION_RESULT"
          python3 trusted/tools/governance/trusted_review_attestation.py verify \
            --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID" --pr-id "$PR_ID" --pr-number "$PR_NUMBER" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --draft "$DRAFT" --token "$GH_TOKEN" \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
            --workflow-execution-sha "$WORKFLOW_EXECUTION_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID" --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --workflow-job "$WORKFLOW_JOB" --bare-git-dir "$BARE_GIT_DIR" \
            --policy-file "$POLICY_FILE" --classifier-file "$CLASSIFIER_FILE" \
            --envelope "$ENVELOPE_PATH" --attestation-result "$ATTESTATION_RESULT"

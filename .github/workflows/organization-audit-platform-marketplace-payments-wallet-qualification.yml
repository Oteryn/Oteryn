name: Organization audit Platform Marketplace-Payments-Wallet qualification (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-marketplace-payments-wallet-qualification.yml
      - docs/evidence/organization-audit-20260907/r3-platform-marketplace-payments-wallet-candidate.json
      - docs/evidence/organization-audit-20260907/verification-index.json
      - tools/audit/verify_platform_marketplace_payments_wallet_group.py
      - tools/audit/test_verify_platform_marketplace_payments_wallet_group.py

permissions:
  contents: read

concurrency:
  group: audit-185-platform-marketplace-payments-wallet-qualification
  cancel-in-progress: false

jobs:
  qualify-marketplace-payments-wallet:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: oteryn-audit49-root
          MARIADB_DATABASE: oteryn_audit49
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_audit49
      DB_USERNAME: root
      DB_PASSWORD: oteryn-audit49-root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CANARY_PROVISIONING_INTEGRATION_HOST: 127.0.0.1
      CANARY_PROVISIONING_INTEGRATION_PORT: '3306'
      CANARY_PROVISIONING_INTEGRATION_ROOT_PASSWORD: oteryn-audit49-root
      CANARY_CHARACTER_CREATE_INTEGRATION_HOST: 127.0.0.1
      CANARY_CHARACTER_CREATE_INTEGRATION_PORT: '3306'
      CANARY_CHARACTER_CREATE_INTEGRATION_ROOT_PASSWORD: oteryn-audit49-root
    steps:
      - name: Checkout exact audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
      - name: Checkout frozen Platform source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable Platform audit publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: 3fe7df5330deb9ed38cc17ae1710f0cb4159019b
          path: evidence
          persist-credentials: false
      - name: Verify exact coordinates and clean trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C platform rev-parse HEAD)" = de917b3477a1de0667531380de3660e8b2ab59aa
          test "$(git -C platform rev-parse HEAD^{tree})" = ffdf2a286d3a39f2344cf2ff53b28e4ef7369a8e
          test "$(git -C evidence rev-parse HEAD)" = 3fe7df5330deb9ed38cc17ae1710f0cb4159019b
          test "$(git -C evidence rev-parse HEAD^{tree})" = c6ac8cb7cbff069d7ac7303b3472d992da254774
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C platform diff --exit-code
          git -C evidence diff --exit-code
      - name: Run exact adopted verifier unit tests
        working-directory: audit/tools/audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_verify_platform_marketplace_payments_wallet_group.py
      - name: Revalidate exact adopted primary proof and 49 path/blob identities
        working-directory: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_platform_marketplace_payments_wallet_group.py --audit-root . --platform-root ../platform --evidence-root ../evidence | tee "$RUNNER_TEMP/mpw-primary.json"
          python3 - "$RUNNER_TEMP/mpw-primary.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['result']=='MARKETPLACE_PAYMENTS_WALLET_GROUPED_ADOPTION_PRIMARY_PROOF_REVALIDATED_NOT_PRODUCT_PASS'
          assert d['paths']==49 and [x['paths'] for x in d['families']]==[21,24,4]
          assert d['dependent_blobs_verified']==23 and d['focused_test_files_bound']==13
          assert d['coverage_adopted'] is True
          q=d['primary_qualification']
          assert q['qualification_head']=='13f6933c543db98848450e063e61f8c0dd2fa3d3'
          assert q['workflow_run']==34283717767 and q['job']==102254287765
          assert q['focused_current_tests']['cases']==45 and q['focused_current_tests']['assertions']==444
          assert q['focused_current_tests']['failures']==q['focused_current_tests']['errors']==q['focused_current_tests']['skipped']==0
          print('49-path adopted primary/post-adoption evidence validation PASS; next gate: '+d['next_gate'])
          PY
      - name: Setup PHP 8.5.10
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, pcntl, gd
          tools: composer:v2
      - name: Install frozen Platform dependencies
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          : > .env
          php artisan config:clear --ansi
          mkdir -p "$RUNNER_TEMP/audit49-junit"
      - name: Run ordinary Marketplace/Payments/Wallet qualification
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test \
            tests/Feature/Marketplace/MarketplaceAuctionTerminalRecoveryConcurrencyTest.php \
            tests/Feature/Marketplace/MarketplaceIdempotencyTest.php \
            tests/Feature/Marketplace/MarketplaceModuleTest.php \
            tests/Feature/Marketplace/MarketplaceSettlementRecoveryTest.php \
            tests/Feature/Payments/PaymentAvailabilityTest.php \
            tests/Feature/Payments/PaymentEventCoreTest.php \
            tests/Feature/Payments/PaymentFoundationSurfaceTest.php \
            tests/Feature/Payments/PaymentPartialRefundIntegrityTest.php \
            tests/Unit/Payments/PaymentOrderStateMachineTest.php \
            --log-junit="$RUNNER_TEMP/audit49-junit/ordinary.xml"
      - name: Run real MariaDB Marketplace transfer integration
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test tests/Feature/Marketplace/CanaryCharacterTransferMariaDbIntegrationTest.php --log-junit="$RUNNER_TEMP/audit49-junit/marketplace-transfer.xml"
      - name: Run real MariaDB Marketplace transfer concurrency
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test tests/Feature/Marketplace/CanaryCharacterTransferConcurrencyMariaDbTest.php --log-junit="$RUNNER_TEMP/audit49-junit/marketplace-transfer-concurrency.xml"
      - name: Run real MariaDB payment-event concurrency
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test tests/Feature/Payments/PaymentEventConcurrencyMariaDbTest.php --log-junit="$RUNNER_TEMP/audit49-junit/payment-event-concurrency.xml"
      - name: Run real MariaDB partial-refund concurrency
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test tests/Feature/Payments/PaymentPartialRefundConcurrencyMariaDbTest.php --log-junit="$RUNNER_TEMP/audit49-junit/payment-refund-concurrency.xml"
      - name: Recount exact qualification JUnit results
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/audit49-junit" <<'PY'
          from pathlib import Path
          import json,sys,xml.etree.ElementTree as ET
          root=Path(sys.argv[1]); files=sorted(root.glob('*.xml'))
          expected_per_file={
              'marketplace-transfer-concurrency.xml': {'cases':1,'assertions':54,'failures':0,'errors':0,'skipped':0},
              'marketplace-transfer.xml': {'cases':2,'assertions':15,'failures':0,'errors':0,'skipped':0},
              'ordinary.xml': {'cases':40,'assertions':327,'failures':0,'errors':0,'skipped':0},
              'payment-event-concurrency.xml': {'cases':1,'assertions':23,'failures':0,'errors':0,'skipped':0},
              'payment-refund-concurrency.xml': {'cases':1,'assertions':25,'failures':0,'errors':0,'skipped':0},
          }
          if {p.name for p in files} != set(expected_per_file):
              raise SystemExit(f'JUnit file set drift: {[p.name for p in files]}')
          total={'test_files':13,'junit_files':len(files),'cases':0,'assertions':0,'failures':0,'errors':0,'skipped':0}
          identities=set(); per_file=[]
          for path in files:
              tree=ET.parse(path).getroot(); cases=tree.findall('.//testcase')
              row={'file':path.name,'cases':len(cases),'assertions':0,'failures':0,'errors':0,'skipped':0}
              for case in cases:
                  identity=(case.attrib.get('classname'),case.attrib.get('name'))
                  if not all(identity) or identity in identities:
                      raise SystemExit(f'duplicate/missing JUnit identity: {identity}')
                  identities.add(identity)
                  row['assertions']+=int(case.attrib.get('assertions','0'))
                  row['failures']+=len(case.findall('failure'))
                  row['errors']+=len(case.findall('error'))
                  row['skipped']+=len(case.findall('skipped'))
              actual={key:row[key] for key in ('cases','assertions','failures','errors','skipped')}
              if actual != expected_per_file[path.name]:
                  raise SystemExit(f'qualification per-file drift for {path.name}: {json.dumps(actual,sort_keys=True)}')
              for key in ('cases','assertions','failures','errors','skipped'):
                  total[key]+=row[key]
              per_file.append(row)
          expected_total={'test_files':13,'junit_files':5,'cases':45,'assertions':444,'failures':0,'errors':0,'skipped':0}
          if total != expected_total:
              raise SystemExit('qualification exact aggregate drift: '+json.dumps(total,sort_keys=True))
          print(json.dumps({'total':total,'junit':per_file},sort_keys=True))
          PY
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git -C audit diff --exit-code
          git -C evidence diff --exit-code
          git -C platform diff --exit-code

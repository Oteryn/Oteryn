name: Organization audit Platform Marketplace tests projected ledger (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-marketplace-tests-projected-ledger.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/organization-audit-20260907/collection-plan.json
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/coverage-review.tsv
      - docs/evidence/organization-audit-20260907/r3-platform-marketplace-tests-candidate.json
      - tools/audit/organization_audit.py
      - tools/audit/verify_report.py
      - tools/audit/verify_platform_marketplace_tests_group.py
      - tools/audit/test_verify_platform_marketplace_tests_group.py

permissions:
  contents: read

concurrency:
  group: audit-185-platform-marketplace-tests-projected-ledger
  cancel-in-progress: false

jobs:
  project-ledger:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualified audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact qualified candidate remains unadopted
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
          git diff --exit-code
          (cd tools/audit && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_verify_platform_marketplace_tests_group.py)
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools/audit')
          import verify_platform_marketplace_tests_group as v
          candidate=v.read_json(v.CANDIDATE)
          groups=v.read_json(v.GROUPS)
          v.validate_candidate_shape(candidate)
          v.validate_group_absence(groups)
          q=candidate['qualification']
          assert candidate['coverage_adopted'] is False
          assert q['qualification_head']=='f54e5b0640945d7a5f0a7c471ac81105436214ae'
          assert q['workflow_run']==34323945126 and q['job']==102376779500
          assert q['focused_current_tests']['cases']==17 and q['focused_current_tests']['assertions']==179
          assert q['focused_current_tests']['failures']==q['focused_current_tests']['errors']==q['focused_current_tests']['skipped']==0
          print('QUALIFIED_UNADOPTED_EXACT_PROOF_PASS')
          PY

      - name: Rebuild immutable source inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/organization_audit.py \
            --plan docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/audit-inventory"

      - name: Reproduce current canonical ledger before projection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_report.py \
            --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/current-ledger.csv"
          python3 - "$RUNNER_TEMP/current-ledger.csv" <<'PY'
          import csv,hashlib,sys
          from collections import Counter
          expected_paths={
              'tests/Feature/Marketplace/CanaryCharacterTransferConcurrencyMariaDbTest.php',
              'tests/Feature/Marketplace/CanaryCharacterTransferMariaDbIntegrationTest.php',
              'tests/Feature/Marketplace/MarketplaceAuctionTerminalRecoveryConcurrencyTest.php',
              'tests/Feature/Marketplace/MarketplaceIdempotencyTest.php',
              'tests/Feature/Marketplace/MarketplaceModuleTest.php',
              'tests/Feature/Marketplace/MarketplaceSettlementRecoveryTest.php',
          }
          raw=open(sys.argv[1],'rb').read()
          rows=list(csv.DictReader(raw.decode().splitlines()))
          counts=Counter(r['disposition'] for r in rows)
          digest=hashlib.sha256(raw).hexdigest()
          if len(rows)!=4325 or dict(counts)!={'DIRECT':221,'GROUPED':107,'UNVERIFIED':3997}:
              raise SystemExit(f'canonical pre-projection count drift: rows={len(rows)} counts={dict(counts)}')
          if digest!='742443fbcc7fba9a45e1c71bf4395e3b2fe4ced7ae527a38de6ef2c74cb49406':
              raise SystemExit('canonical pre-projection digest drift: '+digest)
          selected={r['path']:r for r in rows if r['repository_id']=='platform' and r['path'] in expected_paths}
          if set(selected)!=expected_paths or any(r['disposition']!='UNVERIFIED' for r in selected.values()):
              raise SystemExit('six Marketplace test paths are not exactly current UNVERIFIED rows')
          print('CURRENT_CANONICAL_LEDGER_PASS')
          PY

      - name: Build exact projected ledger with only six additional GROUPED paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/current-ledger.csv" "$RUNNER_TEMP/audit-inventory/inventories" "$RUNNER_TEMP/projected-ledger.csv" "$RUNNER_TEMP/projected-proof.json" <<'PY'
          import csv,hashlib,json,shutil,sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,'tools/audit')
          import verify_report as vr
          import verify_platform_marketplace_tests_group as mv

          current_path=Path(sys.argv[1]); inventory_dir=Path(sys.argv[2]); projected_path=Path(sys.argv[3]); proof_path=Path(sys.argv[4])
          report_path=Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json')
          doc=vr.read_json(report_path)
          base=report_path.parent/doc['evidence_directory']
          review=vr.read_tsv(base/'coverage-review.tsv')
          candidate=mv.read_json(mv.CANDIDATE)
          groups_doc=mv.read_json(mv.GROUPS)
          mv.validate_candidate_shape(candidate)
          mv.validate_group_absence(groups_doc)

          projected_group={
              'id':'PLATFORM-MARKETPLACE-TESTS-HISTORICAL-DIRECT-CARRYFORWARD',
              'repository':'platform',
              'disposition':'GROUPED',
              'path_prefix':mv.PREFIX,
              'expected_count':6,
              'depth':'GROUPED_REVALIDATED',
              'scope':'Historical direct-read evidence explicitly names every file in the exact six-file Marketplace test directory; frozen-current carry-forward is bounded by exact tree/path/blob identity and the bound 17-case/179-assertion all-green qualification including both real-MariaDB tests.',
              'limitations':'Projected bounded GROUPED carry-forward only. This does not establish production readiness, complete Marketplace/payment correctness, later-current-main status, provider remediation, or organization-wide audit completion.',
              'historical_evidence':{
                  'repository':'Oteryn/Oteryn-Platform',
                  'publication_commit':mv.EVIDENCE_COMMIT,
                  'publication_tree':mv.EVIDENCE_TREE,
                  'coverage_rules_path':mv.EVIDENCE_PATH,
                  'coverage_rules_blob':mv.EVIDENCE_BLOB,
                  'audited_main_sha':mv.HISTORICAL_COMMIT,
                  'audited_main_tree':mv.HISTORICAL_TREE,
                  'exact_statement':mv.EXACT_STATEMENT,
                  'pattern':mv.PREFIX+'**',
                  'count':6,
                  'basis':'immutable historical evidence explicitly names every file in the six-file Marketplace test directory',
              },
              'current_revalidation':{
                  'source_commit':mv.SOURCE_COMMIT,
                  'source_tree':mv.SOURCE_TREE,
                  'family_tree':mv.MARKETPLACE_TEST_TREE,
                  'changed_paths_under_group_prefix':0,
                  'historical_to_current_compare_status':'ahead',
                  'current_blobs':mv.EXPECTED_PATH_BLOBS,
                  'required_checks':list(mv.REQUIRED_CHECKS),
                  'focused_test_files':list(mv.FOCUSED_TEST_FILES),
              },
              'evaluation':{
                  'qualification_head':mv.PRIMARY_QUALIFICATION['qualification_head'],
                  'qualification_run':mv.PRIMARY_QUALIFICATION['workflow_run'],
                  'qualification_job':mv.PRIMARY_QUALIFICATION['job'],
                  'verifier_unit_tests':mv.PRIMARY_QUALIFICATION['verifier_unit_tests'],
                  'focused_current_tests':mv.PRIMARY_QUALIFICATION['focused_current_tests'],
                  'outcome':'PROJECTED_GROUPED_CARRY_FORWARD_NOT_YET_ADOPTED',
              },
          }

          tmp_base=Path(sys.argv[3]).parent/'projected-evidence'
          tmp_base.mkdir(parents=True,exist_ok=False)
          projected_doc={'schema_version':groups_doc['schema_version'],'groups':groups_doc['groups']+[projected_group]}
          if 'rejected_candidates' in groups_doc:
              projected_doc['rejected_candidates']=groups_doc['rejected_candidates']
          (tmp_base/'coverage-groups.json').write_text(json.dumps(projected_doc,indent=2,sort_keys=False)+'\n',encoding='utf-8')
          projected_groups=vr.load_groups(tmp_base,doc['repositories'])
          raw,grouped_counts=vr.build_ledger(doc,review,projected_groups,inventory_dir)
          projected_path.write_bytes(raw)

          current_rows=list(csv.DictReader(current_path.read_text(encoding='utf-8').splitlines()))
          projected_rows=list(csv.DictReader(raw.decode().splitlines()))
          if len(current_rows)!=len(projected_rows)!=4325:
              raise SystemExit('ledger row count drift')
          identity_keys=('repository_id','commit_sha','tree_sha','path','mode','object_sha')
          changed=set()
          expected_paths=set(mv.EXPECTED_PATH_BLOBS)
          for old,new in zip(current_rows,projected_rows):
              if any(old[k]!=new[k] for k in identity_keys):
                  raise SystemExit('ledger identity/order drift during projection')
              if old!=new:
                  changed.add((new['repository_id'],new['path']))
                  if old['disposition']!='UNVERIFIED' or new['disposition']!='GROUPED':
                      raise SystemExit('unexpected projection disposition transition')
          expected_changed={('platform',p) for p in expected_paths}
          if changed!=expected_changed:
              raise SystemExit(f'projection changed wrong rows: {sorted(changed ^ expected_changed)}')

          counts=Counter(r['disposition'] for r in projected_rows)
          expected_counts={'DIRECT':221,'GROUPED':113,'UNVERIFIED':3991}
          if len(projected_rows)!=4325 or dict(counts)!=expected_counts:
              raise SystemExit(f'projected ledger count drift: rows={len(projected_rows)} counts={dict(counts)}')
          digest=hashlib.sha256(raw).hexdigest()
          proof={
              'schema_version':1,
              'audit_head':'${{ github.event.pull_request.head.sha }}',
              'candidate_primary':{
                  'head':mv.PRIMARY_QUALIFICATION['qualification_head'],
                  'run':mv.PRIMARY_QUALIFICATION['workflow_run'],
                  'job':mv.PRIMARY_QUALIFICATION['job'],
                  'cases':17,
                  'assertions':179,
              },
              'source_rows':4325,
              'direct_paths':221,
              'grouped_paths':113,
              'unverified_paths':3991,
              'new_grouped_paths':sorted(expected_paths),
              'projected_ledger_sha256':digest,
          }
          proof_path.write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(proof,sort_keys=True))
          PY

      - name: Upload bounded projected ledger proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit185-marketplace-tests-projected-ledger-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/projected-proof.json
            ${{ runner.temp }}/projected-ledger.csv
          if-no-files-found: error
          retention-days: 1

      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code

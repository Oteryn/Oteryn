name: Organization audit bind account-character post-adoption proof (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-bind-account-character-post-adoption.yml

permissions:
  contents: write

concurrency:
  group: audit-185-bind-account-character-post-adoption
  cancel-in-progress: false

jobs:
  bind-post-adoption-proof:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROOF_HEAD: 3b05f71a331da8c06fd0f5d6a0557590004ce5c5
    steps:
      - name: Checkout exact binding trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Bind trigger parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PROOF_HEAD"
          mapfile -t changed < <(git diff --name-only "$PROOF_HEAD" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-bind-account-character-post-adoption.yml'

      - name: Persist exact post-adoption evidence and fail-closed bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from copy import deepcopy
          import json
          from pathlib import Path

          candidate_path = Path('docs/evidence/organization-audit-20260907/r3-platform-account-character-candidate.json')
          verifier_path = Path('tools/audit/verify_platform_account_character_group.py')
          test_path = Path('tools/audit/test_verify_platform_account_character_group.py')
          qualifier_path = Path('.github/workflows/organization-audit-platform-account-character-qualification.yml')
          index_path = Path('docs/evidence/organization-audit-20260907/verification-index.json')

          post = {
              'audit_head': '3b05f71a331da8c06fd0f5d6a0557590004ce5c5',
              'workflow_run': 34281059173,
              'job': 102245648440,
              'result': 'PASS',
              'canonical_group_state': 'ACCOUNT_CHARACTER_GROUPED_ADOPTION_REVALIDATED_NOT_PRODUCT_PASS',
              'verifier_unit_tests': 16,
              'focused_current_tests': {
                  'test_files': 15,
                  'cases': 86,
                  'assertions': 586,
                  'failures': 0,
                  'errors': 0,
                  'skipped': 0,
              },
              'php': '8.5.10',
              'mariadb': '11.8.9',
              'meta_ci_run': 34281059174,
              'meta_ci_result': 'SUCCESS',
              'ledger_reproduction_run': 34281059142,
              'ledger_reproduction_artifact': 10077605747,
              'ledger_sha256': 'b61566ad825adf528b177a5ab4a2ee533680bd948e44a60df6289255c5747459',
          }

          candidate = json.loads(candidate_path.read_text(encoding='utf-8'))
          if candidate.get('state') != 'QUALIFIED_ADOPTED_AS_GROUPED' or candidate.get('coverage_adopted') is not True:
              raise SystemExit('candidate is not in exact adopted state')
          if 'post_adoption_revalidation' in candidate:
              raise SystemExit('post-adoption evidence already present')
          candidate['post_adoption_revalidation'] = deepcopy(post)
          candidate_path.write_text(json.dumps(candidate, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          verifier = verifier_path.read_text(encoding='utf-8')
          anchor = "GROUP_SCOPE = (\n"
          if verifier.count(anchor) != 1:
              raise SystemExit('verifier GROUP_SCOPE anchor drift')
          post_literal = "POST_ADOPTION = " + repr(post) + "\n"
          verifier = verifier.replace(anchor, post_literal + anchor, 1)

          old = "        require(json_exact(qualification, PRIMARY_QUALIFICATION), 'candidate qualification must equal exact bound run/result')\n"
          new = old + "        require(json_exact(candidate.get('post_adoption_revalidation'), POST_ADOPTION), 'candidate post-adoption revalidation must equal exact bound run/result')\n"
          if verifier.count(old) != 1:
              raise SystemExit('verifier adopted anchor drift')
          verifier = verifier.replace(old, new, 1)

          old = "        require('qualification' not in candidate, 'pending candidate must not carry adoption qualification')\n"
          new = old + "        require('post_adoption_revalidation' not in candidate, 'pending candidate must not carry post-adoption revalidation')\n"
          if verifier.count(old) != 1:
              raise SystemExit('verifier pending anchor drift')
          verifier = verifier.replace(old, new, 1)

          old_result = "        result = 'ACCOUNT_CHARACTER_GROUPED_ADOPTION_PRIMARY_PROOF_REVALIDATED_NOT_PRODUCT_PASS'\n        next_gate = 'run exact-head adopted-state hosted requalification and bind that post-adoption run before cleanup'\n"
          new_result = "        result = 'ACCOUNT_CHARACTER_GROUPED_ADOPTION_REVALIDATED_NOT_PRODUCT_PASS'\n        next_gate = 'fresh independent exact-head review; retain temporary qualification evidence until review completes'\n"
          if verifier.count(old_result) != 1:
              raise SystemExit('verifier result anchor drift')
          verifier = verifier.replace(old_result, new_result, 1)
          verifier_path.write_text(verifier, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          old = "        data.pop('qualification', None)\n        return data\n"
          new = "        data.pop('qualification', None)\n        data.pop('post_adoption_revalidation', None)\n        return data\n"
          if tests.count(old) != 1:
              raise SystemExit('test pending fixture anchor drift')
          tests = tests.replace(old, new, 1)
          old = "        data['qualification'] = deepcopy(verifier.PRIMARY_QUALIFICATION)\n        return data\n"
          new = "        data['qualification'] = deepcopy(verifier.PRIMARY_QUALIFICATION)\n        data['post_adoption_revalidation'] = deepcopy(verifier.POST_ADOPTION)\n        return data\n"
          if tests.count(old) != 1:
              raise SystemExit('test adopted fixture anchor drift')
          tests = tests.replace(old, new, 1)
          insert_anchor = "    def test_adopted_missing_group_fails_closed(self):\n"
          post_test = "    def test_post_adoption_run_or_result_drift_fails_closed(self):\n        for key, value in (('workflow_run', 34281059172), ('job', 102245648439), ('meta_ci_run', 34281059173), ('ledger_reproduction_run', 34281059141), ('ledger_sha256', '0' * 64)):\n            data = self.adopted_fixture()\n            data['post_adoption_revalidation'][key] = value\n            with self.assertRaisesRegex(ValueError, 'post-adoption revalidation must equal exact bound run/result'):\n                verifier.validate_candidate_shape(data)\n\n"
          if tests.count(insert_anchor) != 1:
              raise SystemExit('test insertion anchor drift')
          tests = tests.replace(insert_anchor, post_test + insert_anchor, 1)
          test_path.write_text(tests, encoding='utf-8')

          qualifier = qualifier_path.read_text(encoding='utf-8')
          old = "ACCOUNT_CHARACTER_GROUPED_ADOPTION_PRIMARY_PROOF_REVALIDATED_NOT_PRODUCT_PASS"
          new = "ACCOUNT_CHARACTER_GROUPED_ADOPTION_REVALIDATED_NOT_PRODUCT_PASS"
          if qualifier.count(old) != 1:
              raise SystemExit('qualifier result anchor drift')
          qualifier_path.write_text(qualifier.replace(old, new, 1), encoding='utf-8')

          index = json.loads(index_path.read_text(encoding='utf-8'))
          row = index['r3_platform_account_character_qualification']
          row['post_adoption_head'] = post['audit_head']
          row['post_adoption_run'] = post['workflow_run']
          row['post_adoption_job'] = post['job']
          row['post_adoption_verifier_unit_tests'] = post['verifier_unit_tests']
          row['post_adoption_meta_ci_run'] = post['meta_ci_run']
          row['post_adoption_ledger_run'] = post['ledger_reproduction_run']
          row['post_adoption_ledger_artifact'] = post['ledger_reproduction_artifact']
          row['post_adoption_ledger_sha256'] = post['ledger_sha256']
          row['post_adoption_result'] = post['canonical_group_state']
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          (cd tools/audit && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_verify_platform_account_character_group.py)
          PYTHONDONTWRITEBYTECODE=1 python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            '.github/workflows/organization-audit-platform-account-character-qualification.yml'
            'docs/evidence/organization-audit-20260907/r3-platform-account-character-candidate.json'
            'docs/evidence/organization-audit-20260907/verification-index.json'
            'tools/audit/test_verify_platform_account_character_group.py'
            'tools/audit/verify_platform_account_character_group.py'
          )
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")

      - name: Publish one fast-forward evidence-binding commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/organization-audit-platform-account-character-qualification.yml \
            docs/evidence/organization-audit-20260907/r3-platform-account-character-candidate.json \
            docs/evidence/organization-audit-20260907/verification-index.json \
            tools/audit/test_verify_platform_account_character_group.py \
            tools/audit/verify_platform_account_character_group.py
          git commit -m 'docs(audit): bind account-character post-adoption evidence (#186)'
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"

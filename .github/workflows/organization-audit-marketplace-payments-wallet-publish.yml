name: Organization audit publish Marketplace-Payments-Wallet projection (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-marketplace-payments-wallet-publish.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: audit-185-publish-marketplace-payments-wallet
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECTION_ARTIFACT_ID: '10079131878'
      PROJECTION_HEAD: 895dd0e11a142d191fa367993a8a51b0e58906b1
    steps:
      - name: Checkout exact publication trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Bind trigger to validated projection parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PROJECTION_HEAD"
          mapfile -t changed < <(git diff --name-only "$PROJECTION_HEAD" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-marketplace-payments-wallet-publish.yml'
      - name: Download and verify exact projected package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROJECTION_ARTIFACT_ID" > "$meta"
          test "$(jq -r .id "$meta")" = "$PROJECTION_ARTIFACT_ID"
          test "$(jq -r .name "$meta")" = 'audit185-mpw-adoption-projection-34285102872'
          test "$(jq -r .expired "$meta")" = 'false'
          test "$(jq -r .workflow_run.head_sha "$meta")" = "$PROJECTION_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROJECTION_ARTIFACT_ID/zip" > "$RUNNER_TEMP/projection.zip"
          mkdir "$RUNNER_TEMP/projection"
          unzip -q "$RUNNER_TEMP/projection.zip" -d "$RUNNER_TEMP/projection"
          cd "$RUNNER_TEMP/projection"
          sha256sum -c SHA256SUMS
          mapfile -t actual < <(find . -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort)
          mapfile -t expected < <(awk '{print $2}' SHA256SUMS | LC_ALL=C sort)
          test "${#actual[@]}" -eq 9
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
      - name: Apply exact package and validate adopted accounting
        shell: bash
        run: |
          set -euo pipefail
          while read -r _ path; do cp "$RUNNER_TEMP/projection/$path" "$path"; done < "$RUNNER_TEMP/projection/SHA256SUMS"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/audit')
          import verify_platform_marketplace_payments_wallet_group as v
          c=v.read_json(v.CANDIDATE)
          assert v.validate_candidate_shape(c) is True
          v.validate_group_state(c,v.read_json(v.GROUPS),True)
          s=v.read_json('docs/evidence/organization-audit-20260907/coverage-summary.json')
          assert s['grouped_revalidated_paths']==107
          assert s['unverified_semantics_total']==3997
          assert s['ledger_sha256']=='742443fbcc7fba9a45e1c71bf4395e3b2fe4ced7ae527a38de6ef2c74cb49406'
          print('ADOPTED_MPW_CANONICAL_SHAPE_PASS')
          PY
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          mapfile -t expected < <(awk '{print $2}' "$RUNNER_TEMP/projection/SHA256SUMS" | LC_ALL=C sort)
          test "${#actual[@]}" -eq 9
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
      - name: Publish one fast-forward canonical adoption commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while read -r _ path; do git add -- "$path"; done < "$RUNNER_TEMP/projection/SHA256SUMS"
          git commit -m 'docs(audit): adopt qualified Platform Marketplace-Payments-Wallet groups (#186)'
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"

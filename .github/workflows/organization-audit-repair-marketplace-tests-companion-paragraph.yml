name: Organization audit repair Marketplace companion paragraph contract (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-repair-marketplace-tests-companion-paragraph.yml

permissions:
  contents: write

concurrency:
  group: audit-185-repair-marketplace-tests-companion-paragraph
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: a319c2b1266031eb31999a24ebf1ddff330ef049
      BRANCH: docs/20260907-org-comprehensive-audit
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require exact one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-repair-marketplace-tests-companion-paragraph.yml'

      - name: Bind exact companion paragraph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          markdown_path = Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md')
          verifier_path = Path('tools/audit/verify_platform_marketplace_tests_group.py')
          tests_path = Path('tools/audit/test_verify_platform_marketplace_tests_group.py')

          markdown = markdown_path.read_text(encoding='utf-8')
          verifier = verifier_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          gate = (
              'Post-adoption exact-head proof is complete and bound. The remaining gate for this six-path batch is fresh independent '
              'exact-head review of the current stable audit head; temporary qualifier and ledger workflows remain until that review completes.'
          )
          paragraphs = markdown.split('\n\n')
          matches = [p for p in paragraphs if gate in p]
          if len(matches) != 1:
              raise SystemExit('current companion paragraph containing gate missing/duplicated')
          paragraph = matches[0]
          if 'GROUPED is bounded semantic carry-forward, not product/security readiness.' not in paragraph:
              raise SystemExit('current bounded companion paragraph lost not-readiness limit')
          if 'ledger SHA-256 `25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617`.' not in paragraph:
              raise SystemExit('current bounded companion paragraph lost ledger binding')

          anchor = "STALE_COMPANION_GATE = 'Post-adoption exact-head proof and fresh independent review are still required.'\n"
          inserted = anchor + 'COMPANION_PARAGRAPH = ' + repr(paragraph) + '\n'
          if verifier.count(anchor) != 1 or 'COMPANION_PARAGRAPH = ' in verifier:
              raise SystemExit('companion paragraph constant anchor drift')
          verifier = verifier.replace(anchor, inserted, 1)

          old = """def validate_companion_report_text(text: str) -> None:\n    require(text.count(COMPANION_GATE) == 1, 'Marketplace-test companion Markdown gate missing/duplicated/drifted')\n    require(STALE_COMPANION_GATE not in text, 'Marketplace-test companion Markdown retains completed post-adoption gate')\n"""
          new = """def validate_companion_report_text(text: str) -> None:\n    paragraphs = text.split('\\n\\n')\n    require(paragraphs.count(COMPANION_PARAGRAPH) == 1, 'Marketplace-test companion Markdown bounded paragraph missing/duplicated/drifted')\n    require(text.count(COMPANION_GATE) == 1, 'Marketplace-test companion Markdown gate missing/duplicated/drifted')\n    require(STALE_COMPANION_GATE not in text, 'Marketplace-test companion Markdown retains completed post-adoption gate')\n"""
          if verifier.count(old) != 1:
              raise SystemExit('companion validator exact-paragraph anchor drift')
          verifier_path.write_text(verifier.replace(old, new, 1), encoding='utf-8')

          old = """        mutations = [\n            text.replace(verifier.COMPANION_GATE, verifier.STALE_COMPANION_GATE, 1),\n            text.replace(verifier.COMPANION_GATE, 'This batch establishes production readiness.', 1),\n            text + '\\n' + verifier.COMPANION_GATE + '\\n',\n        ]\n"""
          new = """        mutations = [\n            text.replace(verifier.COMPANION_GATE, verifier.STALE_COMPANION_GATE, 1),\n            text.replace(verifier.COMPANION_GATE, 'This batch establishes production readiness.', 1),\n            text.replace(verifier.COMPANION_GATE, verifier.COMPANION_GATE + ' This batch establishes production readiness.', 1),\n            text.replace(verifier.COMPANION_GATE, verifier.COMPANION_GATE + ' Organization-wide audit completion is established.', 1),\n            text + '\\n' + verifier.COMPANION_GATE + '\\n',\n        ]\n"""
          if tests.count(old) != 1:
              raise SystemExit('companion negative-control anchor drift')
          tests_path.write_text(tests.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m py_compile tools/audit/verify_platform_marketplace_tests_group.py tools/audit/test_verify_platform_marketplace_tests_group.py
          (cd tools/audit && python3 -m unittest -v test_verify_platform_marketplace_tests_group.py)
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            'tools/audit/test_verify_platform_marketplace_tests_group.py'
            'tools/audit/verify_platform_marketplace_tests_group.py'
          )
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")

      - name: Publish one fast-forward repair commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit/verify_platform_marketplace_tests_group.py tools/audit/test_verify_platform_marketplace_tests_group.py
          git commit -m 'test(audit): bind exact Marketplace companion paragraph (#186)'
          git push origin "HEAD:refs/heads/$BRANCH"

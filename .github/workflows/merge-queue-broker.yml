name: Oteryn Merge Queue Broker

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      repository:
        description: Exact approved Oteryn repository
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact qualified 40-hex PR head
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.target.outputs.allowed }}
      repository: ${{ steps.parse.outputs.repository }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      expected_head_sha: ${{ steps.parse.outputs.expected_head_sha }}
      request_actor: ${{ steps.parse.outputs.request_actor }}
    steps:
      - name: Parse exact broker request
        id: parse
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          DISPATCH_ACTOR: ${{ github.actor }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          candidate=false
          repository=''
          pr_number=''
          expected_head_sha=''
          request_actor=''

          if [[ "$EVENT_NAME" == issue_comment \
            && "$ISSUE_NUMBER" == 187 \
            && "$ISSUE_IS_PR" != true \
            && "$AUTHOR_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ \
            && -n "$COMMENT_ACTOR" \
            && "$COMMENT_BODY" =~ ^/oteryn-mq-enqueue\ (Oteryn/Oteryn|Oteryn/Oteryn-Game|Oteryn/Oteryn-Platform|Oteryn/Oteryn-Atlas)\ ([1-9][0-9]*)\ ([0-9a-f]{40})$ ]]; then
            repository="${BASH_REMATCH[1]}"
            pr_number="${BASH_REMATCH[2]}"
            expected_head_sha="${BASH_REMATCH[3]}"
            request_actor="$COMMENT_ACTOR"
            candidate=true
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$EVENT_REF" == refs/heads/main ]]; then
            repository="$INPUT_REPOSITORY"
            pr_number="$INPUT_PR_NUMBER"
            expected_head_sha="$INPUT_EXPECTED_HEAD_SHA"
            request_actor="$DISPATCH_ACTOR"
            if [[ "$repository" =~ ^Oteryn/(Oteryn|Oteryn-Game|Oteryn-Platform|Oteryn-Atlas)$ \
              && "$pr_number" =~ ^[1-9][0-9]*$ \
              && "$expected_head_sha" =~ ^[0-9a-f]{40}$ \
              && -n "$request_actor" ]]; then
              candidate=true
            fi
          fi

          {
            echo "candidate=$candidate"
            echo "repository=$repository"
            echo "pr_number=$pr_number"
            echo "expected_head_sha=$expected_head_sha"
            echo "request_actor=$request_actor"
          } >> "$GITHUB_OUTPUT"

      - name: Bind initiating actor to target integration authority
        id: target
        shell: bash
        env:
          CANDIDATE: ${{ steps.parse.outputs.candidate }}
          TARGET_REPOSITORY: ${{ steps.parse.outputs.repository }}
          REQUEST_ACTOR: ${{ steps.parse.outputs.request_actor }}
          MQ_TOKEN: ${{ secrets.OTERYN_MQ_TOKEN }}
        run: |
          set -euo pipefail
          allowed=false
          if [[ "$CANDIDATE" == true ]]; then
            if [[ -z "$MQ_TOKEN" ]]; then
              echo 'BLOCKED_CAPABILITY_UNAVAILABLE: OTERYN_MQ_TOKEN is not configured' >&2
            else
              export GH_TOKEN="$MQ_TOKEN"
              permission="$(gh api "repos/$TARGET_REPOSITORY/collaborators/$REQUEST_ACTOR/permission" --jq '.permission // empty')"
              if [[ "$permission" == admin || "$permission" == maintain ]]; then
                allowed=true
              else
                echo "BLOCKED_NOT_AUTHORIZED: actor $REQUEST_ACTOR lacks admin/maintain on $TARGET_REPOSITORY" >&2
              fi
            fi
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  enqueue:
    needs: authorize
    if: ${{ needs.authorize.outputs.allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: oteryn-mq-${{ needs.authorize.outputs.repository }}-${{ needs.authorize.outputs.pr_number }}
      cancel-in-progress: false
    env:
      TARGET_REPOSITORY: ${{ needs.authorize.outputs.repository }}
      TARGET_PR: ${{ needs.authorize.outputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.expected_head_sha }}
      REQUEST_ACTOR: ${{ needs.authorize.outputs.request_actor }}
      MQ_TOKEN: ${{ secrets.OTERYN_MQ_TOKEN }}
      META_TOKEN: ${{ github.token }}
    steps:
      - name: Require bounded mutation credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MQ_TOKEN" ]]; then
            echo 'BLOCKED_CAPABILITY_UNAVAILABLE: OTERYN_MQ_TOKEN is not configured' >&2
            exit 1
          fi

      - name: Fresh exact-target preflight
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN="$MQ_TOKEN"

          permission="$(gh api "repos/$TARGET_REPOSITORY/collaborators/$REQUEST_ACTOR/permission" --jq '.permission // empty')"
          [[ "$permission" == admin || "$permission" == maintain ]]

          pr_json="$(gh api "repos/$TARGET_REPOSITORY/pulls/$TARGET_PR")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          merged="$(jq -r '.merged' <<<"$pr_json")"
          base="$(jq -r '.base.ref' <<<"$pr_json")"
          head="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          [[ "$state" == open && "$draft" == false && "$merged" == false ]]
          [[ "$base" == main ]]
          [[ "$head" == "$EXPECTED_HEAD_SHA" ]]
          [[ "$head_repo" == "$TARGET_REPOSITORY" ]]

          required="$(gh pr checks "$TARGET_PR" --repo "$TARGET_REPOSITORY" --required --json name,state)"
          python3 - "$required" <<'PY'
          import json, sys
          rows = json.loads(sys.argv[1])
          if not rows:
              raise SystemExit('no required checks resolved for exact candidate')
          bad = [row for row in rows if row.get('state') != 'SUCCESS']
          if bad:
              raise SystemExit(f'required checks are not successful: {bad}')
          PY

          owner="${TARGET_REPOSITORY%%/*}"
          repo="${TARGET_REPOSITORY#*/}"
          threads="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated} pageInfo{hasNextPage}}}}}' \
            -f owner="$owner" -f repo="$repo" -F number="$TARGET_PR")"
          python3 - "$threads" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])['data']['repository']['pullRequest']['reviewThreads']
          if data['pageInfo']['hasNextPage']:
              raise SystemExit('review thread set exceeds bounded preflight')
          unresolved = [row for row in data['nodes'] if not row['isResolved'] and not row['isOutdated']]
          if unresolved:
              raise SystemExit(f'unresolved current review threads: {len(unresolved)}')
          PY

      - name: Submit native exact-head Merge Queue request
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          request_body="$(jq -cn --arg sha "$EXPECTED_HEAD_SHA" '{sha:$sha,merge_action:"merge_queue"}')"
          status="$(curl --silent --show-error \
            --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $MQ_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            --data "$request_body" \
            "https://api.github.com/repos/$TARGET_REPOSITORY/pulls/$TARGET_PR/merge-async")"

          if [[ "$status" == 202 ]]; then
            uuid="$(jq -r '.details.uuid // empty' "$body")"
            action="$(jq -r '.details.merge_action // empty' "$body")"
            head="$(jq -r '.details.expected_head_sha // empty' "$body")"
            [[ "$uuid" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "$action" == merge_queue ]]
            [[ "$head" == "$EXPECTED_HEAD_SHA" ]]

            attempt_id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${TARGET_REPOSITORY}:${TARGET_PR}"
            receipt_sequence=1
            receipt_observed_at="$(date +%s)"
            receipt="$(jq -cn \
              --arg event 'REQUEST_ACCEPTED_NON_TERMINAL' \
              --arg attempt_id "$attempt_id" \
              --arg repository "$TARGET_REPOSITORY" \
              --argjson pr_number "$TARGET_PR" \
              --arg base_ref main \
              --arg expected_head_sha "$EXPECTED_HEAD_SHA" \
              --arg merge_action merge_queue \
              --arg request_uuid "$uuid" \
              --argjson observed_at_epoch_seconds "$receipt_observed_at" \
              --argjson executor_sequence "$receipt_sequence" \
              '{event:$event,attempt_id:$attempt_id,repository:$repository,pr_number:$pr_number,base_ref:$base_ref,expected_head_sha:$expected_head_sha,merge_action:$merge_action,http_status:202,request_uuid:$request_uuid,observed_at_epoch_seconds:$observed_at_epoch_seconds,executor_sequence:$executor_sequence}')"
            echo "$receipt"
            python3 - "$GITHUB_STEP_SUMMARY" "$receipt" <<'PY'
          import os, sys
          path, record = sys.argv[1], sys.argv[2]
          with open(path, 'a', encoding='utf-8') as handle:
              handle.write(record + '\n')
              handle.flush()
              os.fsync(handle.fileno())
          PY

            export GH_TOKEN="$MQ_TOKEN"
            readback="$(gh api "repos/$TARGET_REPOSITORY/pulls/$TARGET_PR/merge-async/$uuid")"
            readback_status="$(jq -r '.status // empty' <<<"$readback")"
            [[ -n "$readback_status" ]]
            fresh="$(gh api "repos/$TARGET_REPOSITORY/pulls/$TARGET_PR")"
            readback_base="$(jq -r '.base.ref' <<<"$fresh")"
            readback_head="$(jq -r '.head.sha' <<<"$fresh")"
            readback_repo="$(jq -r '.head.repo.full_name' <<<"$fresh")"
            [[ "$readback_base" == main ]]
            [[ "$readback_head" == "$EXPECTED_HEAD_SHA" ]]
            [[ "$readback_repo" == "$TARGET_REPOSITORY" ]]

            observation_sequence=2
            observation_observed_at="$(date +%s)"
            (( observation_observed_at >= receipt_observed_at ))
            (( observation_sequence > receipt_sequence ))
            observation="$(jq -cn \
              --arg source live_post_submission_target_readback \
              --arg repository "$TARGET_REPOSITORY" \
              --argjson pr_number "$TARGET_PR" \
              --arg base_ref "$readback_base" \
              --arg pr_head_sha "$readback_head" \
              --arg accepted_request_uuid "$uuid" \
              --arg status "$readback_status" \
              --argjson observed_at_epoch_seconds "$observation_observed_at" \
              --argjson executor_sequence "$observation_sequence" \
              '{source:$source,repository:$repository,pr_number:$pr_number,base_ref:$base_ref,pr_head_sha:$pr_head_sha,accepted_request_uuid:$accepted_request_uuid,status:$status,observed_at_epoch_seconds:$observed_at_epoch_seconds,executor_sequence:$executor_sequence}')"
            echo "$observation"
            python3 - "$GITHUB_STEP_SUMMARY" "$observation" <<'PY'
          import os, sys
          path, record = sys.argv[1], sys.argv[2]
          with open(path, 'a', encoding='utf-8') as handle:
              handle.write(record + '\n')
              handle.flush()
              os.fsync(handle.fileno())
          PY

            echo "result=MQ_ACCEPTED" >> "$GITHUB_OUTPUT"
            echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
            echo "readback_status=$readback_status" >> "$GITHUB_OUTPUT"
            echo "receipt_sequence=$receipt_sequence" >> "$GITHUB_OUTPUT"
            echo "observation_sequence=$observation_sequence" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == 200 || "$status" == 409 ]]; then
            export GH_TOKEN="$MQ_TOKEN"
            fresh="$(gh api "repos/$TARGET_REPOSITORY/pulls/$TARGET_PR")"
            [[ "$(jq -r '.base.ref' <<<"$fresh")" == main ]]
            [[ "$(jq -r '.head.sha' <<<"$fresh")" == "$EXPECTED_HEAD_SHA" ]]
            echo "result=RECONCILE_REQUIRED" >> "$GITHUB_OUTPUT"
            echo 'uuid=' >> "$GITHUB_OUTPUT"
            echo "readback_status=http-$status" >> "$GITHUB_OUTPUT"
            echo 'receipt_sequence=' >> "$GITHUB_OUTPUT"
            echo 'observation_sequence=' >> "$GITHUB_OUTPUT"
          elif [[ "$status" == 403 || "$status" == 404 ]]; then
            echo "BLOCKED_CAPABILITY_UNAVAILABLE: merge-async returned HTTP $status" >&2
            cat "$body" >&2
            exit 1
          else
            echo "BLOCKED_NOT_ELIGIBLE: merge-async returned HTTP $status" >&2
            cat "$body" >&2
            exit 1
          fi

      - name: Publish non-secret receipt
        if: ${{ always() && steps.submit.outcome == 'success' }}
        shell: bash
        env:
          RESULT: ${{ steps.submit.outputs.result }}
          UUID: ${{ steps.submit.outputs.uuid }}
          READBACK_STATUS: ${{ steps.submit.outputs.readback_status }}
          RECEIPT_SEQUENCE: ${{ steps.submit.outputs.receipt_sequence }}
          OBSERVATION_SEQUENCE: ${{ steps.submit.outputs.observation_sequence }}
        run: |
          set -euo pipefail
          receipt="$RESULT $TARGET_REPOSITORY#$TARGET_PR $EXPECTED_HEAD_SHA"
          if [[ -n "$UUID" ]]; then
            receipt="$receipt $UUID receipt_seq=$RECEIPT_SEQUENCE observation_seq=$OBSERVATION_SEQUENCE readback=$READBACK_STATUS"
          fi
          echo "$receipt" >> "$GITHUB_STEP_SUMMARY"
          export GH_TOKEN="$META_TOKEN"
          gh issue comment 187 --repo Oteryn/Oteryn --body "$receipt"

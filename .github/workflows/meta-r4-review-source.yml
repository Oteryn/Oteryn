name: META R4 reviewed source preparation
on:
  push:
    branches: [verify/meta-r4-windows-20260907]
    paths: [.github/workflows/meta-r4-review-source.yml]
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d54e25f4f05cf7360af0cea00d3fdc553befc632
          persist-credentials: false
      - name: Install the candidate validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/governance/requirements-validation.txt
      - name: Verify and stage only two reviewed source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          API = 'https://api.github.com/repos/Oteryn/Oteryn'
          def api(path, body=None):
              if body is not None and path != '/git/trees':
                  raise ValueError('only source tree object publication is permitted')
              req = urllib.request.Request(API + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          patch_sha = '649b92acfda1d579a017bc601d3a623063af0be3'
          data = base64.b64decode(api('/git/blobs/' + patch_sha)['content'])
          assert blob(data) == patch_sha
          patch = json.loads(data)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == patch['base']
          assert patch['base_tree'] == 'dd489ee2280fb6d498ea9c98b0b1385d25c436a0'
          assert {f['path'] for f in patch['files']} == {
              'tools/governance/validate_release_manifests.py',
              'tools/governance/test_merge_queue_workflow_contract.py'}
          entries=[]
          for change in patch['files']:
              path=pathlib.Path(change['path']);old=path.read_bytes()
              assert blob(old) == change['old_blob']
              lines=old.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(change['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end]=replacement.splitlines(keepends=True)
              new=''.join(lines).encode()
              assert blob(new) == change['new_blob']
              path.write_bytes(new)
              entries.append({'path':str(path),'type':'blob','mode':'100644','content':new.decode()})
          subprocess.run(['git','add','--',*[e['path'] for e in entries]],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == patch['expected_tree'] == '080d84ef62075f9b140c36c0a4aaaf4aab8508ae'
          subprocess.run(['python3','tools/governance/test_merge_queue_workflow_contract.py'],check=True)
          staged=api('/git/trees',{'base_tree':patch['base_tree'],'tree':entries})
          assert staged['sha'] == tree
          print('REVIEWED_SOURCE_TREE=' + tree)
          PY

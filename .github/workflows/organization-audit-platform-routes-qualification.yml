name: Organization audit - Platform routes qualification

on:
  pull_request:
    paths:
      - 'docs/evidence/organization-audit-20260907/r3-platform-routes-direct-candidate.json'
      - 'tools/audit/verify_platform_routes_direct.py'
      - 'tools/audit/test_verify_platform_routes_direct.py'
      - '.github/workflows/organization-audit-platform-routes-qualification.yml'

permissions:
  contents: read

jobs:
  qualify-platform-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact META candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: meta

      - name: Checkout frozen Platform source read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: sodium
          tools: composer:v2

      - name: Verify exact candidate and frozen source
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s meta/tools/audit -p 'test_verify_platform_routes_direct.py' -v
          python3 meta/tools/audit/verify_platform_routes_direct.py --audit-root meta --platform-root platform

      - name: Parse all 19 frozen route files
        run: |
          mapfile -t files < <(git -C platform ls-tree -r --name-only HEAD routes)
          test "${#files[@]}" -eq 19
          for file in "${files[@]}"; do php -l "platform/$file"; done

      - name: Register the frozen application route set
        working-directory: platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan route:list --json > /tmp/platform-routes.json
          php -r '$r=json_decode(file_get_contents("/tmp/platform-routes.json"), true, 512, JSON_THROW_ON_ERROR); if (!is_array($r) || count($r) === 0) exit(1); echo "registered_routes=".count($r).PHP_EOL;'
          git diff --exit-code

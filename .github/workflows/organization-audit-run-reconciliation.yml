name: Organization audit run reconciliation (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-run-reconciliation.yml
      - tools/audit/apply_review3_atlas_reconciliation.py
permissions:
  contents: write
concurrency:
  group: audit-185-run-reconciliation
  cancel-in-progress: false
jobs:
  reconcile-once:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard one intended branch mutation
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Fq 'audit: reject Atlas grouped carry-forward and repair review3 evidence (#186)'; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - name: Apply and validate reconciliation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/apply_review3_atlas_reconciliation.py
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          node --test tools/audit/test-public-surface-contract.mjs tools/audit/test-public-surface-evidence-hardening.mjs
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
          git diff --check
      - name: Commit only docs/tools reconciliation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence tools/audit
          git commit -m 'audit: reject Atlas grouped carry-forward and repair review3 evidence (#186)'
          git push origin HEAD:refs/heads/docs/20260907-org-comprehensive-audit

name: Organization audit adopt Platform Marketplace tests (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-adopt-platform-marketplace-tests.yml

permissions:
  contents: write

concurrency:
  group: audit-185-adopt-platform-marketplace-tests
  cancel-in-progress: false

jobs:
  adopt:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: cdf49027f5af17c3377930889e1ed2f6cb5c074e
      BRANCH: docs/20260907-org-comprehensive-audit
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact adoption trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require exact one-file adoption trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-adopt-platform-marketplace-tests.yml'
          python3 -m py_compile tools/audit/adopt_platform_marketplace_tests.py
          (cd tools/audit && python3 -m unittest -v test_verify_platform_marketplace_tests_group.py)
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools/audit')
          import verify_platform_marketplace_tests_group as v
          c=v.read_json(v.CANDIDATE)
          v.validate_candidate_shape(c)
          v.validate_group_absence(v.read_json(v.GROUPS))
          assert c['coverage_adopted'] is False
          q=c['qualification']
          assert q['qualification_head']=='f54e5b0640945d7a5f0a7c471ac81105436214ae'
          assert q['workflow_run']==34323945126 and q['job']==102376779500
          assert q['focused_current_tests']['cases']==17 and q['focused_current_tests']['assertions']==179
          print('EXACT_PRE_ADOPTION_CONTRACT_PASS')
          PY
          git diff --check
          git diff --exit-code

      - name: Rebuild immutable source inventories once
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/organization_audit.py \
            --plan docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/audit-inventory"

      - name: Reproduce exact pre-adoption ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_report.py \
            --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/pre-ledger.csv"
          python3 - "$RUNNER_TEMP/pre-ledger.csv" <<'PY'
          import csv,hashlib,sys
          from collections import Counter
          expected={
              'tests/Feature/Marketplace/CanaryCharacterTransferConcurrencyMariaDbTest.php',
              'tests/Feature/Marketplace/CanaryCharacterTransferMariaDbIntegrationTest.php',
              'tests/Feature/Marketplace/MarketplaceAuctionTerminalRecoveryConcurrencyTest.php',
              'tests/Feature/Marketplace/MarketplaceIdempotencyTest.php',
              'tests/Feature/Marketplace/MarketplaceModuleTest.php',
              'tests/Feature/Marketplace/MarketplaceSettlementRecoveryTest.php',
          }
          raw=open(sys.argv[1],'rb').read(); rows=list(csv.DictReader(raw.decode().splitlines()))
          counts=Counter(r['disposition'] for r in rows); digest=hashlib.sha256(raw).hexdigest()
          assert len(rows)==4325 and dict(counts)=={'DIRECT':221,'GROUPED':107,'UNVERIFIED':3997}
          assert digest=='742443fbcc7fba9a45e1c71bf4395e3b2fe4ced7ae527a38de6ef2c74cb49406'
          selected={r['path']:r for r in rows if r['repository_id']=='platform' and r['path'] in expected}
          assert set(selected)==expected and all(r['disposition']=='UNVERIFIED' for r in selected.values())
          print('PRE_LEDGER_PASS')
          PY

      - name: Apply canonical six-path adoption mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/adopt_platform_marketplace_tests.py | tee "$RUNNER_TEMP/adoption-mutation.json"

      - name: Align accepted group scope to exact projected-ledger scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/evidence/organization-audit-20260907/coverage-groups.json')
          doc=json.loads(path.read_text(encoding='utf-8'))
          rows=[r for r in doc['groups'] if r.get('id')=='PLATFORM-MARKETPLACE-TESTS-HISTORICAL-DIRECT-CARRYFORWARD']
          assert len(rows)==1
          old=('Historical direct-read evidence explicitly names every file in the exact six-file Marketplace test directory; frozen-current carry-forward '
               'is bounded by exact tree/path/blob identity, the bound 17-case/179-assertion all-green qualification including both real-MariaDB tests, '
               'and exact projected-ledger reproduction.')
          projected=('Historical direct-read evidence explicitly names every file in the exact six-file Marketplace test directory; frozen-current carry-forward '
                     'is bounded by exact tree/path/blob identity and the bound 17-case/179-assertion all-green qualification including both real-MariaDB tests.')
          assert rows[0]['scope']==old
          rows[0]['scope']=projected
          path.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('PROJECTED_SCOPE_EXACTLY_RESTORED')
          PY

      - name: Reproduce exact post-adoption ledger and compare rows
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_report.py \
            --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            --inventory-dir "$RUNNER_TEMP/audit-inventory/inventories" \
            --ledger-output "$RUNNER_TEMP/post-ledger.csv"
          python3 - "$RUNNER_TEMP/pre-ledger.csv" "$RUNNER_TEMP/post-ledger.csv" <<'PY'
          import csv,hashlib,json,sys
          from collections import Counter
          expected={
              'tests/Feature/Marketplace/CanaryCharacterTransferConcurrencyMariaDbTest.php',
              'tests/Feature/Marketplace/CanaryCharacterTransferMariaDbIntegrationTest.php',
              'tests/Feature/Marketplace/MarketplaceAuctionTerminalRecoveryConcurrencyTest.php',
              'tests/Feature/Marketplace/MarketplaceIdempotencyTest.php',
              'tests/Feature/Marketplace/MarketplaceModuleTest.php',
              'tests/Feature/Marketplace/MarketplaceSettlementRecoveryTest.php',
          }
          pre=list(csv.DictReader(open(sys.argv[1],encoding='utf-8')))
          raw=open(sys.argv[2],'rb').read(); post=list(csv.DictReader(raw.decode().splitlines()))
          assert len(pre)==len(post)==4325
          identity=('repository_id','commit_sha','tree_sha','path','mode','object_sha')
          changed=set()
          for a,b in zip(pre,post):
              assert all(a[k]==b[k] for k in identity)
              if a!=b:
                  changed.add((b['repository_id'],b['path']))
                  assert a['disposition']=='UNVERIFIED' and b['disposition']=='GROUPED'
          assert changed=={('platform',p) for p in expected}
          counts=Counter(r['disposition'] for r in post); digest=hashlib.sha256(raw).hexdigest()
          assert dict(counts)=={'DIRECT':221,'GROUPED':113,'UNVERIFIED':3991}
          assert digest=='25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617'
          print(json.dumps({'result':'POST_ADOPTION_LEDGER_PASS','changed_rows':len(changed),'ledger_sha256':digest},sort_keys=True))
          PY

      - name: Verify exact canonical adoption records and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('docs/evidence/organization-audit-20260907')
          load=lambda p: json.loads(Path(p).read_text(encoding='utf-8'))
          c=load(base/'r3-platform-marketplace-tests-candidate.json')
          g=load(base/'coverage-groups.json')
          s=load(base/'coverage-summary.json')
          r=load('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json')
          i=load(base/'verification-index.json')
          assert c['state']=='QUALIFIED_ADOPTED_AS_GROUPED_PENDING_POST_ADOPTION_REVALIDATION' and c['coverage_adopted'] is True
          assert c['pre_adoption_revalidation']['workflow_run']==34329669372
          assert c['projected_ledger']['workflow_run']==34329669431
          assert c['projected_ledger']['ledger_sha256']=='25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617'
          rows=[x for x in g['groups'] if x.get('id')=='PLATFORM-MARKETPLACE-TESTS-HISTORICAL-DIRECT-CARRYFORWARD']
          assert len(rows)==1 and rows[0]['expected_count']==6
          assert rows[0]['scope'].endswith('including both real-MariaDB tests.')
          assert rows[0]['evaluation']['outcome']=='ADOPTED_GROUPED_CARRY_FORWARD_PENDING_POST_ADOPTION_REVALIDATION'
          p=s['per_repository']['platform']
          assert (p['direct_scoped'],p['grouped'],p['unverified_semantics'])==(156,113,1896)
          assert (s['grouped_revalidated_paths'],s['semantically_classified_paths'],s['unverified_semantics_total'])==(113,334,3991)
          assert s['ledger_sha256']=='25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617'
          assert r['revision'].endswith('CARRYFORWARD-113') and r['grouped_revalidated_paths']==113 and r['semantically_classified_paths']==334
          assert r['r3_platform_marketplace_tests_candidate'].endswith('r3-platform-marketplace-tests-candidate.json')
          ix=i['r3_platform_marketplace_tests_qualification']
          assert ix['primary_run']==34323945126 and ix['primary_job']==102376779500
          assert ix['qualification_binding_run']==34329383462 and ix['pre_adoption_run']==34329669372
          assert ix['projected_ledger_run']==34329669431 and ix['projected_ledger_artifact']==10095210015
          assert ix['projected_ledger_sha256']=='25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617'
          assert ix['post_adoption_status']=='PENDING'
          md=Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md').read_text(encoding='utf-8')
          assert '| platform | 2165 | 156 | 113 | 1896 |' in md
          assert '| **Total** | **4325** | **221** | **113** | **3991** |' in md
          assert '25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617' in md
          print('CANONICAL_ADOPTION_RECORDS_PASS')
          PY
          git diff --check
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            'docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json'
            'docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md'
            'docs/evidence/organization-audit-20260907/coverage-groups.json'
            'docs/evidence/organization-audit-20260907/coverage-summary.json'
            'docs/evidence/organization-audit-20260907/r3-platform-marketplace-tests-candidate.json'
            'docs/evidence/organization-audit-20260907/verification-index.json'
          )
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")

      - name: Publish one fast-forward canonical adoption commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$remote_head" = "${{ github.event.pull_request.head.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json \
            docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md \
            docs/evidence/organization-audit-20260907/coverage-groups.json \
            docs/evidence/organization-audit-20260907/coverage-summary.json \
            docs/evidence/organization-audit-20260907/r3-platform-marketplace-tests-candidate.json \
            docs/evidence/organization-audit-20260907/verification-index.json
          git commit -m 'docs(audit): adopt exact Marketplace test carry-forward (#186)'
          git push origin "HEAD:$BRANCH"

name: Organization audit adopt Platform Marketplace tests (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-adopt-platform-marketplace-tests.yml

permissions:
  contents: write

concurrency:
  group: audit-185-adopt-platform-marketplace-tests
  cancel-in-progress: false

jobs:
  adopt:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: 1999409a1205b7bdb5663a809992b9c44efd8dbb
      BRANCH: docs/20260907-org-comprehensive-audit
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact adoption trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Require exact one-file adoption trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/organization-audit-adopt-platform-marketplace-tests.yml'
          git diff --check
          git diff --exit-code

      - name: Checkout frozen Platform source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Platform audit publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: 3fe7df5330deb9ed38cc17ae1710f0cb4159019b
          path: evidence
          persist-credentials: false

      - name: Revalidate exact pre-adoption contract
        shell: bash
        run: |
          set -euo pipefail
          (cd tools/audit && python3 -m unittest -v test_verify_platform_marketplace_tests_group.py)
          python3 tools/audit/verify_platform_marketplace_tests_group.py --audit-root . --platform-root platform --evidence-root evidence > "$RUNNER_TEMP/pre-adoption.json"
          python3 - "$RUNNER_TEMP/pre-adoption.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['result']=='MARKETPLACE_TESTS_PRIMARY_QUALIFIED_NOT_ADOPTED'
          assert d['coverage_adopted'] is False
          assert d['paths']==6
          q=d['primary_qualification']
          assert q['workflow_run']==34323945126 and q['job']==102376779500
          assert q['focused_current_tests']['cases']==17 and q['focused_current_tests']['assertions']==179
          print('PRE_ADOPTION_CONTRACT_PASS')
          PY

      - name: Apply exact atomic adoption mutation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d > "$RUNNER_TEMP/adopt_marketplace_tests.py" <<'B64'

name: Organization audit evidence (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audit/organization_audit.py'
      - 'tools/audit/test_organization_audit.py'
      - 'docs/evidence/organization-audit-20260907/collection-plan.json'
      - '.github/workflows/organization-audit-evidence.yml'

permissions:
  contents: read

concurrency:
  group: organization-audit-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit collector candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify bounded collector
        run: python3 tools/audit/test_organization_audit.py -v

      - name: Collect immutable public source identities
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/organization_audit.py \
            --plan docs/evidence/organization-audit-20260907/collection-plan.json \
            --output "$RUNNER_TEMP/organization-audit-evidence" \
            --include-objects

      - name: Upload temporary read-only audit transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-audit-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/organization-audit-evidence
          retention-days: 3
          if-no-files-found: error

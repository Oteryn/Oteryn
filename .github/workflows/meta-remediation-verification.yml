name: META remediation workspace verification

# Temporary #154 verification. Removed from the final remediation tree.
on:
  push:
    branches: [fix/meta-audit-r4-20260907]
    paths: [.github/workflows/meta-remediation-verification.yml]
permissions:
  contents: read
jobs:
  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5f5c321864f7afe3261f49ab3c1fc207a388b402
          persist-credentials: false
      - name: Verify exact reviewed source tree
        shell: pwsh
        run: |
          $tree = git rev-parse HEAD`^{tree`}
          if ($tree -ne '14db51a8a66f01455c05879bb4ffc285de045f98') { throw 'Unexpected source tree' }
      - name: Run bounded harness with PATH-independent child interpreter
        run: python tools/governance/test_bounded_execution_guard.py

name: META remediation workspace verification

# Temporary implementation aid for #154; remove before final readiness.
on:
  push:
    branches: [fix/meta-audit-r4-20260907]
    paths: [.github/workflows/meta-remediation-verification.yml]

permissions:
  contents: read

jobs:
  exact-source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d0d5a54c5f06db9423d14b17e7f8eadefd15c6fb
          fetch-depth: 1
          persist-credentials: false
      - name: Export only tracked public sources and exact Git identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meta-remediation-source"
          git fetch --no-tags --depth=1 origin 697233ed2b0a6495e1c897be9b70ffc2d7ae3428 d835a4b934cbd0d31ed60fe7f62b0edc56795799
          for item in main:d0d5a54c5f06db9423d14b17e7f8eadefd15c6fb pr145:697233ed2b0a6495e1c897be9b70ffc2d7ae3428 pr151:d835a4b934cbd0d31ed60fe7f62b0edc56795799; do
            name="${item%%:*}"
            sha="${item#*:}"
            git archive --format=tar.gz "$sha" > "$RUNNER_TEMP/meta-remediation-source/$name.tar.gz"
            git ls-tree -r "$sha" > "$RUNNER_TEMP/meta-remediation-source/$name.tree.txt"
            git cat-file commit "$sha" > "$RUNNER_TEMP/meta-remediation-source/$name.commit.txt"
            printf '%s %s\n' "$name" "$sha"
          done
          python3 tools/governance/test_bounded_execution_guard.py 2>&1 | tee "$RUNNER_TEMP/meta-remediation-source/bounded-baseline.txt"
          cd "$RUNNER_TEMP/meta-remediation-source"
          sha256sum *.tar.gz *.tree.txt *.commit.txt bounded-baseline.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: meta-remediation-source-${{ github.sha }}
          path: ${{ runner.temp }}/meta-remediation-source/
          retention-days: 3
          if-no-files-found: error

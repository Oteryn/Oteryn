name: Organization audit review4 qualification (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-review4-qualification.yml
      - docs/evidence/**
      - tools/audit/**
permissions:
  contents: read
  actions: read
concurrency:
  group: audit-185-review4-qualification
  cancel-in-progress: false
jobs:
  exact-head-review4:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Atlas
          ref: f00815858bb5b031c502ad19fb96a05ff66b4d84
          path: atlas-current
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Atlas
          ref: 0f62cba3fdbb56af0a01ae7c0b4587b66d1923fc
          path: atlas-evidence
          persist-credentials: false
      - name: Verify identities and static cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C atlas-current rev-parse HEAD)" = f00815858bb5b031c502ad19fb96a05ff66b4d84
          test "$(git -C atlas-evidence rev-parse HEAD)" = 0f62cba3fdbb56af0a01ae7c0b4587b66d1923fc
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C atlas-current diff --exit-code
          git -C atlas-evidence diff --exit-code
      - name: Run all audit unit and adversarial tests
        working-directory: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          node --test tools/audit/test-public-surface-contract.mjs tools/audit/test-public-surface-evidence-hardening.mjs
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - name: Reproduce rejected Atlas candidate as identity-only evidence
        working-directory: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_atlas_group.py --audit-root . --atlas-root ../atlas-current --evidence-root ../atlas-evidence > "$RUNNER_TEMP/atlas-rejected.json"
          python3 - "$RUNNER_TEMP/atlas-rejected.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['result']=='REJECTED_GROUP_IDENTITY_REPRODUCED_NOT_SEMANTIC_COVERAGE'
          assert d['candidate_paths']==508
          assert d['consumer_tests']=={'passed':4,'failed':1}
          assert d['semantic_carry_forward'] is False
          assert d['adopted_grouped_coverage'] is False
          print('Rejected Atlas candidate remains identity-only; no GROUPED coverage adopted.')
          PY
      - name: Recheck full inventory ledger and six public native archives
        working-directory: audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-artifact" "$RUNNER_TEMP/native"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10033995995/zip" > "$RUNNER_TEMP/source-artifact.zip"
          unzip -q "$RUNNER_TEMP/source-artifact.zip" -d "$RUNNER_TEMP/source-artifact"
          while IFS=' ' read -r id file; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/native/$file"
          done <<'EOF'
          10035282589 audit185-r3-platform-php.zip
          10035263247 audit185-r3-platform-gateway.zip
          10035749457 audit185-r3-concurrency.zip
          10035760115 audit185-r3-public-ui.zip
          10043048175 audit185-r3-public-ui-corrected.zip
          10043441892 audit185-r3-ci-metadata.zip
          EOF
          INV="$(python3 - "$RUNNER_TEMP/source-artifact" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); names={'meta.json','game.json','platform.json','atlas.json','migration_archive.json'}
          hits=[p.parent for p in root.rglob('meta.json') if all((p.parent/n).is_file() for n in names)]
          if len(hits)!=1: raise SystemExit(f'expected one inventory directory, got {hits}')
          print(hits[0])
          PY
          )"
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json --inventory-dir "$INV" --ledger-output "$RUNNER_TEMP/ledger.csv" | tee "$RUNNER_TEMP/accounting.json"
          python3 tools/audit/verify_r3_evidence.py --manifest docs/evidence/organization-audit-20260907/r3-native-manifest.json --archive-dir "$RUNNER_TEMP/native" > "$RUNNER_TEMP/native.json"
          python3 - "$RUNNER_TEMP/accounting.json" "$RUNNER_TEMP/native.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding='utf-8'));n=json.load(open(sys.argv[2],encoding='utf-8'))
          assert a['findings']==78 and a['source_leaves']==4325
          assert a['scoped_review_paths']==202 and a['grouped_revalidated_paths']==0 and a['unverified_semantics']==4123
          assert a['tree_and_ledger_verified'] is True
          assert n['ui_cases']==48 and n['ci']['runs']==84 and n['ci']['jobs']==418
          print('Complete ledger and strict native evidence recount PASS.')
          PY
          git diff --exit-code

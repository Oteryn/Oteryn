name: Organization audit review2 qualification (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-review2-qualification.yml
      - tools/audit/**
      - docs/evidence/organization-audit-20260907/**
permissions:
  contents: read
concurrency:
  group: audit-185-review2-qualification
  cancel-in-progress: false
jobs:
  exact-head-review2:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: provider
          persist-credentials: false
      - name: Verify exact identities and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C provider rev-parse HEAD)" = de917b3477a1de0667531380de3660e8b2ab59aa
          test "$(git -C provider rev-parse HEAD^{tree})" = ffdf2a286d3a39f2344cf2ff53b28e4ef7369a8e
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C provider diff --exit-code
      - name: Run current audit unit and adversarial suites
        working-directory: audit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/audit -p 'test_*.py' -v
          node --test tools/audit/test-public-surface-contract.mjs tools/audit/test-public-surface-evidence-hardening.mjs
          python3 tools/audit/verify_report.py --report docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - name: Reproduce F17 and require exact committed evidence map
        working-directory: audit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_announcement_trigger.py --source-root ../provider > "$RUNNER_TEMP/f17.json"
          python3 - "$RUNNER_TEMP/f17.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['finding']=='PLATFORM-F17'
          assert d['verdict']=='STATIC_DEDICATED_WORKFLOW_FALSE_NEGATIVE'
          assert len(d['cases'])==8
          print('F17 exact source recount equals committed trigger evidence map.')
          PY
      - name: Reproduce routing finding into exclusive new output
        working-directory: audit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/reproduce_platform_routing.py --source-root ../provider --output "$RUNNER_TEMP/routing.json"
          test -s "$RUNNER_TEMP/routing.json"
          python3 - "$RUNNER_TEMP/routing.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['false_negative_count']==2
          assert d['product_result']=='FAIL_FOR_TWO_ROUTING_CASES'
          PY
          git diff --exit-code

name: Merge Queue Submission Preflight Reusable

on:
  workflow_call:
    inputs:
      command_body:
        required: true
        type: string
      author_association:
        required: true
        type: string
      comment_author_login:
        required: true
        type: string
      control_repository:
        required: true
        type: string
      control_issue_number:
        required: true
        type: number
      trigger_comment_id:
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  preflight:
    name: Protected organization MQ preflight
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact target PR and live Merge Queue
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ inputs.command_body }}
          AUTHOR_ASSOCIATION: ${{ inputs.author_association }}
          COMMENT_AUTHOR_LOGIN: ${{ inputs.comment_author_login }}
          CONTROL_REPOSITORY: ${{ inputs.control_repository }}
          CONTROL_ISSUE_NUMBER: ${{ inputs.control_issue_number }}
          TRIGGER_COMMENT_ID: ${{ inputs.trigger_comment_id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || 0 }}
          EVENT_COMMENT_ID: ${{ github.event.comment.id || 0 }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body || '' }}
          EVENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          EVENT_COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login || '' }}
          EVENT_HAS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          COMMAND_BODY = os.environ["COMMAND_BODY"]
          AUTHOR_ASSOCIATION = os.environ["AUTHOR_ASSOCIATION"]
          COMMENT_AUTHOR_LOGIN = os.environ["COMMENT_AUTHOR_LOGIN"]
          CONTROL_REPOSITORY = os.environ["CONTROL_REPOSITORY"]
          CONTROL_ISSUE_NUMBER = int(os.environ["CONTROL_ISSUE_NUMBER"])
          COMMENT_ID = int(os.environ["TRIGGER_COMMENT_ID"])
          RUN_ID = int(os.environ["WORKFLOW_RUN_ID"])
          RUN_ATTEMPT = int(os.environ["WORKFLOW_RUN_ATTEMPT"])
          WORKFLOW_SHA = os.environ["WORKFLOW_SHA"]
          EVENT_NAME = os.environ["EVENT_NAME"]
          EVENT_REPOSITORY = os.environ["EVENT_REPOSITORY"]
          EVENT_ISSUE_NUMBER = int(os.environ["EVENT_ISSUE_NUMBER"])
          EVENT_COMMENT_ID = int(os.environ["EVENT_COMMENT_ID"])
          EVENT_COMMENT_BODY = os.environ["EVENT_COMMENT_BODY"]
          EVENT_AUTHOR_ASSOCIATION = os.environ["EVENT_AUTHOR_ASSOCIATION"]
          EVENT_COMMENT_AUTHOR_LOGIN = os.environ["EVENT_COMMENT_AUTHOR_LOGIN"]
          EVENT_HAS_PR = os.environ["EVENT_HAS_PR"]

          CONTROL_REPOSITORY_EXPECTED = "Oteryn/Oteryn"
          CONTROL_ISSUE_EXPECTED = 189
          ALLOWED_TARGETS = {
              "Oteryn/Oteryn",
              "Oteryn/Oteryn-Game",
              "Oteryn/Oteryn-Platform",
              "Oteryn/Oteryn-Atlas",
          }
          ALLOWED_ASSOCIATIONS = {"OWNER", "MEMBER", "COLLABORATOR"}
          ALLOWED_PERMISSIONS = {"write", "maintain", "admin"}
          PROOF_AUTHOR = "github-actions[bot]"
          COMMAND_RE = re.compile(
              r"^/oteryn-mq-preflight "
              r"([A-Za-z0-9][A-Za-z0-9._:-]{15,127}) "
              r"(Oteryn/(?:Oteryn|Oteryn-Game|Oteryn-Platform|Oteryn-Atlas)) "
              r"([1-9][0-9]*) "
              r"([0-9a-f]{40})$"
          )
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          MAX_AGE_SECONDS = 30

          def request_json(url, *, method="GET", payload=None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "oteryn-mq-preflight",
              }
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API {method} {url} failed: HTTP {exc.code}: {body[:500]}") from exc

          if (
              EVENT_NAME != "issue_comment"
              or EVENT_HAS_PR != "false"
              or EVENT_REPOSITORY != CONTROL_REPOSITORY_EXPECTED
              or CONTROL_REPOSITORY != CONTROL_REPOSITORY_EXPECTED
              or EVENT_ISSUE_NUMBER != CONTROL_ISSUE_EXPECTED
              or CONTROL_ISSUE_NUMBER != CONTROL_ISSUE_EXPECTED
              or EVENT_COMMENT_ID != COMMENT_ID
              or EVENT_COMMENT_BODY != COMMAND_BODY
              or EVENT_AUTHOR_ASSOCIATION != AUTHOR_ASSOCIATION
              or EVENT_COMMENT_AUTHOR_LOGIN != COMMENT_AUTHOR_LOGIN
          ):
              raise SystemExit("preflight inputs are not bound to META control Issue #189")
          if AUTHOR_ASSOCIATION not in ALLOWED_ASSOCIATIONS:
              raise SystemExit(f"comment author association is not authorized: {AUTHOR_ASSOCIATION!r}")
          if COMMENT_ID < 1 or RUN_ID < 1 or RUN_ATTEMPT < 1 or SHA_RE.fullmatch(WORKFLOW_SHA) is None:
              raise SystemExit("numeric/workflow preflight identity is invalid")

          actor = urllib.parse.quote(COMMENT_AUTHOR_LOGIN, safe="")
          permission = request_json(
              f"https://api.github.com/repos/{CONTROL_REPOSITORY_EXPECTED}/collaborators/{actor}/permission"
          )
          effective_permission = permission.get("permission") if isinstance(permission, dict) else None
          if effective_permission not in ALLOWED_PERMISSIONS:
              raise SystemExit(
                  "comment author lacks current write/maintain/admin permission on META control repository: "
                  f"{COMMENT_AUTHOR_LOGIN!r} -> {effective_permission!r}"
              )

          command_match = COMMAND_RE.fullmatch(COMMAND_BODY.strip())
          if command_match is None:
              raise SystemExit(
                  "preflight command must be exactly: "
                  "/oteryn-mq-preflight <attempt_id> <owner/repo> <pr_number> <40-char-head-sha>"
              )
          attempt_id, target_repository, pr_number_raw, expected_head_sha = command_match.groups()
          if target_repository not in ALLOWED_TARGETS:
              raise SystemExit("target repository is outside the Oteryn Merge Queue preflight allowlist")
          pr_number = int(pr_number_raw)

          pr = request_json(f"https://api.github.com/repos/{target_repository}/pulls/{pr_number}")
          if pr.get("state") != "open" or pr.get("draft") is not False:
              raise SystemExit("target PR must be open and non-draft")
          base = pr.get("base") or {}
          head = pr.get("head") or {}
          base_repo = base.get("repo") or {}
          head_repo = head.get("repo") or {}
          base_ref = base.get("ref")
          live_head_sha = head.get("sha")
          if (
              base_repo.get("full_name") != target_repository
              or head_repo.get("full_name") != target_repository
          ):
              raise SystemExit("preflight supports same-repository Oteryn PRs only")
          if base_ref != "main":
              raise SystemExit(f"target PR base must be main, got {base_ref!r}")
          if live_head_sha != expected_head_sha:
              raise SystemExit(
                  f"target PR head moved: expected {expected_head_sha}, live {live_head_sha}"
              )

          owner, name = target_repository.split("/", 1)
          queue_query = """
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              mergeQueue {
                id
                resourcePath
                url
              }
            }
          }
          """
          queue_payload = request_json(
              "https://api.github.com/graphql",
              method="POST",
              payload={"query": queue_query, "variables": {"owner": owner, "name": name}},
          )
          if queue_payload.get("errors"):
              raise SystemExit(f"GraphQL merge-queue query failed: {queue_payload['errors']}")
          repository_data = (queue_payload.get("data") or {}).get("repository") or {}
          queue = repository_data.get("mergeQueue")
          if not isinstance(queue, dict):
              raise SystemExit("target repository does not currently expose a Merge Queue")
          queue_id = queue.get("id")
          resource_path = queue.get("resourcePath")
          url = queue.get("url")
          expected_resource_path = f"/{target_repository}/queue/{base_ref}"
          expected_url = f"https://github.com{expected_resource_path}"
          if not isinstance(queue_id, str) or not queue_id.startswith("MQ_"):
              raise SystemExit("Merge Queue id is missing or invalid")
          if resource_path != expected_resource_path or url != expected_url:
              raise SystemExit(
                  "Merge Queue identity does not bind the exact target repository/base: "
                  f"resourcePath={resource_path!r}, url={url!r}"
              )

          placeholder = request_json(
              f"https://api.github.com/repos/{CONTROL_REPOSITORY}/issues/{CONTROL_ISSUE_NUMBER}/comments",
              method="POST",
              payload={"body": f"OTERYN_MQ_PREFLIGHT_PENDING {attempt_id}"},
          )
          proof_comment_id = placeholder.get("id") if isinstance(placeholder, dict) else None
          proof_author = ((placeholder.get("user") or {}).get("login")) if isinstance(placeholder, dict) else None
          if not isinstance(proof_comment_id, int) or proof_comment_id < 1 or proof_author != PROOF_AUTHOR:
              raise SystemExit(
                  "GitHub did not create the proof comment as github-actions[bot]: "
                  f"id={proof_comment_id!r}, author={proof_author!r}"
              )

          observed_at = int(time.time())
          observation_id = f"mq-preflight-{RUN_ID}-{RUN_ATTEMPT}-{COMMENT_ID}"
          proof = {
              "schema_version": 1,
              "attempt_id": attempt_id,
              "observation_id": observation_id,
              "source": "protected_meta_control_preflight",
              "control_repository": CONTROL_REPOSITORY,
              "control_issue_number": CONTROL_ISSUE_NUMBER,
              "repository": target_repository,
              "pr_number": pr_number,
              "base_ref": base_ref,
              "pr_head_sha": live_head_sha,
              "merge_queue_required": True,
              "queue_id": queue_id,
              "resource_path": resource_path,
              "url": url,
              "trigger_comment_id": COMMENT_ID,
              "proof_comment_id": proof_comment_id,
              "proof_comment_author_login": proof_author,
              "workflow_run_id": RUN_ID,
              "workflow_run_attempt": RUN_ATTEMPT,
              "workflow_sha": WORKFLOW_SHA,
              "observed_at_epoch_seconds": observed_at,
              "expires_at_epoch_seconds": observed_at + MAX_AGE_SECONDS,
          }
          canonical = json.dumps(proof, sort_keys=True, separators=(",", ":"))
          comment_body = "OTERYN_MQ_PREFLIGHT_V1\n```json\n" + canonical + "\n```"
          updated = request_json(
              f"https://api.github.com/repos/{CONTROL_REPOSITORY}/issues/comments/{proof_comment_id}",
              method="PATCH",
              payload={"body": comment_body},
          )
          updated_id = updated.get("id") if isinstance(updated, dict) else None
          updated_author = ((updated.get("user") or {}).get("login")) if isinstance(updated, dict) else None
          if updated_id != proof_comment_id or updated_author != PROOF_AUTHOR or updated.get("body") != comment_body:
              raise SystemExit("GitHub proof comment readback does not match the authenticated proof")
          print("OTERYN_MQ_PREFLIGHT_V1=" + canonical)
          print(f"OTERYN_MQ_PREFLIGHT_PROOF_COMMENT_ID={proof_comment_id}")
          PY

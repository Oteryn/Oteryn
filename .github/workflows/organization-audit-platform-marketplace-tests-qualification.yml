name: Organization audit Platform Marketplace tests qualification (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-platform-marketplace-tests-qualification.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/coverage-summary.json
      - docs/evidence/organization-audit-20260907/r3-platform-marketplace-tests-candidate.json
      - docs/evidence/organization-audit-20260907/verification-index.json
      - tools/audit/verify_platform_marketplace_tests_group.py
      - tools/audit/test_verify_platform_marketplace_tests_group.py

permissions:
  contents: read

concurrency:
  group: audit-185-platform-marketplace-tests-qualification
  cancel-in-progress: false

jobs:
  qualify-marketplace-tests:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: oteryn-audit6-root
          MARIADB_DATABASE: oteryn_audit6
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: oteryn_audit6
      DB_USERNAME: root
      DB_PASSWORD: oteryn-audit6-root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CANARY_CHARACTER_CREATE_INTEGRATION_HOST: 127.0.0.1
      CANARY_CHARACTER_CREATE_INTEGRATION_PORT: '3306'
      CANARY_CHARACTER_CREATE_INTEGRATION_ROOT_PASSWORD: oteryn-audit6-root
    steps:
      - name: Checkout exact adopted audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
      - name: Checkout frozen Platform source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: de917b3477a1de0667531380de3660e8b2ab59aa
          path: platform
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable Platform audit publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: 3fe7df5330deb9ed38cc17ae1710f0cb4159019b
          path: evidence
          persist-credentials: false
      - name: Verify exact coordinates and clean trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C platform rev-parse HEAD)" = de917b3477a1de0667531380de3660e8b2ab59aa
          test "$(git -C platform rev-parse HEAD^{tree})" = ffdf2a286d3a39f2344cf2ff53b28e4ef7369a8e
          test "$(git -C evidence rev-parse HEAD)" = 3fe7df5330deb9ed38cc17ae1710f0cb4159019b
          test "$(git -C evidence rev-parse HEAD^{tree})" = c6ac8cb7cbff069d7ac7303b3472d992da254774
          git -C audit diff --check
          git -C audit diff --exit-code
          git -C platform diff --exit-code
          git -C evidence diff --exit-code
      - name: Run exact adopted verifier unit tests
        working-directory: audit/tools/audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v test_verify_platform_marketplace_tests_group.py
      - name: Revalidate exact adopted records and immutable identities
        working-directory: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/verify_platform_marketplace_tests_group.py --audit-root . --platform-root ../platform --evidence-root ../evidence | tee "$RUNNER_TEMP/marketplace-tests-adopted.json"
          python3 - "$RUNNER_TEMP/marketplace-tests-adopted.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['result']=='MARKETPLACE_TESTS_GROUPED_ADOPTION_PRIMARY_PROOF_REVALIDATED_NOT_PRODUCT_PASS'
          assert d['paths']==6 and d['path_blobs_verified']==6 and d['focused_test_files_bound']==6
          assert d['coverage_adopted'] is True
          assert d['ledger_sha256']=='25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617'
          q=d['primary_qualification']
          assert q['qualification_head']=='f54e5b0640945d7a5f0a7c471ac81105436214ae'
          assert q['workflow_run']==34323945126 and q['job']==102376779500
          assert q['focused_current_tests']['cases']==17 and q['focused_current_tests']['assertions']==179
          assert d['pre_adoption_revalidation']['workflow_run']==34329669372
          assert d['projected_ledger']['workflow_run']==34329669431
          p=d['post_adoption_revalidation']
          assert p['audit_head']=='c67c1e9d7622612affdd431b2af9fae05d0d11ef'
          assert p['workflow_run']==34333058684 and p['job']==102405922454
          assert p['verifier_unit_tests']==14 and p['focused_current_tests']['cases']==17 and p['focused_current_tests']['assertions']==179
          assert p['meta_ci_run']==34333058582 and p['meta_ci_result']=='SUCCESS'
          assert p['ledger_reproduction_run']==34333058620 and p['ledger_reproduction_job']==102405921741
          assert p['ledger_reproduction_artifact']==10096546256
          assert p['ledger_sha256']=='25ed5eb371279fbdb16a50263637856a3bc409b775387555efdaa17cebdc3617'
          assert p['ledger_counts']=={'source_rows':4325,'direct_paths':221,'grouped_paths':113,'unverified_paths':3991}
          assert d['next_gate']=='fresh independent exact-head review; retain temporary qualifier and ledger workflows until review completes'
          print(d['next_gate'])
          PY
      - name: Setup PHP 8.5.10
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.10'
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, pcntl, gd
          tools: composer:v2
      - name: Install frozen Platform dependencies
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          : > .env
          php artisan config:clear --ansi
          mkdir -p "$RUNNER_TEMP/audit6-junit"
      - name: Run four ordinary Marketplace tests
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test \
            tests/Feature/Marketplace/MarketplaceAuctionTerminalRecoveryConcurrencyTest.php \
            tests/Feature/Marketplace/MarketplaceIdempotencyTest.php \
            tests/Feature/Marketplace/MarketplaceModuleTest.php \
            tests/Feature/Marketplace/MarketplaceSettlementRecoveryTest.php \
            --log-junit="$RUNNER_TEMP/audit6-junit/ordinary.xml"
      - name: Run real MariaDB transfer integration
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test tests/Feature/Marketplace/CanaryCharacterTransferMariaDbIntegrationTest.php --log-junit="$RUNNER_TEMP/audit6-junit/transfer.xml"
      - name: Run real MariaDB transfer concurrency
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          php artisan test tests/Feature/Marketplace/CanaryCharacterTransferConcurrencyMariaDbTest.php --log-junit="$RUNNER_TEMP/audit6-junit/transfer-concurrency.xml"
      - name: Recount exact qualification JUnit results
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/audit6-junit" <<'PY'
          from pathlib import Path
          import json,sys,xml.etree.ElementTree as ET
          root=Path(sys.argv[1]); files=sorted(root.glob('*.xml'))
          expected={
              'ordinary.xml': {'cases':14,'assertions':110,'failures':0,'errors':0,'skipped':0},
              'transfer-concurrency.xml': {'cases':1,'assertions':54,'failures':0,'errors':0,'skipped':0},
              'transfer.xml': {'cases':2,'assertions':15,'failures':0,'errors':0,'skipped':0},
          }
          if {p.name for p in files} != set(expected):
              raise SystemExit(f'JUnit file set drift: {[p.name for p in files]}')
          total={'test_files':6,'junit_files':3,'cases':0,'assertions':0,'failures':0,'errors':0,'skipped':0}
          identities=set(); per_file=[]
          for path in files:
              cases=ET.parse(path).getroot().findall('.//testcase')
              row={'file':path.name,'cases':len(cases),'assertions':0,'failures':0,'errors':0,'skipped':0}
              for case in cases:
                  ident=(case.attrib.get('classname'),case.attrib.get('name'))
                  if not all(ident) or ident in identities:
                      raise SystemExit(f'duplicate/missing JUnit identity: {ident}')
                  identities.add(ident)
                  row['assertions']+=int(case.attrib.get('assertions','0'))
                  row['failures']+=len(case.findall('failure')); row['errors']+=len(case.findall('error')); row['skipped']+=len(case.findall('skipped'))
              actual={k:row[k] for k in ('cases','assertions','failures','errors','skipped')}
              if actual != expected[path.name]:
                  raise SystemExit(f'per-file qualification drift {path.name}: {json.dumps(actual,sort_keys=True)}')
              for k in ('cases','assertions','failures','errors','skipped'):
                  total[k]+=row[k]
              per_file.append(row)
          wanted={'test_files':6,'junit_files':3,'cases':17,'assertions':179,'failures':0,'errors':0,'skipped':0}
          if total != wanted:
              raise SystemExit('qualification aggregate drift: '+json.dumps(total,sort_keys=True))
          print(json.dumps({'total':total,'junit':per_file},sort_keys=True))
          PY
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git -C audit diff --exit-code
          git -C evidence diff --exit-code
          git -C platform diff --exit-code

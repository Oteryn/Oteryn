name: Organization audit account-character canonical projection (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/organization-audit-account-character-projection.yml
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json
      - docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md
      - docs/evidence/organization-audit-20260907/README.md
      - docs/evidence/organization-audit-20260907/CHECKPOINT-20260908-1552-CEST.md
      - docs/evidence/organization-audit-20260907/coverage-groups.json
      - docs/evidence/organization-audit-20260907/coverage-summary.json
      - docs/evidence/organization-audit-20260907/r3-platform-account-character-candidate.json
      - docs/evidence/organization-audit-20260907/r3-source-review.md
      - docs/evidence/organization-audit-20260907/unknowns.json
      - docs/evidence/organization-audit-20260907/verification-index.json
      - tools/audit/verify_report.py
      - tools/audit/verify_platform_account_character_group.py

permissions:
  contents: read

concurrency:
  group: audit-185-account-character-projection
  cancel-in-progress: false

jobs:
  project-canonical-package:
    if: github.event.pull_request.number == 185 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/20260907-org-comprehensive-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Generate and validate projected canonical package
        shell: bash
        env:
          PROJECTED_LEDGER_SHA256: b61566ad825adf528b177a5ab4a2ee533680bd948e44a60df6289255c5747459
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/projected" <<'PY'
          from copy import deepcopy
          import json
          from pathlib import Path
          import shutil
          import sys

          root = Path.cwd()
          out = Path(sys.argv[1])
          out.mkdir()
          sys.path.insert(0, str(root / 'tools' / 'audit'))
          import verify_report as report
          import verify_platform_account_character_group as account

          report_rel = Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.json')
          report_md_rel = Path('docs/evidence/OTERYN-ORGANIZATION-COMPREHENSIVE-AUDIT-20260907.md')
          evidence_rel = Path('docs/evidence/organization-audit-20260907')
          candidate_rel = evidence_rel / 'r3-platform-account-character-candidate.json'
          groups_rel = evidence_rel / 'coverage-groups.json'
          summary_rel = evidence_rel / 'coverage-summary.json'
          unknowns_rel = evidence_rel / 'unknowns.json'
          verification_rel = evidence_rel / 'verification-index.json'
          readme_rel = evidence_rel / 'README.md'
          source_review_rel = evidence_rel / 'r3-source-review.md'
          checkpoint_rel = evidence_rel / 'CHECKPOINT-20260908-1552-CEST.md'

          def read_json(rel):
              return json.loads((root / rel).read_text(encoding='utf-8'))

          def write_json(rel, data):
              path = out / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one replacement anchor, got {text.count(old)}')
              return text.replace(old, new, 1)

          def write_text(rel, text):
              path = out / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')

          candidate = read_json(candidate_rel)
          candidate['state'] = account.ADOPTED
          candidate['coverage_adopted'] = True
          candidate['qualification'] = deepcopy(account.PRIMARY_QUALIFICATION)
          candidate['limitations'] = (
              'Adopted only as bounded GROUPED carry-forward after exact historical/source identity, the exact 23-path dependent binding set, '
              'the exact ordered 15-file frozen-current qualification and the bound 86-case/586-assertion all-green result. This does not establish '
              'production readiness, later-current-main status, provider remediation, complete Platform correctness/security, or organization-wide audit completion.'
          )
          account.validate_candidate_shape(candidate)

          groups = read_json(groups_rel)
          ids = {row['id'] for row in groups['groups']}
          if ids & {spec[0] for spec in account.EXPECTED_FAMILIES}:
              raise SystemExit('account/character group already present before projection')
          groups['groups'].extend(account.expected_group(candidate, spec) for spec in account.EXPECTED_FAMILIES)
          account.validate_group_state(candidate, groups, True)

          summary = read_json(summary_rel)
          summary['per_repository']['platform']['grouped'] = 58
          summary['per_repository']['platform']['unverified_semantics'] = 1951
          summary['ledger_sha256'] = 'b61566ad825adf528b177a5ab4a2ee533680bd948e44a60df6289255c5747459'
          summary['durability'] = (
              'Full CSV accompanies the audit delivery. Committed DIRECT review rows, immutable Git trees, explicit accepted/rejected GROUPED records and '
              'verify_report.py reproduce every disposition. Platform GameAuth contributes 27 GROUPED paths and the separately qualified '
              'Accounts/CanaryIntegration/CharacterProfiles/Characters families contribute 31; the rejected 508-file Atlas candidate remains UNVERIFIED.'
          )
          summary['grouped_revalidated_paths'] = 58
          summary['semantically_classified_paths'] = 279
          summary['unverified_semantics_total'] = 4046
          summary['coverage_dimension_note'] = (
              'DIRECT records bounded current/source review, not universal approval. GROUPED records bounded semantic carry-forward only when historical scope, '
              'exact identity and current dependent qualification are all bound. Platform GameAuth contributes 27 GROUPED paths; four account/Canary/profile/'
              'character families contribute another 31 after exact 86-case/586-assertion frozen-current qualification; the Atlas 508-path candidate remains rejected.'
          )

          doc = read_json(report_rel)
          doc['revision'] = 'R3-NATIVE-EVIDENCE-POST-REVIEW-PLATFORM-ROUTES-GAMEAUTH-ACCOUNT-CHARACTER-RECONCILIATION'
          doc['grouped_revalidated_paths'] = 58
          doc['semantically_classified_paths'] = 279
          latest = doc['r3_review']['latest_completed_rereview']
          latest.update({
              'reviewed_head': '21c02cac9cbb4e114741bab83985b48a817dfd35',
              'completed_at_utc': '2026-09-08T13:01:16.293440Z',
              'result': 'PASS_NO_NEW_P0_P1_P2',
              'p1': 0,
              'p2': 0,
              'new_material_findings': [],
              'historical_review_threads_resolved_after_readback': 15,
              'gameauth_review_threads_resolved_after_readback': 2,
          })
          doc['r3_review']['fresh_rereview_reason'] = (
              'The 31-path Platform Accounts/CanaryIntegration/CharacterProfiles/Characters GROUPED expansion is material evidence added after the clean '
              '21c02cac GameAuth verifier-hardening re-review.'
          )
          doc['r3_platform_account_character_candidate'] = 'organization-audit-20260907/r3-platform-account-character-candidate.json'

          unknowns = read_json(unknowns_rel)
          semantic = next(row for row in unknowns['items'] if row['id'] == 'SEMANTIC-COVERAGE')
          semantic['reason'] = (
              'Source bytes available; 221 DIRECT scoped path reviews plus 58 bounded GROUPED Platform paths are now bound (27 GameAuth plus 31 '
              'Accounts/CanaryIntegration/CharacterProfiles/Characters), not full behavior approval; 4046 paths retain UNVERIFIED. The historical Atlas '
              '508-path candidate remains rejected and no automatic import from maintenance N/A or unproven summaries is allowed.'
          )
          independent = next(row for row in unknowns['items'] if row['id'] == 'INDEPENDENT-REVIEW')
          independent['reason'] = (
              'A clean exact-head Codex re-review of 21c02cac completed after the two GameAuth verifier P2 defects were fixed and both new threads were resolved. '
              'This later 31-path account/Canary/profile/character GROUPED expansion is new material and has not yet received its own fresh independent exact-head review.'
          )
          independent['effect'] = (
              'No self-awarded 10/10 or final independent acceptance is claimed for the expanded 58-GROUPED revision.'
          )

          verification = read_json(verification_rel)
          verification['r3_platform_account_character_qualification'] = {
              'frozen_source_commit': account.SOURCE_COMMIT,
              'historical_source_commit': account.HISTORICAL_COMMIT,
              'primary_qualification_head': account.PRIMARY_QUALIFICATION['qualification_head'],
              'primary_run': account.PRIMARY_QUALIFICATION['workflow_run'],
              'primary_job': account.PRIMARY_QUALIFICATION['job'],
              'verifier_unit_tests_at_primary': 8,
              'exact_family_counts': [7, 8, 4, 12],
              'exact_total_paths': 31,
              'dependent_blob_bindings': 23,
              'focused_test_files': 15,
              'focused_cases': 86,
              'focused_assertions': 586,
              'failures': 0,
              'errors': 0,
              'skips': 0,
              'php': '8.5.10',
              'mariadb': '11.8.9',
              'tracked_source_clean_after_execution': True,
              'hardening_head': 'a109c61da6845be43c8d44b10cec04116f09e4fe',
              'hardening_meta_ci_run': 34239058157,
              'hardening_qualification_run': 34239058179,
              'ledger_reproduction_head': '783673fbb5c849b035cc49976c6099e7655b39b0',
              'ledger_reproduction_run': 34239677668,
              'ledger_reproduction_artifact': 10061390705,
              'pre_adoption_ledger_sha256': 'db82a3bfa333521a4a21bf5e5e90ea816613186214ca92d59b6ce3394b0b7354',
              'projected_adopted_ledger_sha256': 'b61566ad825adf528b177a5ab4a2ee533680bd948e44a60df6289255c5747459',
              'qualification': 'BOUNDED_GROUPED_CARRY_FORWARD_NOT_PRODUCT_PASS',
          }

          readme = (root / readme_rel).read_text(encoding='utf-8')
          readme = replace_once(
              readme,
              'R3 contains 78 finding records, 23 A–W domains, 15 residual obligations, 221 DIRECT scoped path reviews and 27 bounded GROUPED GameAuth paths out of 4325 immutable leaves. `4077` leaves retain UNVERIFIED semantics.',
              'R3 contains 78 finding records, 23 A–W domains, 15 residual obligations, 221 DIRECT scoped path reviews and 58 bounded GROUPED Platform paths out of 4325 immutable leaves. `4046` leaves retain UNVERIFIED semantics.',
              'README accounting',
          )
          readme = replace_once(
              readme,
              '`r3-platform-gameauth-candidate.json` binds an accepted 27-path Platform GameAuth carry-forward after exact historical/source identity, 23 dependent blob bindings and 61/61 focused frozen-current tests; this remains bounded GROUPED evidence, not product PASS.',
              '`r3-platform-gameauth-candidate.json` binds an accepted 27-path Platform GameAuth carry-forward after exact historical/source identity, 23 dependent blob bindings and 61 focused frozen-current cases / 565 assertions. `r3-platform-account-character-candidate.json` separately binds four accepted Accounts/CanaryIntegration/CharacterProfiles/Characters families totaling 31 paths after exact 23 dependent bindings and 15 focused frozen-current files produced 86 cases / 586 assertions with zero failures/errors/skips. Both are bounded GROUPED evidence, not product PASS.',
              'README evidence map',
          )
          readme = replace_once(
              readme,
              'The temporary hosted collector is absent from the final task tree. No provider writes, deployment, new required gate, automatic background worker, full semantic completion or self-awarded score is implied.',
              'The R3 native hosted collector is absent from the effective tree. Temporary account/character qualification, ledger-reproduction and projection workflows remain only while this new GROUPED batch is being rebound and independently reviewed; they must be removed before the final stable audit tree. No provider writes, deployment, new required gate, automatic background worker, full semantic completion or self-awarded score is implied.',
              'README temp workflows',
          )

          md = (root / report_md_rel).read_text(encoding='utf-8')
          md = replace_once(md, '| platform | 2165 | 156 | 27 | 1982 |', '| platform | 2165 | 156 | 58 | 1951 |', 'report platform row')
          md = replace_once(md, '| **Total** | **4325** | **221** | **27** | **4077** |', '| **Total** | **4325** | **221** | **58** | **4046** |', 'report total row')
          old_para = (
              'Exactly 27 `app/GameAuth/**` leaves are additionally GROUPED: the earlier audit directly read all 27, the complete path/blob set and whole `app` tree are byte-identical at frozen `de917b3…`, 23 dependent blobs are source-bound, and 61 focused frozen-current cases / 565 assertions passed with zero failures/errors/skips. Separate exact-source concurrency evidence remains distinct. GROUPED is bounded semantic carry-forward, not product/security readiness. The rejected Atlas 508-path candidate remains UNVERIFIED. Full CSV is reproducible from immutable inventories, `coverage-review.tsv`, `coverage-groups.json` and the committed ledger digest.'
          )
          new_para = (
              'Exactly 58 Platform leaves are additionally GROUPED. The first 27 are `app/GameAuth/**`: the earlier audit directly read all 27, the complete path/blob set and whole `app` tree are byte-identical at frozen `de917b3…`, 23 dependent blobs are source-bound, and 61 focused frozen-current cases / 565 assertions passed with zero failures/errors/skips; separate exact-source concurrency evidence remains distinct. The additional 31 are four non-overlapping families — `app/Accounts/**` (7), `app/CanaryIntegration/**` (8), `app/CharacterProfiles/**` (4), and `app/Characters/**` (12). Their historical direct-read statement is bound to the immutable Platform audit publication, every family path/blob set is byte-identical at the same frozen source, the dependent map is exactly 23 paths including the ordered 15 focused tests, and qualification run `34230659158` / job `102075660945` produced exactly 86 cases / 586 assertions / 0 failures / 0 errors / 0 skips under PHP 8.5.10 with MariaDB 11.8.9. GROUPED is bounded semantic carry-forward, not product/security readiness. The rejected Atlas 508-path candidate remains UNVERIFIED. Full CSV is reproducible from immutable inventories, `coverage-review.tsv`, `coverage-groups.json` and ledger SHA-256 `b61566ad825adf528b177a5ab4a2ee533680bd948e44a60df6289255c5747459`.'
          )
          md = replace_once(md, old_para, new_para, 'report grouped paragraph')
          md = replace_once(
              md,
              'The Platform routes/GameAuth coverage expansion in this later revision is new material and therefore still requires fresh independent exact-head review.',
              'The Platform routes/GameAuth expansion and its two verifier P2 repairs received a clean exact-head re-review at `21c02cac9cbb4e114741bab83985b48a817dfd35`. The later 31-path Accounts/CanaryIntegration/CharacterProfiles/Characters GROUPED expansion is new material and therefore still requires fresh independent exact-head review.',
              'report review history',
          )
          md = replace_once(
              md,
              'The final task changes audit docs/evidence/tools only. Temporary acquisition workflow is removed, no new required check or provider/runtime/production change is introduced, and protected `meta-gate` / Merge Queue remain unchanged.',
              'The final task changes audit docs/evidence/tools only. Temporary qualification/reproduction workflows used for the 31-path GROUPED batch are not required checks and must be removed after adopted-state proof plus independent review; no provider/runtime/production change is introduced, and protected `meta-gate` / Merge Queue remain unchanged.',
              'report integration boundary',
          )

          source_review = (root / source_review_rel).read_text(encoding='utf-8')
          anchor = 'Read the nine named identity/session component sources in the path ledger. A controlled source-pinned characterization exists, but independent review established that its mechanism was present in public ancestor commits and public Actions artifacts. It must therefore be handled as already disclosed; the current report intentionally does not repeat the mechanism or PoC. Further assessment/remediation is routed through Platform `SECURITY.md` private vulnerability reporting. Current live reachability, artifact deletion/expiry, private-advisory submission and remediation remain unverified. Deleting the scripts from the final tree does not erase Git history or restore confidentiality.\n'
          addition = anchor + '\nSeparately, historical direct-read coverage for four account/Canary/profile/character families was reused only after fail-closed revalidation: `app/Accounts/**` (7), `app/CanaryIntegration/**` (8), `app/CharacterProfiles/**` (4), and `app/Characters/**` (12) are byte-identical between the historical audited Platform generation and frozen `de917b3…`. The candidate binds exactly 23 dependent blobs and an ordered 15-file test set; hosted PHP 8.5.10/MariaDB 11.8.9 qualification produced exactly 86 cases / 586 assertions / zero failures/errors/skips. These 31 leaves are bounded GROUPED carry-forward, not DIRECT current review, later-main acceptance, complete identity/security approval, or product readiness.\n'
          source_review = replace_once(source_review, anchor, addition, 'source review account family')

          checkpoint = (root / checkpoint_rel).read_text(encoding='utf-8')
          correction = (
              '> **Digest correction (2026-09-08):** deterministic 4,325-row ledger reproduction on head `783673fbb5c849b035cc49976c6099e7655b39b0`, run `34239677668`, artifact `10061390705`, proved that the pre-adoption 27-GROUPED digest is `db82a3bfa333521a4a21bf5e5e90ea816613186214ca92d59b6ce3394b0b7354`. The `db82a3bf425…` value originally written below was a checkpoint transcription error and is superseded; the checkpoint remains a historical pre-adoption state.\n\n'
          )
          checkpoint = replace_once(checkpoint, 'Checkpoint time: **2026-09-08 15:52 CEST**\n\n', 'Checkpoint time: **2026-09-08 15:52 CEST**\n\n' + correction, 'checkpoint correction')
          checkpoint = replace_once(
              checkpoint,
              '- current ledger SHA-256: `db82a3bf4256459bba548649211c6d3f9b435003ebf2fa2a2586aefcc771b283`',
              '- current ledger SHA-256: `db82a3bfa333521a4a21bf5e5e90ea816613186214ca92d59b6ce3394b0b7354` (corrected by deterministic reproduction; see note above)',
              'checkpoint digest',
          )

          write_json(candidate_rel, candidate)
          write_json(groups_rel, groups)
          write_json(summary_rel, summary)
          write_json(report_rel, doc)
          write_json(unknowns_rel, unknowns)
          write_json(verification_rel, verification)
          write_text(readme_rel, readme)
          write_text(report_md_rel, md)
          write_text(source_review_rel, source_review)
          write_text(checkpoint_rel, checkpoint)

          validation_root = Path('/tmp/projected-audit-validation')
          if validation_root.exists():
              shutil.rmtree(validation_root)
          shutil.copytree(root / 'docs' / 'evidence', validation_root / 'docs' / 'evidence')
          for rel in (candidate_rel, groups_rel, summary_rel, report_rel, unknowns_rel, verification_rel, readme_rel, report_md_rel, source_review_rel, checkpoint_rel):
              target = validation_root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(out / rel, target)
          result = report.validate(validation_root / report_rel)
          if result['grouped_revalidated_paths'] != 58 or result['semantically_classified_paths'] != 279 or result['unverified_semantics'] != 4046:
              raise SystemExit('projected accounting validation drift: ' + json.dumps(result, sort_keys=True))
          projected_candidate = account.read_json(validation_root / candidate_rel)
          projected_groups = account.read_json(validation_root / groups_rel)
          if not account.validate_candidate_shape(projected_candidate):
              raise SystemExit('projected candidate not adopted')
          account.validate_group_state(projected_candidate, projected_groups, True)
          print(json.dumps({'result': 'PROJECTED_CANONICAL_PACKAGE_VALID', 'grouped': 58, 'semantic': 279, 'unverified': 4046}, sort_keys=True))
          PY
      - name: Upload projected canonical package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit185-account-character-projection-${{ github.run_id }}
          path: ${{ runner.temp }}/projected
          if-no-files-found: error
          retention-days: 1
      - name: Final tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code

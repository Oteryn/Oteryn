name: META trusted AI review same-head recheck

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: meta-ai-review-recheck-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  recheck:
    if: >-
      github.actor == 'chatgpt-codex-connector[bot]' &&
      (github.event_name == 'pull_request_review' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - name: Re-run exact same-head trusted gate after reviewer evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          COMMENT_PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          pr_number = int(os.environ["REVIEW_PR"] or os.environ["COMMENT_PR"])
          token = os.environ["GH_TOKEN"]

          def api(path, *, method="GET"):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "oteryn-ai-review-same-head-recheck",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read().decode("utf-8")
                  return json.loads(raw) if raw else None

          pr = api(f"/repos/{repository}/pulls/{pr_number}")
          if pr.get("state") != "open":
              print("PR is no longer open; no recheck needed")
              raise SystemExit(0)
          head = pr.get("head") or {}
          head_repo = (head.get("repo") or {}).get("full_name")
          head_sha = str(head.get("sha") or "")
          if head_repo != repository or len(head_sha) != 40:
              raise SystemExit("live PR head identity is invalid or cross-repository")

          runs = api(
              f"/repos/{repository}/actions/workflows/governance-ai-review.yml/runs"
              "?event=pull_request_target&per_page=100"
          )
          candidates = []
          for run in runs.get("workflow_runs", []):
              if run.get("event") != "pull_request_target" or run.get("head_sha") != head_sha:
                  continue
              linked = run.get("pull_requests") or []
              if not any(int(item.get("number") or 0) == pr_number for item in linked):
                  continue
              candidates.append(run)
          if not candidates:
              print(f"no trusted gate run found for PR #{pr_number} head_sha={head_sha}")
              raise SystemExit(0)

          latest = max(candidates, key=lambda item: (str(item.get("created_at") or ""), int(item.get("id") or 0)))
          status = latest.get("status")
          conclusion = latest.get("conclusion")
          if status != "completed":
              print(f"trusted gate run {latest['id']} is {status}; no duplicate recheck")
              raise SystemExit(0)
          if conclusion == "success":
              print(f"trusted gate already succeeds for head_sha={head_sha}")
              raise SystemExit(0)
          if conclusion not in {"failure", "cancelled", "timed_out"}:
              print(f"trusted gate conclusion {conclusion!r} is not eligible for automatic recheck")
              raise SystemExit(0)

          current = api(f"/repos/{repository}/pulls/{pr_number}")
          current_head = (current.get("head") or {}).get("sha")
          if current.get("state") != "open" or current_head != head_sha:
              raise SystemExit("PR head changed before same-head recheck; refusing stale rerun")

          api(f"/repos/{repository}/actions/runs/{latest['id']}/rerun", method="POST")
          print(
              f"requested same-head pull_request_target rerun for PR #{pr_number} "
              f"head_sha={head_sha} source_event={event_name} run_id={latest['id']}"
          )
          PY
